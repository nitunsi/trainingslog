<style>
  /* Dunkel ist der Standard; Hell folgt der System-Einstellung oder dem Umschalter (data-theme). */
  :root{
    color-scheme:dark;
    --fs:1;
    --bg:#12201B;
    --surface:#1B2B24;
    --surface-2:#22362D;
    --line:#2C4038;
    --accent:#49B8A6;
    --accent-dim:#2E6F65;
    --on-accent:#0D1813;
    --text:#EDEDE4;
    --text-muted:#8FA79B;
    --placeholder:#7F978B;
    --filled-bg:var(--surface-2);
    --filled-border:var(--accent-dim);
    --amber:#D9A441;
    --danger:#D9705A;
    --accent-tint:rgba(73,184,166,0.10);
    --accent-tint-2:rgba(73,184,166,0.08);
    --amber-tint:rgba(217,164,65,0.12);
    --amber-tint-2:rgba(217,164,65,0.18);
    --saved-bg:#3B5147;
    --backdrop:rgba(0,0,0,0.6);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      color-scheme:light;
      --bg:#F3F5F1;
      --surface:#FFFFFF;
      --surface-2:#EAEFEA;
      --line:#D3DBD4;
      --accent:#17766A;
      --accent-dim:#A9D8CF;
      --on-accent:#FFFFFF;
      --text:#1B2A24;
      --text-muted:#5B6F65;
      --placeholder:#75897F;
      --filled-bg:#FFFFFF;
      --filled-border:#17766A;
      --amber:#8A5E00;
      --danger:#B4412B;
      --accent-tint:rgba(23,118,106,0.10);
      --accent-tint-2:rgba(23,118,106,0.08);
      --amber-tint:rgba(138,94,0,0.10);
      --amber-tint-2:rgba(138,94,0,0.16);
      --saved-bg:#D6E7E2;
      --backdrop:rgba(20,30,25,0.45);
    }
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#F3F5F1;
    --surface:#FFFFFF;
    --surface-2:#EAEFEA;
    --line:#D3DBD4;
    --accent:#17766A;
    --accent-dim:#A9D8CF;
    --on-accent:#FFFFFF;
    --text:#1B2A24;
    --text-muted:#5B6F65;
    --placeholder:#75897F;
    --filled-bg:#FFFFFF;
    --filled-border:#17766A;
    --amber:#8A5E00;
    --danger:#B4412B;
    --accent-tint:rgba(23,118,106,0.10);
    --accent-tint-2:rgba(23,118,106,0.08);
    --amber-tint:rgba(138,94,0,0.10);
    --amber-tint-2:rgba(138,94,0,0.16);
    --saved-bg:#D6E7E2;
    --backdrop:rgba(20,30,25,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  body{padding-bottom:0;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  .header{padding:22px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .themebtn{background:var(--surface);border:1px solid var(--line);color:var(--text-muted);border-radius:10px;min-height:40px;padding:8px 12px;font-size:11.5px;font-weight:600;font-family:'Inter',sans-serif;white-space:nowrap;}
  .header h1{font-size:22px;font-weight:700;letter-spacing:0.2px;}
  .header p{margin:4px 0 0;color:var(--text-muted);font-size:13px;}

  .daytabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 14px;-webkit-overflow-scrolling:touch;}
  .daytab{flex:0 0 auto;min-height:40px;padding:8px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--text-muted);font-size:12.5px;font-weight:600;font-family:'Space Grotesk',sans-serif;white-space:nowrap;}
  .daytab.active{background:var(--accent-dim);color:var(--text);border-color:var(--accent);}

  .streak{display:flex;align-items:center;gap:7px;padding:0 16px 14px;}
  .streak .dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
  .streak .dot.filled{background:var(--accent);}
  .streak .label{font-size:11px;color:var(--text-muted);margin-left:4px;}

  .datebar{display:flex;align-items:center;gap:10px;padding:0 16px 16px;}
  .datebar input[type=date]{background:var(--surface);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:8px 10px;border-radius:8px;flex:1;}
  .datebar select{background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:12.5px;padding:8px 10px;border-radius:8px;font-family:'Inter',sans-serif;}

  .warmup-toggle{margin:0 16px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--text-muted);}
  .warmup-toggle summary{cursor:pointer;font-weight:600;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;}
  .warmup-toggle table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px;}
  .warmup-toggle td{padding:3px 4px;border-bottom:1px solid var(--line);}
  .warmup-toggle td:last-child{text-align:right;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;}

  .block{margin:0 16px 24px;}
  .block-title{font-size:calc(12.5px*var(--fs));text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);font-weight:700;font-family:'Space Grotesk',sans-serif;margin:0 0 10px 2px;display:flex;align-items:center;gap:10px;}
  .block-title::after{content:"";flex:1;height:1px;background:var(--line);}

  .exrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;}
  .exrow.stretch{background:transparent;border-style:dashed;padding:9px 12px;}
  .exrow.stretch .exname{font-size:13px;}
  .exrow.stretch .exziel{font-size:11.5px;}
  .exrow.stretch .setboxes{margin-top:7px;}
  .exrow.stretch .setboxes input{padding:7px 10px;font-size:12.5px;}
  .exrow .exname{font-size:calc(14px*var(--fs));font-weight:600;}
  .exrow.stretch .exname{font-style:italic;font-weight:500;color:var(--text-muted);}
  .exrow .exziel{font-size:calc(12px*var(--fs));color:var(--text-muted);margin-top:2px;font-family:'IBM Plex Mono',monospace;}
  .setboxes{display:flex;gap:6px;margin-top:9px;}
  .setboxes input{flex:1;width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:calc(15px*var(--fs));font-weight:600;text-align:center;border-radius:7px;padding:9px 2px;}
  .setboxes input::placeholder{color:var(--placeholder);font-weight:400;}
  .setboxes input:not(:placeholder-shown){background:var(--filled-bg);border-color:var(--filled-border);color:var(--text);font-weight:700;}
  .setboxes input:focus{outline:none;border-color:var(--accent);}
  .exrow .extempo{font-size:calc(12px*var(--fs));color:var(--amber);margin-top:2px;font-weight:500;}
  .wcs{display:inline-flex;align-items:center;}
  .ic{width:1.15em;height:1.15em;vertical-align:-0.2em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .qi .ic{width:25px;height:25px;}
  .seg .ic{width:1.05em;height:1.05em;margin-right:4px;}
  .wc{display:inline-flex;align-items:center;gap:3px;width:37px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  .wc .wi{display:inline-flex;align-items:center;justify-content:center;width:16px;line-height:1;}
  .wc .wi .ic{width:15px;height:15px;vertical-align:0;}
  .wc b{font-weight:600;}
  .setboxes .sb{position:relative;flex:1;min-width:0;}
  .setboxes .sb .dlt{position:absolute;top:2px;right:6px;font-size:9.5px;font-weight:700;font-family:'IBM Plex Mono',monospace;pointer-events:none;}
  .last-hint:empty,.prevnote:empty{display:none;}
  .last-hint .takeBtn{background:var(--accent-tint);border:1px solid var(--accent-dim);border-radius:9px;min-height:36px;padding:0 12px;color:var(--accent);font-size:calc(12.5px*var(--fs));font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;white-space:nowrap;}
  .last-hint .takeBtn:active{filter:brightness(.92);}
  .last-hint .takeBtn[hidden]{display:none;}
  .last-hint .takeRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .steig{margin-top:6px;display:inline-block;max-width:100%;padding:3px 9px;border-radius:8px;background:var(--amber-tint-2);color:var(--amber);font-size:calc(12px*var(--fs));font-weight:700;}
  .steig[hidden]{display:none;}
  .flagrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);}
  .flagrow input[type=checkbox]{flex:none;width:24px;height:24px;accent-color:var(--accent);}
  .flagrow .fn{flex:1;font-size:14px;line-height:1.3;}
  .flagrow .fh{display:block;font-size:11.5px;color:var(--text-muted);}
  .flagnote{width:100%;margin:0 0 10px;min-height:42px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;}
  .flagnote[hidden]{display:none;}
  .steiglink{display:flex;align-items:center;justify-content:space-between;width:calc(100% - 32px);margin:0 16px 14px;min-height:48px;padding:0 14px;background:var(--amber-tint);border:1px solid var(--amber);border-radius:12px;color:var(--amber);font-size:13.5px;font-weight:700;font-family:'Inter',sans-serif;}
  .steiglink[hidden]{display:none;}
  .steigrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;}
  .steigrow:first-child{border-top:none;}
  .steigrow .sn{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .steigrow .sd{flex:none;font-size:11.5px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;}
  .trainsum{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);}
  .trainsum[hidden]{display:none;}
  .prevnote{margin-top:7px;padding-left:8px;border-left:2px solid var(--amber);font-size:calc(12px*var(--fs));line-height:1.4;color:var(--text-muted);font-style:italic;white-space:pre-wrap;}
  .histBtn,.noteBtn{position:relative;}
  .histBtn::after,.noteBtn::after{content:"";position:absolute;inset:-14px -8px;}
  .okmark{display:none;color:var(--accent);font-weight:700;margin-left:2px;}
  .exrow.done{border-color:var(--accent-dim);background:var(--accent-tint-2);}
  .exrow.done .last-hint,.exrow.done .prevnote{display:none;}
  .exrow.done .okmark{display:inline;}
  .noteBtn{background:none;border:none;font-size:12px;cursor:pointer;vertical-align:middle;opacity:.5;padding:0 3px;}
  .noteBtn.has{opacity:1;}
  .exnote{width:100%;margin-top:8px;min-height:46px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:'Inter',sans-serif;font-size:calc(13px*var(--fs));border-radius:8px;padding:8px 10px;resize:vertical;}
  .exnote[hidden]{display:none;}
  .exnote:focus{outline:none;border-color:var(--accent);}
  .hnote{margin-top:2px;padding-left:8px;border-left:2px solid var(--amber);font-style:italic;white-space:pre-wrap;}
  .exrow .goalhint{display:none;margin-top:7px;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-tint);border:1px solid var(--accent-dim);border-radius:7px;padding:5px 9px;}
  .exrow .goalhint.show{display:block;}
  .more-toggle{margin:0 16px 16px;}
  .more-toggle > summary{cursor:pointer;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;color:var(--text);}
  .more-toggle > summary::-webkit-details-marker{display:none;}
  .more-toggle > summary::before{content:"▸ ";color:var(--text-muted);}
  .more-toggle[open] > summary::before{content:"▾ ";}
  .more-toggle > summary span{color:var(--text-muted);font-family:'Inter',sans-serif;font-weight:400;font-size:11.5px;}
  .more-toggle > .more-body{margin-top:12px;}
  .more-toggle > .more-body > div{margin-left:0 !important;margin-right:0 !important;}
  .toast{z-index:100;}
  .offline-pill{margin-left:auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;background:var(--amber-tint-2);color:var(--amber);border:1px solid var(--amber);}
  .offline-pill[hidden]{display:none;}
  .appicon{width:30px;height:30px;border-radius:8px;flex:none;display:block;}
  .appicon.big{width:104px;height:104px;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.3);}
  .header{gap:12px;justify-content:flex-start;}
  #splash{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--bg);color:var(--text);transition:opacity .35s ease;}
  #splash.done{opacity:0;pointer-events:none;}
  #splash .appicon.big{margin-bottom:14px;animation:splashpop .6s ease-out both;}
  .splash-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;letter-spacing:.2px;}
  .splash-sub{font-size:14px;color:var(--text-muted);}
  .splash-load{margin-top:26px;font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:2px;}
  .splash-load .dots{display:inline-flex;gap:3px;margin-left:5px;}
  .splash-load .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:splashdot 1.2s infinite ease-in-out both;}
  .splash-load .dots i:nth-child(2){animation-delay:.15s;} .splash-load .dots i:nth-child(3){animation-delay:.3s;}
  @keyframes splashdot{0%,80%,100%{opacity:.25;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}
  @keyframes splashpop{from{opacity:0;transform:scale(.88);}to{opacity:1;transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){ #splash .appicon.big,.splash-load .dots i{animation:none;} }

  /* Seiten und untere Leiste (wie beim Tunsi Trainer) */
  .page{display:none;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px) + 28px);}
  .page.on{display:block;}
  body.p-train .page{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px) + 96px);}
  .pagehead{padding:20px 16px 10px;}
  .pagehead h1{font-size:22px;font-weight:700;}
  .pagehead .sub{margin-top:4px;color:var(--text-muted);font-size:13px;}
  #tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);}
  #tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;padding:0;background:none;border:none;color:var(--text-muted);font-size:11.5px;font-weight:600;font-family:'Inter',sans-serif;}
  #tabbar button.a{color:var(--accent);}
  #tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .nextopen{flex:none;min-width:88px;min-height:54px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px;font-weight:700;font-family:'Space Grotesk',sans-serif;}

  .startbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .bigbtn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:78px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);text-align:left;font-family:'Space Grotesk',sans-serif;}
  .bigbtn .bt{font-size:16px;font-weight:700;}
  .bigbtn .bs{font-size:12px;font-weight:400;color:var(--text-muted);font-family:'Inter',sans-serif;}
  .bigbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .bigbtn.primary .bs{color:var(--on-accent);opacity:.88;}
  .bigbtn.wide{width:100%;align-items:center;min-height:56px;}

  .trainbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);}
  .trainx{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:17px;}
  #pageTrain .block-title{position:sticky;top:64px;z-index:20;background:var(--bg);padding:9px 2px 7px;margin:0 0 6px 2px;}
  .tbar{flex:1;height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;}
  .tbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s;}
  .tcount{flex:none;min-width:5.6rem;white-space:nowrap;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--text-muted);}

  .tsave{flex:none;width:1.4em;text-align:center;font-weight:700;font-size:15px;color:var(--text-muted);}
  .tsave[data-st="saved"]{color:var(--accent);}
  .tsave[data-st="error"]{color:var(--danger);}
  .tsave[data-st="queued"]{color:var(--amber);}
  .sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 6px;}
  .sum-stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;}
  .sum-stats b{display:block;font-family:'Space Grotesk',sans-serif;font-size:22px;}
  .sum-stats span{font-size:11.5px;color:var(--text-muted);}
  .sum-h{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;margin:16px 0 4px;}
  .sum-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;}
  .sum-row b{flex:none;font-family:'IBM Plex Mono',monospace;}
  .sum-row .up{color:var(--accent);}
  .sum-row .dn{color:var(--amber);}
  .sum-note{padding:8px 0 8px 10px;border-left:2px solid var(--amber);margin-top:6px;font-size:13px;color:var(--text-muted);font-style:italic;white-space:pre-wrap;}
  .sum-empty{margin-top:14px;color:var(--text-muted);font-size:13.5px;}
  .wu-group{margin:0 16px 12px;padding:12px 14px 6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;}
  .wu-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:calc(14px*var(--fs));margin-bottom:4px;}
  .wu-group table{width:100%;border-collapse:collapse;font-size:calc(14px*var(--fs));}
  .wu-group td{padding:9px 2px;border-bottom:1px solid var(--line);vertical-align:top;}
  .wu-group tr:last-child td{border-bottom:none;}
  .wu-group td:last-child{text-align:right;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;white-space:nowrap;padding-left:12px;}

  .seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .seg button{flex:1;min-height:48px;background:var(--surface);border:none;border-right:1px solid var(--line);color:var(--text-muted);font-size:14px;font-weight:600;font-family:'Inter',sans-serif;}
  .seg button:last-child{border-right:none;}
  .seg button.on{background:var(--accent);color:var(--on-accent);}
  .recentbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 12px;}
  .recentbox .recent-row:first-child{border-top:none;}
  .morebtn{display:block;width:calc(100% - 4px);margin:8px 2px 10px;min-height:46px;background:none;border:1px dashed var(--line);color:var(--text-muted);border-radius:12px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;}
  .moreend{padding:10px 2px 12px;text-align:center;font-size:11.5px;color:var(--text-muted);}
  .sheet-grip{width:42px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;}
  .sheet-panel{box-shadow:0 -8px 28px rgba(0,0,0,.45);}
  :root[data-theme="light"] .sheet-panel{box-shadow:0 -8px 28px rgba(20,40,30,.18);}
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .sheet-panel{box-shadow:0 -8px 28px rgba(20,40,30,.18);} }
  :root[data-theme="light"] .daycard,:root[data-theme="light"] .exrow:not(.stretch),:root[data-theme="light"] .sec,:root[data-theme="light"] .wkcard{box-shadow:0 1px 2px rgba(20,40,30,.07);}
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .daycard,:root:not([data-theme="dark"]) .exrow:not(.stretch),:root:not([data-theme="dark"]) .sec,:root:not([data-theme="dark"]) .wkcard{box-shadow:0 1px 2px rgba(20,40,30,.07);} }

  /* Tageskarte: aktueller Trainingstag, Datum, Schnell-Einträge */
  .daycard{margin:0 16px 14px;padding:13px 14px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;}
  .daycard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .daycard-meta{font-size:calc(11.5px*var(--fs));color:var(--text-muted);font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .chip{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--accent-dim);color:var(--text);}
  .chip.warn{background:var(--amber-tint-2);color:var(--amber);}
  .daycard-focus{margin-top:2px;font-size:calc(13px*var(--fs));color:var(--text-muted);line-height:1.35;}
  .daycard-focus:empty{display:none;}
  .pagehead .daycard-focus{margin:2px 0 6px;}
  .daycard-last{margin-top:3px;font-size:calc(12px*var(--fs));color:var(--text-muted);}
  .daycard-last:empty{display:none;}
  .plancard{margin:0 16px 14px;padding:12px 14px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;}
  .plancard:empty{display:none;}
  .plan-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;}
  .plan-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;}
  .plan-sub{font-size:11.5px;color:var(--text-muted);}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .slot{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;justify-content:center;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-muted);font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;}
  .slot .sd{font-size:13px;line-height:1;}
  .slot.done{color:var(--accent);border-color:var(--accent-dim);}
  .slot.cur{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .daycard-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:calc(19px*var(--fs));margin-top:3px;}
  .daycard-change{flex:0 0 auto;min-height:40px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-muted);border-radius:10px;padding:8px 12px;font-size:11.5px;font-weight:600;font-family:'Inter',sans-serif;}
  .nextchip{display:block;width:100%;text-align:left;margin-top:10px;background:var(--accent-tint);border:1px solid var(--accent-dim);color:var(--text);border-radius:8px;padding:8px 10px;font-size:12px;font-family:'Inter',sans-serif;}
  .nextchip b{font-family:'Space Grotesk',sans-serif;}
  div.nextchip{border-style:dashed;color:var(--text-muted);}
  .quickrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px;}
  .quickrow button{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 2px 8px;color:var(--text);font-family:'Inter',sans-serif;}
  .quickrow .qi{display:block;font-size:19px;line-height:1.1;}
  .quickrow .ql{display:block;font-size:11px;margin-top:3px;font-weight:600;}
  .quickrow .qdot{display:none;position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .quickrow button.has{border-color:var(--accent-dim);}
  .quickrow button.has .qdot{display:block;}
  .daypanel{margin:0 0 14px;}
  .daypanel[hidden]{display:none;}

  /* Bottom-Sheet: alle Einträge eines Tages */
  .sheet{position:fixed;inset:0;z-index:50;display:none;}
  .sheet.open{display:block;}
  .sheet-backdrop{position:absolute;inset:0;background:var(--backdrop);}
  .sheet-panel{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;}
  .sheet-head h2{font-size:16px;}
  .sheet-x{background:var(--surface);border:1px solid var(--line);color:var(--text-muted);border-radius:10px;width:42px;height:42px;font-size:16px;}
  .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 8px;}
  .sheet-foot{padding:10px 16px 16px;border-top:1px solid var(--line);}
  .sheet-date{display:flex;gap:6px;align-items:center;margin-bottom:12px;}
  .sheet-date input[type=date]{flex:1;min-width:0;min-height:44px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:14px;padding:8px 10px;border-radius:10px;}
  .sheet-date button{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;min-height:44px;padding:8px 14px;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;}
  .sheet-date .today{font-size:12px;color:var(--accent);}
  .sheet-training{margin-bottom:12px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .sheet-training button{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:7px;padding:6px 10px;font-size:11.5px;font-weight:600;}
  .sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px 12px;margin-bottom:10px;}
  .sec.focus{border-color:var(--accent);}
  .sec h3{font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .sec .st{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;color:var(--text-muted);}
  .sec .st.ok{color:var(--accent);}
  .sec textarea{width:100%;min-height:58px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:'Inter',sans-serif;font-size:13.5px;border-radius:8px;padding:9px 11px;resize:vertical;}
  .sec .bodygrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .sec .bodygrid label{font-size:10.5px;color:var(--text-muted);display:block;margin-bottom:3px;}
  .sec input.num,.sec input.tm{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;text-align:center;padding:9px 2px;border-radius:7px;}
  .sec .bodytime{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;color:var(--text-muted);}
  .sec .bodytime input{width:110px;}
  .sec .bodyhint{font-size:10px;color:var(--text-muted);margin-top:8px;}
  .sec .secdel{margin-top:6px;background:none;border:none;color:var(--danger);font-size:12.5px;padding:10px 0 4px;min-height:40px;font-family:'Inter',sans-serif;}
  .sheet input:focus,.sheet textarea:focus{outline:none;border-color:var(--accent);}
  .recent{margin:4px 0 6px;}
  .recent > summary{cursor:pointer;font-size:12.5px;font-weight:600;font-family:'Space Grotesk',sans-serif;color:var(--text-muted);padding:8px 2px;}
  .recent-row{display:flex;gap:10px;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line);padding:8px 2px;color:var(--text);font-family:'Inter',sans-serif;}
  .recent-row .rd{flex:0 0 74px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-muted);padding-top:1px;}
  .recent-row .rs{flex:1;font-size:calc(12px*var(--fs));line-height:1.45;}
  .recent-row.cur{background:var(--accent-tint-2);}

  .fabs{display:none;position:fixed;z-index:35;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px) + 12px);justify-content:center;gap:10px;pointer-events:none;}
  body.p-train .fabs{display:flex;}
  .fab{pointer-events:auto;min-height:54px;min-width:170px;padding:0 26px;border-radius:30px;border:0;background:var(--accent);color:var(--on-accent);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(23,118,106,.35);}
  .fab[hidden]{display:none;}
  .fab:active{transform:scale(.97);}
  .savebtn{width:100%;min-height:54px;background:var(--accent);color:var(--on-accent);border:none;border-radius:12px;padding:14px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.2px;}
  .savebtn:active{background:var(--accent-dim);color:var(--text);}
  .savebtn.saved{background:var(--saved-bg);color:var(--accent);}

  .toast{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;text-align:center;background:var(--surface);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:20px;font-size:13px;line-height:1.35;box-shadow:0 4px 18px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;}
  body.p-train .toast{bottom:calc(64px + env(safe-area-inset-bottom,0px) + 84px);}
  .toast.show{opacity:1;}

  .last-hint{font-size:calc(11px*var(--fs));color:var(--text-muted);margin-top:5px;}

  /* Optik-Feinschliff: ruhigere Übungskopfzeile, weiche Karten, klarere Eingabefelder */
  :root{--shadow:0 1px 2px rgba(20,40,32,.06),0 4px 14px rgba(20,40,32,.05);--line-strong:#BCC8BF;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.3);--line-strong:#3C5348;}}
  :root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.3);--line-strong:#3C5348;}
  .exrow{border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);}
  .exrow.stretch{box-shadow:none;}
  .exrow .exname{display:flex;align-items:flex-start;gap:8px;line-height:1.3;}
  .exrow .exn{flex:1;min-width:0;}
  .exrow .exacts{flex:none;display:inline-flex;gap:2px;margin:-5px -7px 0 0;}
  .exrow .exacts button{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;background:none;border:none;border-radius:9px;color:var(--text-muted);cursor:pointer;opacity:.75;padding:0;}
  .exrow .exacts button:active{background:var(--surface-2);}
  .exrow .exacts .noteBtn.has{opacity:1;color:var(--accent);}
  .exrow .exacts .ic{width:17px;height:17px;vertical-align:0;}
  .exrow .exziel{margin-top:3px;}
  .setboxes{gap:8px;margin-top:11px;}
  .setboxes input{border-radius:10px;padding:11px 2px;border-color:var(--line-strong);}
  .setboxes input:not(:placeholder-shown){border-color:var(--filled-border);}
  .setboxes input:focus{box-shadow:0 0 0 3px var(--accent-tint);}
  .daycard,.sec,.wkcard{border-radius:14px;}
  .block{margin-bottom:26px;}
  .block-title{margin-bottom:12px;}
  .setboxes input.jumpflash{animation:jumpflash 1.4s ease-out;}
  @keyframes jumpflash{0%,60%{box-shadow:0 0 0 3px var(--accent);border-color:var(--accent);}100%{box-shadow:0 0 0 3px transparent;}}
  /* ===== Ruhiger: Text-Bereiche ohne Kasten, nur Bedienelemente mit Rahmen ===== */
  :root{--hair:color-mix(in srgb,var(--line) 55%,transparent);}
  .daycard,.plancard,.exrow,.wu-group,.recentbox,.sum-stats div,.sec,.sheet-training,.wkcard{background:transparent!important;border:0!important;border-top:1px solid var(--hair)!important;border-radius:0!important;box-shadow:none!important;}
  .exrow{padding-left:0;padding-right:0;}
  .daycard,.plancard,.wkcard,.wu-group{padding-left:0!important;padding-right:0!important;}
  .bigbtn{border-radius:22px;}
  .bigbtn.primary,.bigbtn.wide{border-radius:30px;}
  .daytab,.slot,.quickrow button,.themebtn{border-radius:20px;}
  #tabbar{border-top:0!important;background:var(--bg)!important;box-shadow:0 -6px 18px rgba(0,0,0,.10);}

  /* ===== Startseite: ein Blick – Heute groß, Plan, Wochenzahlen leise, Zusatz-Einträge als Pillen ===== */
  #pageStart .daycard{margin-bottom:8px;padding-top:16px!important;}
  #pageStart .daycard-title{font-size:calc(30px*var(--fs));line-height:1.1;margin-top:5px;}
  #pageStart .daycard-focus{margin-top:4px;}
  #pageStart .daycard-last{margin-top:2px;opacity:.85;}
  #pageStart .startbtns{grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;}
  #pageStart .startbtns .bigbtn.primary{grid-column:1/-1;order:-1;min-height:64px;flex-direction:row;align-items:baseline;justify-content:center;gap:10px;}
  #pageStart .startbtns .bigbtn.primary .bt{font-size:18px;}
  #pageStart .startbtns .bigbtn:not(.primary){min-height:48px;flex-direction:row;align-items:center;justify-content:center;border-radius:24px;}
  #pageStart .startbtns .bigbtn:not(.primary) .bs{display:none;}
  #pageStart .startbtns .bigbtn:not(.primary) .bt{font-size:14px;}
  #pageStart .startbtns .daycard-change{min-height:48px;border-radius:24px;font-size:14px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--text);padding:0 12px;}
  #pageStart .plancard{margin-top:6px;margin-bottom:6px;padding-top:14px!important;padding-bottom:10px!important;}
  #pageStart .slot{min-height:46px;flex-direction:row;gap:6px;border-radius:20px;}
  #pageStart .steiglink{width:auto;min-height:36px;margin:2px auto 8px;padding:0 14px;gap:8px;border-radius:20px;font-size:12.5px;display:flex;}
  #pageStart .steiglink[hidden]{display:none;}
  #pageStart .wkcard{margin:0 16px 4px!important;padding:12px 0 6px!important;}
  #pageStart .quickcard{margin-top:0;padding-top:12px!important;}
  #pageStart .quickcap{font-size:11.5px;color:var(--text-muted);text-align:center;margin-bottom:8px;}
  #pageStart .quickrow{margin-top:0;gap:6px;}
  #pageStart .quickrow button{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:5px;padding:0 4px;min-height:42px;}
  #pageStart .quickrow .qi{display:inline-flex;}
  #pageStart .quickrow .qi .ic{width:17px;height:17px;}
  #pageStart .quickrow .ql{margin-top:0;font-size:11.5px;}

  /* Feinschliff Startseite: gleiche Farbe für alle Pillen, weniger Beschriftung */
  #pageStart .steiglink{background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-weight:600;}
  #pageStart .steiglink span:last-child{color:var(--accent);font-weight:700;}
  #pageStart .quickcap{display:none;}
  #pageStart .plan-sub{display:none;}
  #pageStart .plan-head{margin-bottom:8px;}
  #pageStart #weeklyHistBtn{background:none!important;border:0!important;padding:4px 2px!important;color:var(--text-muted)!important;}

  /* ===== Startseite im Stil der Tunsi-Startseite: mittig, luftig, ein Ring, ein Hauptknopf ===== */
  #pageStart .daycard{text-align:center;border-top:0!important;padding-top:6px!important;}
  #pageStart .daycard-meta{justify-content:center;}
  #pageStart .daycard-title{font-size:calc(32px*var(--fs));}
  #pageStart .planring{display:flex;flex-direction:column;align-items:center;margin-top:12px;}
  #pageStart .planring:empty{display:none;}
  #pageStart .ring-l1{margin-top:4px;font-size:13.5px;font-weight:700;}
  #pageStart .ring-l2{margin-top:1px;font-size:12px;color:var(--text-muted);}
  #pageStart .steiglink{background:none;border:0;color:var(--text-muted);min-height:36px;margin:8px auto 0;padding:0 8px;font-weight:500;}
  #pageStart .steiglink span:last-child{color:var(--accent);}
  #pageStart .startbtns{margin-top:6px;}
  #pageStart .plancard{margin-top:12px;}
  #pageStart .plan-head{display:none;}
  #pageStart .wkcard{padding-top:10px!important;}

  /* Zusatz-Einträge: nur Symbole, größer, ohne Rahmen und Fläche */
  #pageStart .quickrow{justify-content:space-around;gap:0;margin:2px 0 0;}
  #pageStart .quickrow button{background:none!important;border:0!important;border-radius:0;min-height:52px;padding:0;}
  #pageStart .quickrow .ql{display:none;}
  #pageStart .quickrow .qi .ic{width:30px;height:30px;stroke-width:1.6;}
  #pageStart .quickrow button.has .qdot{top:8px;right:calc(50% - 22px);}
  #pageStart .quickrow button:active{opacity:.6;}

  /* Wie bei Tunsi: außer dem Hauptknopf keine Rahmen und Flächen – Bedienelemente sind einfach Text/Symbole */
  #pageStart .startbtns .bigbtn:not(.primary),#pageStart .startbtns .daycard-change{background:none!important;border:0!important;min-height:52px;font-size:15px;color:var(--accent)!important;}
  #pageStart .startbtns .bigbtn:not(.primary) .bt{font-size:15px;color:var(--accent);}
  #pageStart .slot{background:none!important;border:0!important;min-height:44px;color:var(--text-muted);}
  #pageStart .slot.done{color:var(--accent);}
  #pageStart .slot.cur{color:var(--text);box-shadow:inset 0 -3px 0 var(--accent);border-radius:0;}
  #pageStart .slot.cur .sd{color:var(--accent);}
  #pageStart .steiglink{background:none!important;border:0!important;}

  /* Stimmigkeit: alles mittig, ruhiges Datum, gleiche Abstände, weniger Linien */
  #pageStart .daycard-meta{font-family:'Inter',sans-serif;font-size:calc(13px*var(--fs));letter-spacing:.01em;}
  #pageStart .daycard,#pageStart .plancard,#pageStart .wkcard,#pageStart .quickcard{border-top:0!important;}
  #pageStart .plancard{margin-top:14px;margin-bottom:0;padding:0!important;}
  #pageStart .wkcard{margin:10px 16px 0!important;padding:0!important;}
  #pageStart .quickcard{margin-top:6px;padding-top:0!important;}
  #pageStart .quickrow button{min-height:56px;}
  #pageStart .daycard{margin-bottom:0;}
  #pageStart .slot{min-height:40px;}

  /* Kopfbereich wirklich mittig; Hauptknopf einheitlich beschriftet */
  #pageStart .daycard-top{display:block;}
  #pageStart .daycard-top > div{width:100%;}
  #pageStart .startbtns .bigbtn.primary .bs{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;opacity:1;}

  /* Wochenübersicht: Diese Woche + die zwei davor immer sichtbar, ältere über „Verlauf“ */
  #pageStart .wkcard{margin:14px auto 0!important;padding:0!important;max-width:340px;}
  #pageStart .wkrow{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;font-size:13px;color:var(--text-muted);}
  #pageStart .wkrow.cur{color:var(--text);font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:14.5px;padding-top:4px;}
  #pageStart .wkd{font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
  #pageStart .wkc{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text);}
  #pageStart .wkrow.cur .wkc{font-size:14px;}
  #pageStart .wkmore{text-align:center;margin-top:2px;}
  #pageStart .wkmore button{background:none;border:0;color:var(--text-muted);font-size:12px;font-weight:600;font-family:'Inter',sans-serif;min-height:34px;padding:0 10px;}
  #pageStart #weeklyHistoryHolder .wkrow{border-top:0;}
  /* Platz besser nutzen, Pillen näher an die Mitte, Körper-Symbol leichter */
  #pageStart .planring svg{width:min(112px,13.5vh);height:min(112px,13.5vh);}
  #pageStart .startbtns{display:flex;flex-wrap:wrap;justify-content:center;column-gap:34px;}
  #pageStart .startbtns .bigbtn.primary{flex:0 0 100%;min-height:58px;}
  #pageStart .startbtns .bigbtn:not(.primary),#pageStart .startbtns .daycard-change{min-height:46px;padding:0 6px;}
  #pageStart .wkrow{padding:5px 4px;}
  #pageStart .wkmore button{min-height:28px;}
  #pageStart .plancard{margin-top:10px;}
  #pageStart .quickcard{margin-top:2px;}
  #pageStart .quickrow{max-width:340px;margin-left:auto;margin-right:auto;}
  #pageStart .quickrow .qi .ic{stroke-width:1.5;}

  /* Wochenübersicht: eine Schrift, bündige Spalten; Abstände zwischen den Texten vereinheitlicht */
  #pageStart .wkcard{max-width:330px;font-family:'Inter',sans-serif;}
  #pageStart .wkrow,#pageStart .wkrow.cur{font-family:'Inter',sans-serif;font-size:14px;padding:6px 0;gap:12px;}
  #pageStart .wkrow.cur{font-weight:700;color:var(--text);padding-top:0;}
  #pageStart .wkd{font-family:'Inter',sans-serif;font-size:14px;}
  #pageStart .wkrow .wkl{flex:1;min-width:0;white-space:nowrap;}
  #pageStart .wkc,#pageStart .wkrow.cur .wkc{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
  #pageStart .wkcs{display:grid;grid-template-columns:repeat(4,46px);justify-content:end;}
  #pageStart .wkcs .wc,#pageStart .wkc .wcs .wc{font-family:'Inter',sans-serif;font-size:14px;width:46px;justify-content:flex-start;}
  #pageStart .wkc .wcs{display:grid;grid-auto-flow:column;grid-auto-columns:46px;}
  #pageStart .wkc .wc b{font-weight:600;}
  #pageStart .daycard-meta{margin-bottom:6px;}
  #pageStart .daycard-title{margin-top:0;}
  #pageStart .daycard-focus{margin-top:8px;}
  #pageStart .daycard-last{margin-top:5px;}
  #pageStart .planring{margin-top:14px;}
  #pageStart .ring-l1{margin-top:8px;}
  #pageStart .ring-l2{margin-top:3px;}
  #pageStart .steiglink{margin-top:12px;}
  #pageStart .startbtns{margin-top:10px;}
  #pageStart .plancard{margin-top:12px;}
  #pageStart .wkcard{margin-top:16px!important;}

  /* Kompakt für kleine Handys (z. B. 360 x 740): alles ohne Scrollen */
  #pageStart #weeklyHistBtn{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:6px;min-height:30px;}
  #pageStart #weeklyHistBtn{color:var(--text)!important;font-weight:700;padding:0!important;}
  #pageStart .wkrow.cur{padding:0 0 2px;}
  #pageStart #weeklyHistBtn i{font-style:normal;font-size:11px;color:var(--text-muted);}
  #pageStart .planring svg{width:min(100px,13vh);height:min(100px,13vh);}
  #pageStart .planring{margin-top:10px;}
  #pageStart .ring-l1{margin-top:6px;font-weight:600;}
  #pageStart .daycard-title{font-size:calc(30px*var(--fs));}
  #pageStart .daycard-focus{margin-top:5px;}
  #pageStart .daycard-last{margin-top:2px;}
  #pageStart .steiglink{margin-top:8px;min-height:32px;}
  #pageStart .startbtns .bigbtn.primary{min-height:54px;}
  #pageStart .startbtns .bigbtn:not(.primary),#pageStart .startbtns .daycard-change{min-height:40px;}
  #pageStart .plancard{margin-top:6px;}
  #pageStart .slot{min-height:36px;}
  #pageStart .wkcard{margin-top:8px!important;}
  #pageStart .wkrow{padding:4px 0;}
  #pageStart .quickcard{margin-top:0;}
  #pageStart .quickrow button{min-height:48px;}

  /* Verlauf und Notiz: eigene Zeile unter den Feldern, größer und beschriftet (Tippfläche mind. 44 px) */
  .exrow .exfoot{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;margin-top:2px;}
  .exrow .exfoot .last-hint{flex:1 1 230px;min-width:0;margin-top:0;}
  .exrow .exacts{margin:0;margin-left:auto;gap:0;}
  .exrow .exacts button{width:auto;height:42px;padding:0 9px;gap:5px;font-size:12.5px;font-weight:600;font-family:'Inter',sans-serif;opacity:1;}
  .exrow .exacts button .ic{width:18px;height:18px;}
  .exrow .exacts .noteBtn{opacity:.8;}
  .exrow .exacts .noteBtn.has{opacity:1;color:var(--accent);}
  .exrow .exacts .noteBtn span:empty{display:none;}

  /* Aufwärmen: eine Seite ohne Überschrift und Weiter-Knopf (Leiste unten reicht), kompakte Zeilen */
  #pageWarmup{padding-bottom:0;}
  #pageWarmup .pagehead{padding:10px 16px 2px;}
  #pageWarmup .pagehead h1{display:none;}
  #pageWarmup .pagehead .sub{margin:0;text-align:center;font-size:12.5px;color:var(--text-muted);}
  #pageWarmup .wu-group{margin:0 16px calc(var(--wupad,4px) * 1.2);padding:6px 0 0!important;}
  #pageWarmup .wu-title{font-size:calc(12.5px*var(--fs));text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:4px 0 0;}
  #pageWarmup .wu-group table{font-size:calc(13.5px*var(--fs));}
  #pageWarmup .wu-group td{padding:var(--wupad,4px) 2px;border-bottom:0;}
  #pageWarmup .wu-group td:last-child{font-size:calc(12.5px*var(--fs));}

  /* ===== Training: ruhiger Kopf, Verlauf/Notiz als Symbole in der Titelzeile, leiser Hinweis ===== */
  #pageTrain .pagehead{padding:14px 16px 4px;text-align:center;}
  #pageTrain .pagehead h1{font-size:calc(26px*var(--fs));line-height:1.15;}
  #pageTrain .pagehead .daycard-focus{margin:3px 0 0;font-size:calc(13px*var(--fs));}
  #pageTrain .pagehead .daycard-meta{justify-content:center;margin-top:3px;font-family:'Inter',sans-serif;font-size:calc(12.5px*var(--fs));}
  .exrow .exname{align-items:center;}
  .exrow .exacts{margin:-8px -8px -8px 0;gap:0;}
  .exrow .exacts button{width:38px;height:44px;padding:0;opacity:.7;color:var(--text-muted);}
  .exrow .exacts button .ic{width:19px;height:19px;}
  .exrow .exacts .noteBtn.has{opacity:1;color:var(--accent);}
  .exrow .exziel,.exrow .extempo{font-family:'Inter',sans-serif;}
  .exrow .exziel{font-size:calc(12.5px*var(--fs));}
  .exrow .goalhint{background:none;border:0;border-radius:0;padding:0;margin-top:6px;font-weight:500;color:var(--text-muted);}
  .exrow .goalhint::first-letter{color:var(--accent);font-weight:700;}
  .exrow .last-hint{margin-top:3px;}

  /* ===== Training: Steigern-Hinweis und letzte Notiz ruhig untereinander, fertige Übungen zurückgenommen, Dehnungen wie normale Zeilen ===== */
  .exrow .steig{display:block;margin-top:7px;padding:0;border-radius:0;background:none;color:var(--text);font-weight:400;font-size:calc(12.5px*var(--fs));line-height:1.4;}
  .exrow .steig b{color:var(--amber);font-weight:700;}
  .exrow .prevnote{margin-top:3px;padding-left:0;border-left:0;font-size:calc(12.5px*var(--fs));color:var(--text-muted);font-style:normal;}
  .exrow.done{background:none!important;border-color:var(--hair)!important;opacity:.7;transition:opacity .2s;}
  .exrow.done:focus-within{opacity:1;}
  .exrow.stretch{border-top:1px solid var(--hair)!important;border-style:solid;padding-left:0;padding-right:0;}
  .exrow.stretch .exname{font-style:normal;font-weight:600;font-size:calc(14px*var(--fs));color:var(--text-muted);}
  .exrow.stretch .exziel{font-size:calc(12.5px*var(--fs));}
  .exrow.stretch .setboxes input{font-size:calc(13px*var(--fs));font-weight:400;font-family:'Inter',sans-serif;padding:9px 10px;}

  /* ===== Alte Sessions: Ansicht (nur lesen) ===== */
  .sv-top{padding:10px 16px 0;}
  .sv-top button{background:none;border:0;padding:6px 0;min-height:36px;color:var(--accent);font-weight:600;font-size:14px;font-family:'Inter',sans-serif;}
  .sv-head{padding:4px 16px 8px;text-align:center;}
  .sv-head h1{font-size:calc(26px*var(--fs));line-height:1.15;margin:0;}
  .sv-meta{margin-top:4px;font-size:13px;color:var(--text-muted);}
  .sv-block{margin:0 16px 20px;}
  .sv-row{padding:10px 0;border-top:1px solid var(--hair);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;}
  .sv-name b{display:block;font-size:calc(14.5px*var(--fs));font-weight:600;line-height:1.3;}
  .sv-name span{display:block;margin-top:1px;font-size:12px;color:var(--text-muted);}
  .sv-val{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-weight:700;font-size:calc(15px*var(--fs));text-align:right;white-space:nowrap;}
  .sv-val.long{grid-column:1/-1;text-align:left;white-space:normal;font-size:calc(14px*var(--fs));}
  .sv-sub{grid-column:1/-1;font-size:12.5px;color:var(--text-muted);line-height:1.4;}
  .sv-sub b{color:var(--amber);}
  .sv-note{padding:6px 0;font-size:14px;line-height:1.45;white-space:pre-wrap;}
  .sv-foot{padding:6px 16px 0;text-align:center;}
  .sv-foot button{background:none;border:0;color:var(--text-muted);font-size:13px;font-weight:600;text-decoration:underline;padding:12px;font-family:'Inter',sans-serif;}
  /* Eine alte Session wird bearbeitet: nichts abdunkeln, keine Stufen-Hinweise */
  body.p-old .exrow.done{opacity:1;}
  body.p-old .exrow .goalhint{display:none!important;}

  .recent-row .rline{display:block;width:100%;text-align:left;background:none;border:0;padding:3px 0;color:inherit;font:inherit;line-height:1.45;}
  .recent-row .rline b{font-weight:700;}
  .recent-row .rline .ic{color:var(--accent);}

  /* Training: Blockname ohne Linie daneben (direkt darunter steht schon die Trennlinie der ersten Übung) */
  #pageTrain .block-title::after{display:none;}
  /* Training: schmale Kopfleiste (Fortschritt, Zähler, Speicherstatus, Auswertung), kein ✕ mehr */
  .trainbar{padding:6px 16px;gap:10px;top:var(--vvt,0px);}
  .trainsum{width:36px;height:36px;border-radius:10px;}
  .tbar{height:6px;}
  .tcount{min-width:3.2rem;font-size:12.5px;}
  .tsave{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;padding:0;font-size:16px;}
  #pageTrain .block-title{top:calc(48px + var(--vvt,0px));}

  /* Startseite: restlicher Platz wird gleichmäßig zwischen Kopf, Heute, Plan, Wochen und Symbolen verteilt */
  #pageStart.on{display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-sizing:border-box;min-height:100vh;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px) + 22px);}
  #pageStart.on::after{content:"";height:0;}
  #pageStart.on > *{margin-top:0!important;margin-bottom:0!important;}
  #pageStart #dayPanel[hidden]{display:none;}
  /* Stufen f1–f4 (kumulativ): fitStart() verdichtet die Startseite so weit, bis sie ohne Scrollen passt */
  #pageStart.f1 .planring svg{width:78px;height:78px;}
  #pageStart.f1 .planring{margin-top:6px;}
  #pageStart.f1 .daycard-title{font-size:calc(27px*var(--fs));}
  #pageStart.f1 .daycard-meta{margin-bottom:3px;}
  #pageStart.f1 .ring-l1{margin-top:4px;}
  #pageStart.f1 .steiglink{margin-top:4px;min-height:30px;}
  #pageStart.f1 .startbtns .bigbtn.primary{min-height:50px;}
  #pageStart.f1 .startbtns .bigbtn:not(.primary),#pageStart.f1 .startbtns .daycard-change{min-height:38px;}
  #pageStart.f1 .slot{min-height:34px;}
  #pageStart.f1 .quickrow button{min-height:44px;}
  #pageStart.f1 .wkrow{padding:3px 0;}
  #pageStart.f2 .planring svg{width:62px;height:62px;}
  #pageStart.f2 .planring{margin-top:4px;}
  #pageStart.f2 .daycard-title{font-size:calc(24px*var(--fs));}
  #pageStart.f2 .daycard-last{display:none;}
  #pageStart.f2 .ring-l1{margin-top:2px;font-size:12.5px;}
  #pageStart.f2 .startbtns{margin-top:2px;}
  #pageStart.f2 .startbtns .bigbtn.primary{min-height:46px;}
  #pageStart.f2 .startbtns .bigbtn:not(.primary),#pageStart.f2 .startbtns .daycard-change{min-height:34px;}
  #pageStart.f2 .slot{min-height:30px;}
  #pageStart.f2 .quickrow button{min-height:40px;}
  #pageStart.on.f2{gap:6px;}
  #pageStart.f3 .planring{display:none;}
  #pageStart.f3 .daycard-focus{display:none;}
  #pageStart.f3 .wkrow{padding:2px 0;}
  #pageStart.f4 .daycard-meta{display:none;}
  #pageStart.f4 .header{padding-top:6px;padding-bottom:0;}
  #pageStart.f4 .slot{min-height:28px;}
  #pageStart.f4 .quickrow button{min-height:36px;}
  /* Passt die Startseite auf den Bildschirm, wird gar nicht gescrollt (kein Wackeln) */
  html.nofit,html.nofit body{overflow:hidden;overscroll-behavior:none;}

  /* Übungs-Verlauf als Tabelle: Datum | Tag | Werte bündig */
  .hgrid{display:grid;grid-template-columns:max-content max-content 1fr;gap:3px 12px;align-items:baseline;font-size:12.5px;color:var(--text-muted);}
  .hgrid .hd{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--text);}
  .hgrid .hday{white-space:nowrap;}
  .hgrid .hval{color:var(--text);font-variant-numeric:tabular-nums;}
  .hgrid .hnote{grid-column:1/-1;margin:0 0 4px;color:var(--text-muted);}

  /* Reise-Tag: Umschalter A / B / C */
  .varsw{display:flex;margin:6px 16px 12px;border:1px solid var(--line-strong);border-radius:24px;overflow:hidden;}
  .varsw button{flex:1;min-height:44px;background:none;border:0;color:var(--text-muted);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;}
  .varsw button + button{border-left:1px solid var(--line);}
  .varsw button.on{background:var(--accent);color:var(--on-accent);}
  #blocksHolder .block[hidden]{display:none;}

  /* „Weiter“ fest oben rechts in der Kopfleiste (wird nie von der Tastatur verdeckt); unten nur Abschließen/Speichern */
  .trainbar .wbtn{flex:none;min-height:36px;padding:0 13px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;white-space:nowrap;}
  .trainbar .wbtn:active{transform:scale(.96);}
  .fabs[hidden]{display:none!important;}
</style>
</head>

<!-- ===== Ladebildschirm ===== -->

  <div class="header"><svg class="appicon" viewBox="0 0 512 512" aria-hidden="true"><use href="#appicon"/></svg><h1>Training</h1><span class="offline-pill" id="offlinePill" hidden>Offline</span></div>
  <div class="daycard" id="dayCard">

      <button data-type="sonstiges" aria-label="Sonstiges" title="Sonstiges"><span class="qi" data-ic="sonstiges"></span><span class="ql">Sonstiges</span><i class="qdot"></i></button>

    <div class="tbar"><i id="trainFill"></i></div>

  </div>

<div style="margin:0 16px 16px;">
  <div class="block-title" style="margin-bottom:6px;">Notizen zur Session</div>
  <textarea id="sessionNotes" placeholder="Allgemeines zur Session (optional) – z. B. wie es sich angefühlt hat, Auffälligkeiten, Ideen für Anpassungen…" style="width:100%;min-height:70px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;border-radius:10px;padding:11px 13px;resize:vertical;"></textarea>
</div>

<!-- ===== Seite: Einträge ===== -->
<main class="page" id="pageEntries">
  <div class="pagehead"><h1>Einträge</h1></div>
  <div class="block" id="steigBlock" hidden>
    <div class="block-title">Zum Steigern</div>
    <div class="recentbox" id="steigList"></div>
  </div>
  <div class="block">
    <div class="block-title">Verlauf</div>
    <div class="recentbox" id="entriesRecent"></div>
  </div>
</main>
<main class="page" id="pageMore">
  <div class="pagehead"><h1>Mehr</h1></div>
  <div class="block">

// zu übernehmen, wenn der Übungstyp (sammeln vs. bis Muskelversagen) übereinstimmt.
function zielType(ziel){
  if(!ziel) return null;
  if(ziel.startsWith("sammeln")) return "sammeln";
  if(ziel.includes("bis Muskelversagen")) return "max";
  return null;
}
// Ziel-Text einer Übung (per aktuellem Namen/Alias) innerhalb eines bestimmten Tagestyps finden.
function findZielFor(name, dayKey){
  const day = DAYS[dayKey];
  if(!day) return null;
  for(const block of day.blocks){
    for(const item of block.items){
      if(namesFor(item.uebung).includes(name)) return item.ziel;
    }
  }
  return null;
}

// Lese-Cache (IndexedDB): Antworten auf Lese-Anfragen werden abgelegt; fällt das Netz aus oder dauert zu lange,
// kommt der letzte Stand (mit Hinweis "Offline"). Schreibzugriffe laufen unverändert direkt zum Server.
const RC_DB = "training_cache", RC_STORE = "reads", RC_MAX = 160, NET_TIMEOUT = 12000;
let offlineSince = null;
function rcOpen(){
  return new Promise((res, rej)=>{
    const r = indexedDB.open(RC_DB, 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore(RC_STORE, { keyPath: "k" });
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function rcGet(k){
  try{
    const db = await rcOpen();
    return await new Promise(res => { const q = db.transaction(RC_STORE).objectStore(RC_STORE).get(k); q.onsuccess = ()=> res(q.result || null); q.onerror = ()=> res(null); });
  }catch(e){ return null; }
}
async function rcPut(entry){
  try{
    const db = await rcOpen();
    await new Promise(res => { const tx = db.transaction(RC_STORE, "readwrite"); tx.objectStore(RC_STORE).put(entry); tx.oncomplete = res; tx.onerror = res; });
    const all = await new Promise(res => { const q = db.transaction(RC_STORE).objectStore(RC_STORE).getAllKeys(); q.onsuccess = ()=> res(q.result || []); q.onerror = ()=> res([]); });
    if(all.length > RC_MAX){
      const rows = await new Promise(res => { const q = db.transaction(RC_STORE).objectStore(RC_STORE).getAll(); q.onsuccess = ()=> res(q.result || []); q.onerror = ()=> res([]); });
      rows.sort((a, b) => a.ts - b.ts).slice(0, rows.length - RC_MAX).forEach(r => db.transaction(RC_STORE, "readwrite").objectStore(RC_STORE).delete(r.k));
    }
  }catch(e){}
}
function setOffline(ts){
  offlineSince = ts || offlineSince || Date.now();
  const pill = document.getElementById("offlinePill");
  if(pill){ pill.hidden = false; pill.title = "Kein Netz – gezeigt wird der zuletzt geladene Stand"; }
}
function setOnline(){
  offlineSince = null;
  const pill = document.getElementById("offlinePill");
  if(pill) pill.hidden = true;
}
async function cachedFetch(input, init){
  const method = ((init && init.method) || (input instanceof Request ? input.method : "GET")).toUpperCase();
  if(method !== "GET") return fetch(input, init);
  const req = new Request(input, init);
  const key = req.url + "|" + (req.headers.get("Prefer") || "") + "|" + (req.headers.get("Range") || "");
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=> ctrl.abort(), NET_TIMEOUT);
    let res;
    try{ res = await fetch(req, { signal: ctrl.signal }); } finally { clearTimeout(timer); }
    setOnline();
    if(res.ok){
      const body = await res.clone().text();
      rcPut({ k: key, ts: Date.now(), status: res.status, ct: res.headers.get("content-type"), cr: res.headers.get("content-range"), body });
    }
    return res;
  }catch(e){
    const hit = await rcGet(key);
    if(hit){
      setOffline(hit.ts);
      const h = new Headers();
      if(hit.ct) h.set("content-type", hit.ct);
      if(hit.cr) h.set("content-range", hit.cr);
      return new Response(hit.body, { status: hit.status, headers: h });
    }
    setOffline();
    throw e;
  }
}

async function getPointer(){

      .from("training_sessions")

      .eq("person", PERSON)
      .eq("day_key", META_KEY)

// Aufwärmen füllt den Bildschirm: Zeilenabstand so groß wie möglich, solange alles ohne Scrollen passt
function fitWarmup(){
  const page = document.getElementById("pageWarmup");
  if(!page || !page.classList.contains("on")) return;
  const bar = document.getElementById("tabbar");
  const avail = window.innerHeight - (bar ? bar.getBoundingClientRect().height : 64) - 8;
  let best = 4;
  for(let pad = 4; pad <= 16; pad += 0.5){
    page.style.setProperty("--wupad", pad + "px");
    const last = page.querySelector("#warmupHolder").lastElementChild;
    if(last && last.getBoundingClientRect().bottom + window.scrollY > avail - 6) break;
    best = pad;
  }
  page.style.setProperty("--wupad", best + "px");
  // Passt es selbst mit engsten Zeilen nicht (sehr kleiner Bildschirm), unten Platz für die Leiste lassen
  const lastEl = page.querySelector("#warmupHolder").lastElementChild;
  page.style.paddingBottom = (lastEl && lastEl.getBoundingClientRect().bottom + window.scrollY > avail - 6) ? "84px" : "";
}
window.addEventListener("resize", fitWarmup);

function renderExRow(it){
  const row = document.createElement("div");
  row.className = "exrow" + (it.stretch ? " stretch" : "");
  const currentType = zielType(it.ziel);
  const prevKey = namesFor(it.uebung).find(n => lastSessionValues[n] !== undefined);
  let prev = [];
  if(prevKey){
    const entry = lastSessionValues[prevKey];
    const sourceType = zielType(findZielFor(prevKey, entry.dayKey));
    // Nur übernehmen, wenn kein eindeutiger Typkonflikt vorliegt (sammeln vs. bis Muskelversagen).
    if(!(currentType && sourceType && currentType !== sourceType)){
      prev = entry.value;
    }
  }

  const n = it.stretch || it.saetze === "-" ? 1 : parseInt(it.saetze,10);
  let boxes = "";
  if(it.stretch){
    const ph = prev[0] !== undefined && prev[0] !== "" ? prev[0] : "leer = alles ok";
    boxes = `<input type="text" data-ex="${escapeAttr(it.uebung)}" data-idx="0" placeholder="${escapeAttr(ph)}" style="text-align:left;font-family:'Inter',sans-serif;font-weight:400;font-size:13px;">`;
  } else {
    for(let i=0;i<n;i++){
      const ph = prev[i] !== undefined ? prev[i] : "";
      boxes += `<div class="sb"><input type="text" data-ex="${escapeAttr(it.uebung)}" data-idx="${i}" placeholder="${ph}"><span class="dlt"></span></div>`;
    }
  }
  const { base, tempo } = it.stretch ? { base: it.uebung, tempo: null } : splitExName(it.uebung);
  const zielLine = it.stretch ? it.ziel : it.ziel + (it.saetze!=="-" ? " · "+it.saetze+" Sätze" : "");
  row.innerHTML = `
    <div class="exname"><span class="exn">${base}<span class="okmark" aria-label="fertig">✓</span></span><span class="exacts"><button class="histBtn" type="button" title="Verlauf" aria-label="Verlauf">${ICON.clock}</button><button class="noteBtn" type="button" title="Notiz zur Übung" aria-label="Notiz zur Übung">${ICON.note}</button></span></div>
    ${tempo ? `<div class="extempo">${tempo}</div>` : ""}
    <div class="exziel">${zielLine}</div>
    <div class="steig" hidden></div>
    <div class="prevnote"></div>
    <div class="setboxes">${boxes}</div>
    <div class="last-hint"></div>
    ${it.stretch ? "" : `<div class="goalhint">✓ Obergrenze in allen Sätzen erreicht – Zeit für die nächste Stufe?</div>`}
    <textarea class="exnote" data-ex="${escapeAttr(it.uebung)}" rows="2" placeholder="Notiz zu dieser Übung – wird beim nächsten Mal angezeigt" hidden></textarea>
  `;
  const inputs = [...row.querySelectorAll(".setboxes input")];
  const hintEl = row.querySelector(".last-hint");
  const prevNoteEl = row.querySelector(".prevnote");
  const goalEl = row.querySelector(".goalhint");
  let last = null; // letzte echte Session (nicht das gerade geöffnete Datum)

  // "↑ Steigern": wird nie automatisch neu gesetzt; ein bestehendes Kennzeichen läuft aber weiter,
  // solange das Ergebnis mindestens so gut ist wie damals (oder das Ziel erreicht ist).
  row._exName = it.uebung;
  row._steigern = { choice: null, note: "", auto: false };   // choice: true = von dir gesetzt, false = von dir entfernt, null = offen
  const steigEl = row.querySelector(".steig");
  const pendingFlag = ()=>{ const l = lastRealSession(it.uebung); return l && l.flag && l.flag.on ? l.flag : null; };
  const allFilled = ()=> inputs.length > 0 && inputs.every(inp => inp.value.trim() !== "");
  row._flagDecision = ()=>{
    const st = row._steigern, cur = inputs.map(inp => inp.value.trim());
    if(st.choice === true) return { on: true, note: st.note || "", vals: cur };
    if(st.choice === false) return { on: false };
    const pf = pendingFlag();
    if(pf && allFilled() && flagHolds(pf.vals, cur, it.ziel)) return { on: true, auto: true, note: pf.note || "", vals: cur };
    return null;
  };
  row._renderSteig = ()=>{
    if(!steigEl) return;
    const st = row._steigern, pf = pendingFlag();
    let show = false, note = "";
    if(st.choice === true){ show = true; note = st.note; }
    else if(st.choice === null && pf){
      show = !allFilled() || flagHolds(pf.vals, inputs.map(inp => inp.value.trim()), it.ziel);
      note = pf.note || "";
    }
    steigEl.hidden = !show;
    steigEl.innerHTML = show ? "<b>↑ Steigern</b>" + (note ? " · " + escapeHtml(note) : "") : "";
  };

  // Index des ersten leeren Satzes mit Vorgabe vom letzten Mal (-1 = keiner)
  const nextTakeIndex = ()=> last ? inputs.findIndex((inp, i) => inp.value.trim() === "" && String(last.value[i] ?? "").trim() !== "") : -1;

  // Live: ▲/▼ gegenüber dem letzten Mal pro Satz, Ziel-Hinweis, Übernehmen-Knopf nur solange noch etwas offen ist
  const live = ()=>{
    const takeBtn = hintEl.querySelector(".takeBtn"), plusBtn = hintEl.querySelector(".plusBtn");
    const ti = nextTakeIndex(), tv = ti >= 0 ? String(last.value[ti]).trim() : "";
    if(takeBtn){ takeBtn.style.display = ti >= 0 ? "" : "none"; takeBtn.textContent = ti >= 0 ? "↺ Wie zuletzt: " + tv : ""; }
    // +1 nur, wenn der Wert vom letzten Mal eine reine Zahl ist (kein "6+5", "20s" o. Ä.)
    if(plusBtn){ const ok = ti >= 0 && /^\d+$/.test(tv); plusBtn.hidden = !ok; plusBtn.textContent = ok ? "＋1 → " + (parseInt(tv, 10) + 1) : ""; }
    inputs.forEach((inp, i)=>{
      const el = inp.parentElement.querySelector(".dlt");
      if(!el) return;
      const cur = numTotal(inp.value), old = last ? numTotal(last.value[i]) : null;
      if(cur !== null && old !== null && cur !== old){
        el.textContent = (cur > old ? "▲" : "▼") + fmtNum(Math.abs(cur - old));
        el.style.color = cur > old ? "var(--accent)" : "var(--amber)";
      } else {
        el.textContent = "";
      }
    });
    if(!it.stretch){
      row.classList.toggle("done", inputs.length > 0 && inputs.every(inp => inp.value.trim() !== ""));
      updateProgress();
    }
    row._renderSteig();
    if(goalEl){
      const typed = inputs.map(inp => inp.value.trim());
      // Sobald etwas eingetragen ist, zählen die eingetragenen Werte; sonst die letzte Session.
      const values = typed.some(v => v !== "") ? typed : (last ? last.value : []);
      goalEl.classList.toggle("show", goalReached(it.ziel, values, n) && !(steigEl && !steigEl.hidden));   // nie zwei Steigern-Hinweise gleichzeitig
    }
  };

  // Statisch (bei Aufbau, Datumswechsel, Laden einer Session): "zuletzt am …" + Übernehmen, letzte Notiz
  const refresh = ()=>{
    last = (!it.stretch && prev.length) ? lastRealSession(it.uebung) : null;
    hintEl.innerHTML = last ? `zuletzt am ${fmtShort(last.date)}<div class="takeRow"><button type="button" class="takeBtn"></button><button type="button" class="takeBtn plusBtn" hidden></button></div>` : "";
    // Nur EIN Satz pro Tipp: der erste noch leere Satz, zu dem es einen Wert vom letzten Mal gibt
    const takeInto = (plus)=>{
      const i = nextTakeIndex();
      if(i < 0){ showToast("Alle Sätze sind schon ausgefüllt"); return; }
      const old = String(last.value[i]).trim();
      if(plus && !/^\d+$/.test(old)) return;
      const v = plus ? String(parseInt(old, 10) + 1) : last.value[i];
      inputs[i].value = v;
      live();
      scheduleAutosave(400);
      showToast("Satz " + (i + 1) + ": " + v + (plus ? " (+1)" : " übernommen"));
    };
    const take = hintEl.querySelector(".takeBtn:not(.plusBtn)"), plus = hintEl.querySelector(".plusBtn");
    if(take) take.onclick = ()=> takeInto(false);
    if(plus) plus.onclick = ()=> takeInto(true);
    const pn = lastRealNote(it.uebung);
    prevNoteEl.innerHTML = pn ? `${ICON.note} ${fmtShort(pn.date)} · ${escapeHtml(pn.text)}` : "";
    live();
  };
  inputs.forEach(inp => inp.addEventListener("input", live));
  row._refresh = refresh;
  row._info = ()=>({
    name: base,
    cur: inputs.map(inp => inp.value.trim()),
    last: last ? last.value : null,
    ready: !!(goalEl && allFilled() && goalReached(it.ziel, inputs.map(inp => inp.value.trim()), inputs.length)),
  });

  // Notiz zu dieser Übung (für diese Session). Ohne Text bleibt nur der kleine Knopf sichtbar.
  const noteBtn = row.querySelector(".noteBtn");
  const noteTa = row.querySelector(".exnote");
  const syncNote = ()=> noteBtn.classList.toggle("has", noteTa.value.trim() !== "");
  noteBtn.onclick = (e)=>{
    e.preventDefault();
    if(noteTa.hidden){ noteTa.hidden = false; noteTa.focus(); }
    else if(noteTa.value.trim() === ""){ noteTa.hidden = true; }
    else noteTa.focus();
  };
  noteTa.addEventListener("input", syncNote);
  row._setNote = (text)=>{ noteTa.value = text || ""; noteTa.hidden = noteTa.value.trim() === ""; syncNote(); };

  refresh();
  attachHistoryButton(row, it.uebung);
  return row;
}

// Fortschritt der Session: fertig = alle Sätze einer Übung eingetragen (Dehnübungen sind freiwillig und zählen nicht)
function updateProgress(){
  // Gezählt werden Sätze (Eingabefelder), nicht Übungen. Dehnübungen sind freiwillig und zählen nicht.
  const sets = [...document.querySelectorAll("#blocksHolder .exrow:not(.stretch) .setboxes input")].filter(inp => !inp.closest(".block[hidden]"));
  const done = sets.filter(inp => inp.value.trim() !== "").length;
  const fill = document.getElementById("trainFill");
  if(fill) fill.style.width = sets.length ? Math.round(done / sets.length * 100) + "%" : "0%";
  const cnt = document.getElementById("trainCount");
  if(cnt) cnt.textContent = sets.length ? done + " / " + sets.length : "";
  progressDone = done; progressTotal = sets.length;
  const sumBtn = document.getElementById("trainSumBtn");
  if(sumBtn) sumBtn.hidden = done === 0;
  // Unten ein Knopf: „↓ Offen“, solange Sätze fehlen; danach „Training abschließen“.
  // Alte Sessions (kein Auto-Speichern): beide, der zweite heißt „Speichern“.
  const btn = document.getElementById("saveBtn"), fabs = document.getElementById("fabs");
  const oldSess = document.body.classList.contains("p-old"), complete = sets.length > 0 && done === sets.length;
  if(btn){
    btn.hidden = !oldSess && !complete;
    if(!btn.classList.contains("saved")) btn.textContent = oldSess ? "Speichern" : "Training abschließen";
    if(fabs) fabs.hidden = btn.hidden;
  }
  updateTrainSub();
}
let progressDone = 0, progressTotal = 0, trainSavedToday = false;
function updateTrainSub(){
  const el = document.getElementById("goTrainSub");
  if(!el) return;
  el.textContent = trainSavedToday ? "gespeichert ✓" : (progressDone > 0 ? progressDone + " / " + progressTotal + " Sätze" : "starten");
}

// ---------- Übersicht "Zum Steigern" (Start-Hinweis + Liste unter Einträge) ----------
let flagsStale = false;
function planExerciseNames(){
  const set = new Map();
  Object.keys(DAYS).forEach(k => DAYS[k].blocks.forEach(b => b.items.forEach(it => { if(!it.stretch) set.set(it.uebung, (set.get(it.uebung) || []).concat(DAYS[k].label)); })));

// ---------- Abschluss: Auswertung der Einheit ----------
function buildSummary(){
  const rows = [...document.querySelectorAll("#blocksHolder .exrow:not(.stretch)")];
  let setsDone = 0;
  const up = [], down = [], ready = [], notes = [];
  rows.forEach(r=>{
    const inf = r._info && r._info();
    if(!inf) return;
    setsDone += inf.cur.filter(v => v !== "").length;
    const curT = inf.cur.map(numTotal);
    const lastT = inf.last ? inf.last.slice(0, curT.length).map(numTotal) : null;
    if(lastT && lastT.length === curT.length && curT.every(x => x !== null) && lastT.every(x => x !== null)){
      const delta = curT.reduce((a,b)=>a+b,0) - lastT.reduce((a,b)=>a+b,0);
      if(delta > 0) up.push({ name: inf.name, delta });
      else if(delta < 0) down.push({ name: inf.name, delta });
    }
    if(inf.ready) ready.push(inf.name);
  });
  document.querySelectorAll("#blocksHolder textarea.exnote").forEach(ta=>{
    const v = ta.value.trim();
    if(v) notes.push({ name: splitExName(ta.getAttribute("data-ex")).base, text: v });
  });
  const sess = document.getElementById("sessionNotes").value.trim();
  const list = (items, cls, sign) => items.map(x => `<div class="sum-row"><span>${escapeHtml(x.name)}</span><b class="${cls}">${sign}${fmtNum(Math.abs(x.delta))}</b></div>`).join("");
  let html = `<div class="sum-stats"><div><b>${setsDone}</b><span>Sätze</span></div><div><b>${rows.length}</b><span>Übungen</span></div><div><b>${up.length}</b><span>gesteigert</span></div></div>`;
  if(up.length) html += `<div class="sum-h">▲ Gesteigert (Wiederholungen gesamt)</div>` + list(up, "up", "▲");
  if(down.length) html += `<div class="sum-h">▼ Weniger als beim letzten Mal</div>` + list(down, "dn", "▼");
  if(!up.length && !down.length) html += `<div class="sum-empty">Gleich wie beim letzten Mal – stabil.</div>`;
  html += `<div class="sum-h">↑ Nächstes Mal steigern</div><div id="sumFlags"></div>`;
  if(notes.length || sess){
    html += `<div class="sum-h">Deine Notizen</div>`
      + notes.map(n => `<div class="sum-note"><b>${escapeHtml(n.name)}:</b> ${escapeHtml(n.text)}</div>`).join("")
      + (sess ? `<div class="sum-note">${escapeHtml(sess)}</div>` : "");
  }
  return html;
}
// Schalter "Nächstes Mal steigern": nur Vorschläge, gesetzt wird nichts automatisch neu
function buildFlagsUi(){
  const box = document.getElementById("sumFlags");
  if(!box) return;
  const rows = [...document.querySelectorAll("#blocksHolder .exrow:not(.stretch)")];

    return { row: r, name: inf.name, ready: inf.ready, on: !!(dec && dec.on), auto: !!(dec && dec.on && dec.auto), note: (dec && dec.on && dec.note) || "" };
  });
  const group = (list, title, hint) => {
    if(!list.length) return "";
    return `<div class="sum-sub" style="font-size:11.5px;color:var(--text-muted);margin:8px 0 0;">${title}</div>` + list.map((x, i) => `
      <div class="flagrow" data-i="${items.indexOf(x)}">

      </div>
      <input class="flagnote" ${x.on ? "" : "hidden"} data-i="${items.indexOf(x)}" placeholder="Kurz notieren, z. B. 3–4 s runter" value="${escapeAttr(x.note)}">`).join("");
  };
  const active = items.filter(x => x.on), sugg = items.filter(x => !x.on && x.ready), rest = items.filter(x => !x.on && !x.ready);
  box.innerHTML = group(active, "Gekennzeichnet", x => x.auto ? "automatisch übernommen – Ergebnis stimmt weiter" : "")
    + group(sugg, "Vorschlag – Ziel erreicht", () => "nicht gesetzt, wenn du es nicht einschaltest")
    + (rest.length ? `<details style="margin-top:8px;"><summary style="cursor:pointer;font-size:12.5px;color:var(--text-muted);padding:8px 0;">Weitere Übung kennzeichnen</summary>${group(rest, "", () => "")}</details>` : "");
  const apply = (i, patch) => {
    const r = items[i].row;
    r._steigern = Object.assign({ choice: null, note: "", auto: false }, r._steigern, patch);
    r._renderSteig();
    flagsStale = true;

  box.querySelectorAll(".flagrow input[type=checkbox]").forEach(cb => cb.addEventListener("change", ()=>{

    if(cb.checked && noteEl) noteEl.focus({ preventScroll: true });

  box.querySelectorAll(".flagnote").forEach(inp => inp.addEventListener("input", ()=> apply(parseInt(inp.dataset.i, 10), { choice: true, auto: false, note: inp.value.trim() })));
}
