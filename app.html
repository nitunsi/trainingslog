// „Weiter“: springt (ohne Tastatur) zum nächsten Schritt nach dem zuletzt Eingetragenen – Satz oder Dehnung, je nachdem, was dran ist.
// Reihenfolge je Block: erster Satz jeder Übung, dann die Dehnung(en), dann der zweite Satz jeder Übung, wieder die Dehnung usw.
// Wo es schon Einträge gibt, gilt alles davor als erledigt (auch Dehnungen, die man leer lässt). Eine angesprungene Dehnung wird
// zusätzlich für diese Session gemerkt (localStorage), damit „Weiter“ nach einem Neuladen nicht wieder bei ihr landet.
function trainSteps(){
  const steps = [];
  document.querySelectorAll("#blocksHolder .block:not([hidden])").forEach(block => {
    const rows = [...block.querySelectorAll(".exrow:not(.stretch)")].map(r => [...r.querySelectorAll(".setboxes input")]);
    const stretch = [...block.querySelectorAll(".exrow.stretch .setboxes input")];
    const hasSets = rows.some(r => r.length);
    const rounds = Math.max(1, ...rows.map(r => r.length));
    for(let r = 0; r < rounds; r++){
      rows.forEach(inputs => { if(inputs[r]) steps.push({ inp: inputs[r], stretch: false }); });
      if(stretch.length && (hasSets || r === 0)) steps.push({ inp: stretch[0], inputs: stretch, stretch: true });
    }
  });
  return steps;
}
const stepDone = st => st.stretch ? st.inputs.some(i => i.value.trim() !== "") : st.inp.value.trim() !== "";
const trainCursorKey = () => currentDay + "|" + (document.getElementById("dateInput").value || todayStr()) + "|" + currentVariant;
function trainCursorGet(){
  try{ const c = JSON.parse(localStorage.getItem("training_cursor") || "null"); return c && c.k === trainCursorKey() ? c.i : -1; }catch(e){ return -1; }
}
function trainCursorSet(i){ try{ localStorage.setItem("training_cursor", JSON.stringify({ k: trainCursorKey(), i })); }catch(e){} }
function nextTrainStep(){
  const steps = trainSteps();
  let last = -1;
  steps.forEach((st, i) => { if(stepDone(st)) last = i; });
  const start = Math.max(last, trainCursorGet()) + 1;
  for(let i = start; i < steps.length; i++) if(!stepDone(steps[i])) return { step: steps[i], index: i };
  // hinter dem letzten Eintrag ist nichts mehr dran: übersprungene Sätze davor?
  for(let i = 0; i < steps.length; i++) if(!steps[i].stretch && !stepDone(steps[i])) return { step: steps[i], index: i };
  return null;
}
function jumpToNextOpen(){
  const hit = nextTrainStep();
  if(!hit){ showToast("Alles eingetragen ✓"); return; }
  if(hit.step.stretch) trainCursorSet(hit.index);
  const row = hit.step.inp.closest(".exrow");
  const offset = document.querySelector(".trainbar").getBoundingClientRect().height + 54;
  window.scrollTo({ top: row.getBoundingClientRect().top + window.scrollY - offset - 40, behavior: "smooth" });
  // Tastatur bleibt eingeklappt: nur hinscrollen, das Feld kurz hervorheben (Tippen öffnet die Tastatur dann selbst)
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  hit.step.inp.classList.remove("jumpflash"); void hit.step.inp.offsetWidth; hit.step.inp.classList.add("jumpflash");
}
document.getElementById("nextOpenBtn").addEventListener("click", jumpToNextOpen);
// Einen Eintrag gelöscht: gemerkte Dehnungs-Position ist veraltet, sonst überspringt „Weiter“ Übungen
document.addEventListener("input", e => {
  const t = e.target;
  if(t && t.matches && t.matches("#blocksHolder .setboxes input") && t.value.trim() === "") trainCursorSet(-1);
});

// Stimmt das Ergebnis noch? Ziel erreicht, oder im Schnitt pro Satz mindestens so viel wie zum Zeitpunkt des Kennzeichnens
function flagHolds(prevVals, curVals, ziel){
  if(goalReached(ziel, curVals, curVals.length)) return true;
  const a = (prevVals || []).map(numTotal), b = curVals.map(numTotal);
  if(!a.length || !b.length || a.some(x => x === null) || b.some(x => x === null)) return false;
  const avg = arr => arr.reduce((x, y) => x + y, 0) / arr.length;
  return avg(b) >= avg(a);
}

// Zahl bzw. Summe aus einem Satzwert: "10" -> 10, "6+5" -> 11, "20s" -> 20. Alles andere (z. B. "5x6kg") -> null.
function numTotal(v){
  const t = String(v ?? "").trim();
  if(!/^\d+(?:[.,]\d+)?\s*(?:s|sek|wdh)?(?:\s*\+\s*\d+(?:[.,]\d+)?\s*(?:s|sek|wdh)?)*$/i.test(t)) return null;
  return [...t.matchAll(/\d+(?:[.,]\d+)?/g)].reduce((a, m) => a + parseFloat(m[0].replace(",", ".")), 0);
}
function fmtNum(x){ return String(Math.round(x * 10) / 10).replace(".", ","); }

// Letzte Übungsnotiz aus einer früheren Session (nicht das gerade geöffnete Datum)
function lastRealNote(exName){
  const openDate = document.getElementById("dateInput").value;
  for(const nm of namesFor(exName)){
    const hit = (lastNotesByEx[nm] || []).find(x => x.date !== openDate);
    if(hit) return hit;
  }
  return null;
}

// Klammer-Zusatz mit Tempo/Pause (z. B. "(3s runter, 1s halten, 3s hoch)") nur für die
// Anzeige in eine eigene Zeile ziehen. Der gespeicherte Übungsname bleibt unverändert.
function splitExName(name){
  const m = name.match(/^(.*?)\s*\(([^()]*)\)$/);
  if(m && /\d\s*s\b|pause|halten/i.test(m[2])) return { base: m[1], tempo: m[2] };
  return { base: name, tempo: null };
}

// Obere Grenze aus dem Ziel-Text: "5–15, bis Muskelversagen" -> 15, "sammeln, Ziel 20s" -> 20,
// "sammeln, Ziel 5–10 Versuche" -> 10, "8, bis Muskelversagen" -> 8, "10 Wdh" -> 10.
function zielObergrenze(ziel){
  if(!ziel) return null;
  const m = ziel.match(/Ziel\s+(\d+)(?:\s*[–-]\s*(\d+))?/) || ziel.match(/^(\d+)(?:\s*[–-]\s*(\d+))?/);
  if(!m) return null;
  return parseInt(m[2] || m[1], 10);
}

// Ziel erreicht = alle Sätze ausgefüllt, jeder als saubere Zahl (ohne "+"-Blöcke) >= Obergrenze.
function goalReached(ziel, values, n){
  const top = zielObergrenze(ziel);
  if(top === null || !values || values.length < n) return false;
  for(let i=0;i<n;i++){
    const m = String(values[i] ?? "").trim().match(/^(\d+(?:[.,]\d+)?)\s*s?$/);
    if(!m || parseFloat(m[1].replace(",", ".")) < top) return false;
  }
  return true;
}

function lastRealSession(exName){
  const openDate = document.getElementById("dateInput").value;
  for(const n of namesFor(exName)){
    const hit = (lastSessionsByEx[n] || []).find(s => s.date !== openDate);
    if(hit) return hit;
  }
  return null;
}

function fmtShort(iso){
  const [y,m,d] = iso.split("-");
  return `${d}.${m}.`;
}

const HISTORY_PAGE_SIZE = 40;
const HISTORY_INITIAL_TARGET = 8;

function attachHistoryButton(row, exName){
  const btn = row.querySelector(".histBtn");
  const panel = document.createElement("div");
  panel.style.display = "none";
  panel.style.marginTop = "8px";
  panel.style.paddingTop = "8px";
  panel.style.borderTop = "1px dashed var(--line)";
  row.appendChild(panel);

  const state = { offset: 0, matches: [], exhausted: false, loading: false };

  function renderPanel(){
    // Eine Tabelle: Datum, Tag und Werte stehen in allen Zeilen bündig untereinander
    const list = state.matches.length ? `<div class="hgrid">` + state.matches.map(r =>
      `<span class="hd">${r.date}</span><span class="hday">${escapeHtml(r.dayTitle)}</span><span class="hval">${r.values}${r.renamedNote}</span>${r.note ? `<div class="hnote">${ICON.note} ${escapeHtml(r.note)}</div>` : ""}`
    ).join("") + `</div>` : "";
    const empty = state.matches.length === 0
      ? '<div style="font-size:11px;color:var(--text-muted);">Noch keine weiteren Einträge für diese Übung.</div>'
      : "";
    const footer = state.exhausted
      ? (state.matches.length > 0 ? '<div style="font-size:10.5px;color:var(--text-muted);margin-top:6px;">Ende der Historie</div>' : "")
      : `<button class="loadMoreBtn" style="background:none;border:1px solid var(--line);color:var(--text-muted);font-size:11px;cursor:pointer;padding:5px 10px;border-radius:6px;margin-top:6px;">${state.loading ? "Lade…" : "Mehr laden"}</button>`;
    panel.innerHTML = list + empty + footer;
    const loadMoreBtn = panel.querySelector(".loadMoreBtn");
    if(loadMoreBtn) loadMoreBtn.onclick = (e)=>{ e.preventDefault(); loadNextPage(); };
  }

  async function loadNextPage(){
    if(state.loading || state.exhausted) return;
    state.loading = true;
    renderPanel();
    const startCount = state.matches.length;
    // Solange Rohdaten-Seiten nachladen, bis mind. 1 neuer Treffer dazukommt oder die Historie zu Ende ist
    // (Treffer sind je nach Übung dünn gesät, eine einzelne Seite kann leer ausgehen).
    while(state.matches.length === startCount && !state.exhausted){
      const { matches, fetchedCount } = await fetchExerciseHistoryPage(exName, state.offset, HISTORY_PAGE_SIZE);
      state.matches.push(...matches);
      state.offset += fetchedCount;
      if(fetchedCount < HISTORY_PAGE_SIZE){ state.exhausted = true; }
    }
    state.loading = false;
    renderPanel();
  }

  btn.onclick = async (e)=>{
    e.preventDefault();
    if(panel.style.display === "none"){
      panel.style.display = "block";
      if(state.matches.length === 0 && !state.exhausted){
        panel.innerHTML = '<div style="font-size:11px;color:var(--text-muted);">Lade…</div>';
        // Erstes Laden: so lange in Seiten nachladen, bis genug Treffer da sind oder Ende erreicht.
        while(state.matches.length < HISTORY_INITIAL_TARGET && !state.exhausted){
          const { matches, fetchedCount } = await fetchExerciseHistoryPage(exName, state.offset, HISTORY_PAGE_SIZE);
          state.matches.push(...matches);
          state.offset += fetchedCount;
          if(fetchedCount < HISTORY_PAGE_SIZE){ state.exhausted = true; }
        }
      }
      renderPanel();
    } else {
      panel.style.display = "none";
    }
  };
}

// Lädt einen Rohdaten-Block (nach Datum absteigend) und filtert ihn auf Treffer für diese Übung.
// Über offset/HISTORY_PAGE_SIZE seitenweise aufrufbar, damit "Mehr laden" die komplette
// Historie erreichen kann, nicht nur ein festes Fenster der letzten N Sessions.
async function fetchExerciseHistoryPage(exName, offset, pageSize){
  const names = namesFor(exName);
  try{
    const { data, error } = await sb
      .from("training_sessions")
      .select("day_key, session_date, data")
      .eq("person", PERSON)
      .neq("day_key", META_KEY)
      .order("session_date", { ascending: false })
      .range(offset, offset + pageSize - 1);
    if(error) throw error;
    const fetchedCount = (data || []).length;
    const matches = (data || [])
      .map(r => ({ r, matchName: names.find(n => r.data && r.data[n] !== undefined) }))
      .filter(x => x.matchName)
      .map(({r, matchName}) => ({
        date: r.session_date,
        dayTitle: DAYS[r.day_key] ? DAYS[r.day_key].label : r.day_key,
        values: Array.isArray(r.data[matchName]) ? r.data[matchName].map(v => v || "–").join(" / ") : r.data[matchName],
        renamedNote: matchName !== exName ? ` (damals: "${matchName}")` : "",
        note: (r.data._exnotes && r.data._exnotes[matchName]) || "",
      }));
    return { matches, fetchedCount };
  }catch(e){ console.error("fetchExerciseHistoryPage", e); return { matches: [], fetchedCount: 0 }; }
}

function escapeAttr(s){ return s.replace(/"/g,"&quot;"); }

function isEmptyTrackedValue(v){
  if(Array.isArray(v)) return v.every(x => !x || String(x).trim() === "");
  return !v || String(v).trim() === "";
}

async function loadLastSession(){
  lastSessionValues = {};
  lastSessionsByEx = {};
  lastNotesByEx = {};
  try{
    // Über alle Tagestypen suchen (nicht nur currentDay), damit Übungen, die in
    // mehreren Mustern vorkommen (z. B. Superman Push-up an den Ganzkörper-Tagen Einarm/Planche/HSPU), immer
    // den zeitlich neuesten Wert als Platzhalter zeigen, egal aus welchem Tag.
    const { data, error } = await sb
      .from("training_sessions")
      .select("day_key, session_date, data")
      .eq("person", PERSON)
      .neq("day_key", META_KEY)
      .order("session_date", { ascending: false })
      .order("updated_at", { ascending: false })
      .limit(60);
    if(error) throw error;
    (data || []).forEach(row=>{
      if(!row.data) return;
      const exn = row.data["_exnotes"];
      if(exn && typeof exn === "object"){
        Object.keys(exn).forEach(name=>{
          const t = String(exn[name] || "").trim();
          if(!t) return;
          const list = lastNotesByEx[name] || (lastNotesByEx[name] = []);
          if(list.length < 2) list.push({ date: row.session_date, text: t });
        });
      }
      Object.keys(row.data).forEach(exName=>{
        if(exName === "_notes" || exName === "_exnotes" || exName === "_steigern") return;
        const rawVal = row.data[exName];
        // Die zwei neuesten Sessions mit echten Werten je Übung (für "zuletzt am" und den Ziel-Check).
        if(Array.isArray(rawVal) && !isEmptyTrackedValue(rawVal)){
          const list = lastSessionsByEx[exName] || (lastSessionsByEx[exName] = []);
          const sg = row.data["_steigern"] && row.data["_steigern"][exName];
          const erledigt = STEIGERN_ERLEDIGT[exName] && row.session_date <= STEIGERN_ERLEDIGT[exName];   // Kennzeichen von früher: Stufe inzwischen umgestellt
          if(list.length < 2) list.push({ date: row.session_date, value: rawVal, flag: sg && sg.on && !erledigt ? sg : null });
        }
        if(!Array.isArray(rawVal)){
          if(lastSessionValues[exName] !== undefined) return;
          if(isEmptyTrackedValue(rawVal)) return;
          lastSessionValues[exName] = { value: rawVal, dayKey: row.day_key };
          return;
        }
        if(!lastSessionValues[exName]){
          lastSessionValues[exName] = { value: [], dayKey: row.day_key };
        }
        const entry = lastSessionValues[exName];
        rawVal.forEach((v, idx)=>{
          const already = entry.value[idx];
          const alreadyFilled = already !== undefined && String(already).trim() !== "";
          if(!alreadyFilled && v !== undefined && v !== null && String(v).trim() !== ""){
            entry.value[idx] = v;
          }
        });
      });
    });
  }catch(e){ console.error("loadLastSession", e); }
}

function applySessionData(sessionData, date){
  document.getElementById("sessionNotes").value = sessionData["_notes"] || "";
  const matchedNames = new Set(["_notes", "_exnotes", "_steigern"]);
  const sg = sessionData["_steigern"] || {};
  document.querySelectorAll("#blocksHolder .exrow").forEach(r=>{
    if(!r._steigern) return;
    const k = namesFor(r._exName).find(nm => sg[nm] !== undefined);
    const f = k ? sg[k] : null;
    // Automatisch gesetzte Kennzeichen werden bei jedem Speichern neu geprüft (Ergebnis muss weiter stimmen)
    r._steigern = f ? { choice: f.on ? (f.auto ? null : true) : false, note: f.note || "", auto: !!f.auto } : { choice: null, note: "", auto: false };
  });
  const exn = sessionData["_exnotes"] || {};
  document.querySelectorAll("#blocksHolder textarea.exnote").forEach(ta=>{
    const k = namesFor(ta.getAttribute("data-ex")).find(nm => exn[nm] !== undefined);
    if(k) ta.closest(".exrow")._setNote(exn[k]);
  });
  document.querySelectorAll("#blocksHolder input").forEach(inp=>{
    const exName = inp.getAttribute("data-ex");
    const idx = parseInt(inp.getAttribute("data-idx"),10);
    const srcKey = namesFor(exName).find(n => sessionData[n] !== undefined);
    if(srcKey && sessionData[srcKey][idx] !== undefined){ inp.value = sessionData[srcKey][idx]; }
    if(srcKey) matchedNames.add(srcKey);
  });
  document.querySelectorAll("#blocksHolder .exrow").forEach(r => r._refresh && r._refresh());
  pickVariantWithData();
  const orphaned = Object.keys(sessionData).filter(name => !matchedNames.has(name));
  const box = document.getElementById("orphanedHolder");
  if(orphaned.length > 0){
    const rows = orphaned.map(name => `<div style="margin-bottom:4px;"><strong>${name}:</strong> ${sessionData[name].map(v=>v||"–").join(" / ")}</div>`).join("");
    box.innerHTML = `<div style="margin:0 16px 14px;padding:10px 14px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;font-size:12px;color:var(--text-muted);">
      <div style="font-weight:600;color:var(--text);margin-bottom:6px;">Diese Session vom ${date} enthielt auch Übungen, die nicht mehr im aktuellen Plan stehen:</div>
      ${rows}
    </div>`;
  } else {
    box.innerHTML = "";
  }
}

// Automatisches Speichern (heutige Einheit): nach jedem Satz bzw. nach "Satz übernehmen".
// Alle Speichervorgänge laufen nacheinander, damit der Zeiger nie doppelt weiterrückt.
let sessionKnown = null;      // "tag|datum" der geladenen/gespeicherten Session (spart Abfragen)
let saveChain = Promise.resolve();
let autosaveTimer = null, autosaveBlocked = false, autosaveErrorShown = false;

// Nicht gesendete Eingaben (Entwurf / Warteschlange): bleiben im Telefon, bis Supabase sie bestätigt hat.
// Schlüssel "tag|datum" -> { day, date, data, ts }. Bei Funkloch geht so nichts verloren.
const PENDING_KEY = "training_pending_v1";
function pendingAll(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY) || "{}") || {}; }catch(e){ return {}; } }
function pendingWrite(o){ try{ if(Object.keys(o).length) localStorage.setItem(PENDING_KEY, JSON.stringify(o)); else localStorage.removeItem(PENDING_KEY); }catch(e){ console.error("pending", e); } }
function pendingSet(day, date, data){ const o = pendingAll(); o[day + "|" + date] = { day, date, data, ts: Date.now() }; pendingWrite(o); }
function pendingClearIfSame(key, data){
  const o = pendingAll();
  if(o[key] && JSON.stringify(o[key].data) === JSON.stringify(data)){ delete o[key]; pendingWrite(o); }
}
function pendingCount(){ return Object.keys(pendingAll()).length; }
function isNetworkError(e){
  const m = String((e && (e.message || e.details)) || e || "");
  return !navigator.onLine || /fetch|network|load failed|abort|timeout|offline/i.test(m) || (e && (e.status === 0 || e.status >= 500));
}
let flushTimer = null;
function schedulePendingRetry(){
  if(flushTimer || !pendingCount()) return;
  flushTimer = setTimeout(()=>{ flushTimer = null; flushPending(); }, 20000);
}

function saveSession(opts){
  saveChain = saveChain.then(() => doSaveSession(opts || {})).catch(e => console.error("saveSession", e));
  return saveChain;
}
function setSaveState(st){
  const el = document.getElementById("trainSave");
  if(!el) return;
  el.dataset.st = st;
  el.textContent = st === "saved" ? "✓" : st === "pending" ? "…" : st === "queued" ? "⏳" : st === "error" ? "⚠" : "";
  el.title = st === "saved" ? "Alles gespeichert" : st === "pending" ? "Wird gleich gespeichert" : st === "queued" ? "Kein Netz – auf dem Telefon gesichert, wird automatisch gesendet" : st === "error" ? "Speichern fehlgeschlagen – oben auf „Session speichern“ tippen" : "";
}
function scheduleAutosave(delay){
  if(autosaveBlocked) return;
  if((document.getElementById("dateInput").value || todayStr()) !== todayStr()) return; // nur heute; ältere Sessions weiter mit dem Speichern-Knopf
  setSaveState("pending");
  try{ const d = collectSessionData(); if(sessionHasContent(d) || sessionKnown === currentDay + "|" + todayStr()) pendingSet(currentDay, todayStr(), d); }catch(e){}
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(runAutosave, delay);
}
function runAutosave(){
  clearTimeout(autosaveTimer); autosaveTimer = null;
  return saveSession({ auto: true });
}
function flushAutosave(){ if(autosaveTimer) runAutosave(); }
function sessionHasContent(data){
  return Object.keys(data).some(k => k === "_notes" || k === "_exnotes" || (Array.isArray(data[k]) && data[k].some(v => String(v).trim() !== "")));
}

function collectSessionData(){
  const data = {};
  document.querySelectorAll("#blocksHolder input").forEach(inp=>{
    const exName = inp.getAttribute("data-ex");
    const idx = parseInt(inp.getAttribute("data-idx"),10);
    if(!data[exName]) data[exName] = [];
    data[exName][idx] = inp.value || "";
  });
  const notesVal = document.getElementById("sessionNotes").value.trim();
  if(notesVal) data["_notes"] = notesVal;
  const exnotes = {};
  document.querySelectorAll("#blocksHolder textarea.exnote").forEach(ta=>{
    const v = ta.value.trim();
    if(v) exnotes[ta.getAttribute("data-ex")] = v;
  });
  if(Object.keys(exnotes).length) data["_exnotes"] = exnotes;
  const steig = {};
  document.querySelectorAll("#blocksHolder .exrow").forEach(r=>{
    const d = r._flagDecision && r._flagDecision();
    if(d) steig[r._exName] = d;
  });
  if(Object.keys(steig).length) data["_steigern"] = steig;
  return data;
}

async function doSaveSession(opts){
  const auto = !!opts.auto;
  const date = document.getElementById("dateInput").value || todayStr();
  const key = currentDay + "|" + date;
  const data = collectSessionData();
  if(auto){
    if(date !== todayStr()){ setSaveState(""); return; }
    // Keine leeren Einheiten automatisch anlegen (es sei denn, die Einheit gibt es schon)
    if(!sessionHasContent(data) && sessionKnown !== key){ setSaveState(""); return; }
  }
  if(date === todayStr() && (sessionHasContent(data) || sessionKnown === key)) pendingSet(currentDay, date, data);
  try{
    let isNewSession;
    if(sessionKnown === key){
      isNewSession = false;   // schon bekannt (geladen/gespeichert): spart zwei Abfragen
    } else {
      // Vorher prüfen, ob für diesen Tag+Datum schon eine Session existiert -> nur bei neuer Session zählt es für den Zeiger
      const { data: existing, error: checkError } = await sb
        .from("training_sessions")
        .select("day_key")
        .eq("person", PERSON)
        .eq("day_key", currentDay)
        .eq("session_date", date)
        .maybeSingle();
      if(checkError) throw checkError;
      isNewSession = !existing;

      // Prüfen, ob an diesem Datum bereits ein ANDERER Tagestyp gespeichert wurde -> nicht zwei Sessions an einem Tag
      if(isNewSession){
        const { data: otherDayRows, error: otherError } = await sb
          .from("training_sessions")
          .select("day_key")
          .eq("person", PERSON)
          .eq("session_date", date)
          .neq("day_key", META_KEY)
          .neq("day_key", currentDay)
          .in("day_key", Object.keys(DAYS)); // nur andere Trainingstag-Typen zählen, nicht Cardio/Sonstiges/Körperwerte
        if(otherError) throw otherError;
        const otherDay = (otherDayRows && otherDayRows.length > 0) ? otherDayRows[0] : null;
        if(otherDay){
          const otherTitle = DAYS[otherDay.day_key] ? DAYS[otherDay.day_key].title : otherDay.day_key;
          if(auto){
            // Keine Rückfrage mitten im Training: automatisches Speichern pausiert, manuell speichern fragt dann nach
            autosaveBlocked = true;
            setSaveState("error");
            showToast(`Auto-Speichern pausiert: für den ${date} ist schon „${otherTitle}“ gespeichert. Oben auf „Session speichern“ tippen.`);
            return;
          }
          const proceed = confirm(`Für den ${date} ist bereits "${otherTitle}" gespeichert. Trotzdem zusätzlich "${DAYS[currentDay].title}" für denselben Tag anlegen?`);
          if(!proceed){ showToast("Abgebrochen"); return; }
        }
      }
    }

    const { error } = await sb
      .from("training_sessions")
      .upsert(
        { person: PERSON, day_key: currentDay, session_date: date, data: data, updated_at: new Date().toISOString() },
        { onConflict: "person,day_key,session_date" }
      );
    if(error) throw error;
    pendingClearIfSame(key, data);
    sessionKnown = key;
    flagsStale = true;   // "Zum Steigern" beim nächsten Seitenwechsel neu laden
    trainSavedToday = true; updateTrainSub();
    autosaveErrorShown = false;
    if(!auto){
      clearTimeout(autosaveTimer); autosaveTimer = null; autosaveBlocked = false;
      const btn = document.getElementById("saveBtn");
      btn.classList.add("saved");
      btn.textContent = "Gespeichert ✓";
      setTimeout(()=>{ btn.classList.remove("saved"); updateProgress(); }, 1800);
    }
    // Wurde zwischenzeitlich weitergetippt, bleibt es "ausstehend", sonst alles gespeichert
    setSaveState(autosaveTimer ? "pending" : pendingCount() ? "queued" : "saved");
    if(opts.onSaved) opts.onSaved();   // z. B. Auswertung sofort zeigen, ohne die Aktualisierungen unten abzuwarten
    // Der Zeiger rückt nur weiter, wenn genau der vorgeschlagene Tag gespeichert wurde. Wiederholungen
    // oder ein anderer Tag lassen ihn stehen, sonst rutscht er zu weit und ein Plan-Platz fällt durch.
    let pointerNote = "";
    if(isNewSession){
      const curIdx = await getPointer();
      if(SEQUENCE[curIdx] === currentDay) await setPointer(curIdx + 1);
      else if(SEQUENCE.includes(currentDay)) pointerNote = " · Zeiger bleibt bei " + DAYS[SEQUENCE[curIdx]].title;
    }
    if(!auto) showToast(isNewSession ? "Gespeichert für " + date + pointerNote : "Session vom " + date + " aktualisiert (Zeiger unverändert)");
    if(!auto || isNewSession){
      await populateHistory();
      await renderStreak();
      await renderNextSession();
      await renderWeeklyGoals();
    }
  }catch(e){
    console.error(e);
    if(isNetworkError(e) && pendingAll()[key]){
      // Kein Netz: Eingaben liegen gesichert auf dem Telefon und werden automatisch nachgesendet
      setSaveState("queued"); schedulePendingRetry();
      if(!autosaveErrorShown){ autosaveErrorShown = true; showToast("Kein Netz – deine Eingaben sind auf dem Telefon gesichert und werden automatisch gesendet"); }
      return;
    }
    if(auto){
      setSaveState("error");
      if(!autosaveErrorShown){ autosaveErrorShown = true; showToast("Automatisches Speichern fehlgeschlagen – oben auf „Session speichern“ tippen"); }
    } else {
      showToast("Fehler: " + (e && e.message ? e.message : "unbekannt"));
    }
  }
}

// Gesicherte Einheiten an Supabase senden (nacheinander, über dieselbe Kette wie das Speichern)
async function pushJob(job){
  const key = job.day + "|" + job.date;
  const { data: existing, error: ce } = await sb.from("training_sessions").select("day_key")
    .eq("person", PERSON).eq("day_key", job.day).eq("session_date", job.date).maybeSingle();
  if(ce) throw ce;
  const isNew = !existing;
  const { error } = await sb.from("training_sessions").upsert(
    { person: PERSON, day_key: job.day, session_date: job.date, data: job.data, updated_at: new Date().toISOString() },
    { onConflict: "person,day_key,session_date" });
  if(error) throw error;
  pendingClearIfSame(key, job.data);
  if(sessionKnown === null || key === currentDay + "|" + todayStr()) sessionKnown = key;
  if(isNew){
    const curIdx = await getPointer();
    if(SEQUENCE[curIdx] === job.day) await setPointer(curIdx + 1);
  }
}
function flushPending(){
  if(!pendingCount()) return Promise.resolve(true);
  saveChain = saveChain.then(async () => {
    let ok = true;
    for(const job of Object.values(pendingAll())){
      try{ await pushJob(job); }
      catch(e){ ok = false; console.error("flushPending", e); break; }
    }
    if(ok){
      flagsStale = true; trainSavedToday = true; try{ updateTrainSub(); }catch(e){}
      setSaveState(autosaveTimer ? "pending" : "saved");
      autosaveErrorShown = false;
      try{ await populateHistory(); await renderStreak(); await renderNextSession(); await renderWeeklyGoals(); }catch(e){}
    } else {
      setSaveState("queued"); schedulePendingRetry();
    }
    return ok;
  }).catch(e => { console.error("flushPending", e); return false; });
  return saveChain;
}

async function exportMarkdown(){
  const weeks = parseInt(document.getElementById("exportWeeks").value, 10) || 6;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - weeks * 7);
  const cutoffStr = cutoff.getFullYear() + "-" + String(cutoff.getMonth()+1).padStart(2,"0") + "-" + String(cutoff.getDate()).padStart(2,"0");

  let entries = [];
  try{
    const { data, error } = await sb
      .from("training_sessions")
      .select("day_key, session_date, data")
      .eq("person", PERSON)
      .gte("session_date", cutoffStr)
      .order("session_date", { ascending: true });
    if(error) throw error;
    entries = (data || []).map(row => ({ date: row.session_date, dayKey: row.day_key, data: row.data }));
  }catch(e){
    console.error("exportMarkdown", e);
    showToast("Fehler beim Export: " + e.message);
    return;
  }

  let md = `# Training – Export – letzte ${weeks} Wochen (ab ${cutoffStr})\n\n`;
  if(entries.length === 0){
    md += "_Keine Sessions in diesem Zeitraum gespeichert._\n";
  } else {
    for(const entry of entries){
      md += `## ${entry.date} – ${DAYS[entry.dayKey] ? DAYS[entry.dayKey].title : entry.dayKey}\n\n`;
      const exNames = Object.keys(entry.data).filter(k => k !== "_notes" && k !== "_exnotes" && k !== "_steigern");
      if(exNames.length > 0){
        md += "| Übung | Werte |\n|---|---|\n";
        exNames.forEach(exName=>{
          const vals = entry.data[exName].map(v => v==="" || v===undefined ? "–" : v).join(" / ");
          md += `| ${exName} | ${vals} |\n`;
        });
        md += "\n";
      }
      if(entry.data["_steigern"]){
        const fl = Object.keys(entry.data["_steigern"]).filter(k => entry.data["_steigern"][k].on);
        if(fl.length) md += "**Nächstes Mal steigern:** " + fl.map(k => k + (entry.data["_steigern"][k].note ? " (" + entry.data["_steigern"][k].note + ")" : "")).join("; ") + "\n\n";
      }
      if(entry.data["_exnotes"]){
        md += "**Übungsnotizen:**\n" + Object.keys(entry.data["_exnotes"]).map(k => `- ${k}: ${entry.data["_exnotes"][k]}`).join("\n") + "\n\n";
      }
      if(entry.data["_notes"]){
        md += `**Notizen:** ${entry.data["_notes"]}\n\n`;
      }
    }
  }

  const area = document.getElementById("exportArea");
  area.style.display = "block";
  area.value = md;
  area.focus();
  area.select();

  try{
    const blob = new Blob([md], {type:"text/markdown"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "training-export.md";
    a.click();
    URL.revokeObjectURL(url);
    showToast(entries.length + " Sessions exportiert");
  }catch(e){
    showToast("Text unten markiert – kopieren mit Strg/Cmd+C");
  }
}

const ENTRY_TYPES = {
  lauf:      { key:"cardio_lauf",      label:"Lauf",        get icon(){ return ICON.lauf; } },
  schwimmen: { key:"cardio_schwimmen", label:"Schwimmen",   get icon(){ return ICON.schwimmen; } },
  koerper:   { key:"koerperwerte",     label:"Körperwerte", get icon(){ return ICON.koerper; } },
  sonstiges: { key:"sonstiges",        label:"Sonstiges",   get icon(){ return ICON.sonstiges; } },
};

const typeOfKey = key => Object.keys(ENTRY_TYPES).find(t => ENTRY_TYPES[t].key === key) || null;

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function summarizeEntry(dayKey, d){
  d = d || {};
  if(dayKey === "koerperwerte"){
    const parts = [];
    if(d.gewicht_kg) parts.push(`${escapeHtml(d.gewicht_kg)} kg`);
    if(d.oberarm_links_cm) parts.push(`Arm ${escapeHtml(d.oberarm_links_cm)} cm`);
    if(d.bauchumfang_nabel_cm) parts.push(`Bauch ${escapeHtml(d.bauchumfang_nabel_cm)} cm`);
    return parts.join(" · ") || "keine Werte";
  }
  return d.comment ? escapeHtml(d.comment) : "kein Kommentar";
}

async function fetchDayEntries(date){

    .eq("person", PERSON)
    .eq("session_date", date)
    .neq("day_key", META_KEY);

}

function sheetState(){
  const g = id => document.getElementById(id).value.trim();
  return {
    lauf: g("sheetComment-lauf"), schwimmen: g("sheetComment-schwimmen"), sonstiges: g("sheetComment-sonstiges"),
    gewicht_kg: g("sheetBodyWeight"), oberarm_links_cm: g("sheetBodyArm"), bauchumfang_nabel_cm: g("sheetBodyWaist"),
  };
}
function sheetDirty(){
  if(!sheetLoaded) return false;
  const now = sheetState();
  return Object.keys(now).some(k => now[k] !== sheetLoaded[k]) || [...sheetArmed].some(t => !sheetExisting[t]);
}

function refreshSheetStatus(){
  const now = sheetState();
  const setSt = (type, text, ok) => { const el = document.getElementById("sheetSt-"+type); el.textContent = text; el.classList.toggle("ok", !!ok); };
  const bodyChanged = ["gewicht_kg","oberarm_links_cm","bauchumfang_nabel_cm"].some(k => now[k] !== sheetLoaded[k]);
  const changed = {
    lauf: now.lauf !== sheetLoaded.lauf, schwimmen: now.schwimmen !== sheetLoaded.schwimmen,
    sonstiges: now.sonstiges !== sheetLoaded.sonstiges, koerper: bodyChanged,
  };
  Object.keys(ENTRY_TYPES).forEach(t=>{
    const isNew = !sheetExisting[t] && (t === "lauf" || t === "schwimmen" ? sheetArmed.has(t) : changed[t]);
    if(changed[t] && sheetExisting[t]) setSt(t, "geändert – noch nicht gespeichert", false);
    else if(isNew) setSt(t, "neu – wird gespeichert", false);
    else if(sheetExisting[t]) setSt(t, "gespeichert ✓", true);
    else setSt(t, "", false);
    document.getElementById("sheetDel-"+t).hidden = !sheetExisting[t];
  });
}

async function loadSheetDate(date){
  sheetDate = date;
  document.getElementById("sheetDate").value = date;
  const trainingBox = document.getElementById("sheetTraining");
  trainingBox.innerHTML = "";
  let rows = [];
  try{ rows = await fetchDayEntries(date); }
  catch(e){ console.error("loadSheetDate", e); showToast("Fehler beim Laden: " + e.message); }
  if(sheetDate !== date) return; // währenddessen anderes Datum gewählt
  const byKey = Object.fromEntries(rows.map(r => [r.day_key, r.data || {}]));
  sheetExisting = {};
  Object.keys(ENTRY_TYPES).forEach(t => { sheetExisting[t] = byKey[ENTRY_TYPES[t].key] !== undefined; });
  const g = (key, f) => (byKey[key] && byKey[key][f] != null) ? String(byKey[key][f]) : "";
  const body = byKey.koerperwerte || {};
  sheetBodyTime = body.uhrzeit || "";
  if(!sheetExisting.koerper){
    const t = new Date();
    sheetBodyTime = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
  }
  document.getElementById("sheetComment-lauf").value = g("cardio_lauf","comment");
  document.getElementById("sheetComment-schwimmen").value = g("cardio_schwimmen","comment");
  document.getElementById("sheetComment-sonstiges").value = g("sonstiges","comment");
  document.getElementById("sheetBodyWeight").value = g("koerperwerte","gewicht_kg");
  document.getElementById("sheetBodyArm").value = g("koerperwerte","oberarm_links_cm");
  document.getElementById("sheetBodyWaist").value = g("koerperwerte","bauchumfang_nabel_cm");
  document.getElementById("sheetBodyTime").value = sheetBodyTime;
  sheetLoaded = sheetState();
  refreshSheetStatus();

  const trainings = rows.filter(r => DAYS[r.day_key]);
  trainingBox.innerHTML = trainings.map(r => `
    <div class="sheet-training">
      <span>${ICON.training} ${escapeHtml(DAYS[r.day_key].title)} · gespeichert</span>
      <button data-day="${r.day_key}">Öffnen</button>
    </div>`).join("");
  trainingBox.querySelectorAll("button").forEach(btn => btn.onclick = async ()=>{
    if(!confirmDiscard()) return;
    closeDaySheet(true);
    await editSession(btn.getAttribute("data-day"), date);
  });
  document.querySelectorAll("#sheetRecent .recent-row").forEach(r => r.classList.toggle("cur", r.dataset.date === date));
}

function confirmDiscard(){
  return !sheetDirty() || confirm("Ungespeicherte Änderungen verwerfen?");
}
async function gotoSheetDate(date){
  if(!date || date === sheetDate) return;

}
function shiftDate(iso, days){
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + days);
  return fmtDate(d);
}

async function openDaySheet(type, date){
  const sheet = document.getElementById("daySheet");
  sheetArmed = new Set();
  if(type === "lauf" || type === "schwimmen") sheetArmed.add(type);
  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  await loadSheetDate(date || document.getElementById("dateInput").value || todayStr());
  // Schon vorhandener Eintrag -> nicht als "neu" markieren
  [...sheetArmed].forEach(t => { if(sheetExisting[t]) sheetArmed.delete(t); });
  refreshSheetStatus();
  document.querySelectorAll("#sheetSections .sec").forEach(sec => sec.classList.toggle("focus", sec.dataset.type === type));
  const sec = document.querySelector(`#sheetSections .sec[data-type="${type}"]`);
  if(sec){
    // Nur scrollen, wenn der Abschnitt nicht ohnehin sichtbar ist (Körper/Sonstiges weiter unten)
    const body = document.getElementById("sheetBody");
    const secTop = sec.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop;
    if(secTop + sec.offsetHeight > body.clientHeight) body.scrollTop = Math.max(0, secTop - 8);
    const first = sec.querySelector("textarea, input.num");
    if(first && !sheetExisting[type]) first.focus({ preventScroll:true });
  }
  renderSheetRecent();
}

function closeDaySheet(force){
  if(!force && !confirmDiscard()) return;
  const sheet = document.getElementById("daySheet");
  sheet.classList.remove("open");
  sheet.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  sheetLoaded = null;

async function saveSheet(){
  const date = sheetDate;
  const st = sheetState();
  const now = new Date().toISOString();
  const rows = [];
  const names = [];
  const addRow = (type, data) => {
    rows.push({ person: PERSON, day_key: ENTRY_TYPES[type].key, session_date: date, data, updated_at: now });
    names.push(ENTRY_TYPES[type].label);
  };
  ["lauf","schwimmen"].forEach(t=>{
    const changed = st[t] !== sheetLoaded[t];
    if(changed || (sheetArmed.has(t) && !sheetExisting[t])) addRow(t, { comment: st[t] });
  });
  if(st.sonstiges !== sheetLoaded.sonstiges){
    if(st.sonstiges) addRow("sonstiges", { comment: st.sonstiges });
    else showToast("Sonstiges ist leer – zum Entfernen „Eintrag löschen“ nutzen");
  }
  const bodyKeys = ["gewicht_kg","oberarm_links_cm","bauchumfang_nabel_cm"];
  if(bodyKeys.some(k => st[k] !== sheetLoaded[k])){
    if(bodyKeys.some(k => st[k])){
      addRow("koerper", { uhrzeit: document.getElementById("sheetBodyTime").value, gewicht_kg: st.gewicht_kg, oberarm_links_cm: st.oberarm_links_cm, bauchumfang_nabel_cm: st.bauchumfang_nabel_cm });
    } else {
      showToast("Körperwerte sind leer – zum Entfernen „Eintrag löschen“ nutzen");
    }
  }
  if(rows.length === 0){ if(!document.getElementById("toast").classList.contains("show")) showToast("Nichts zu speichern"); return; }
  try{
    const { error } = await sb.from("training_sessions").upsert(rows, { onConflict: "person,day_key,session_date" });
    if(error) throw error;
    closeDaySheet(true);
    showToast("Gespeichert (" + date.slice(8) + "." + date.slice(5,7) + ".): " + names.join(", "));
    await afterEntriesChanged();
  }catch(e){
    console.error("saveSheet", e);
    showToast("Fehler: " + e.message);
  }
}

// Anzahl eingetragener Sätze einer Trainingseinheit (Dehnungsfelder zählen nicht)
function trainingSetCount(dayKey, data){
  const stretch = new Set();
  (DAYS[dayKey] ? DAYS[dayKey].blocks : []).forEach(b => b.items.forEach(i => { if(i.stretch) namesFor(i.uebung).forEach(n => stretch.add(n)); }));
  return Object.keys(data || {}).filter(k => k[0] !== "_" && Array.isArray(data[k]) && !stretch.has(k))
    .reduce((a, k) => a + data[k].filter(v => String(v == null ? "" : v).trim() !== "").length, 0);
}
async function renderRecentInto(holder, onPick, opts){
  opts = opts || {};
  const maxDates = opts.maxDates || 30;
  try{
    const { data, error } = await sb
      .from("training_sessions")
      .select("day_key, session_date, data")
      .eq("person", PERSON)
      .in("day_key", opts.withTraining ? [...ENTRY_KEYS, ...Object.keys(DAYS)] : ENTRY_KEYS)
      .order("session_date", { ascending: false })
      .limit(opts.withTraining ? 1500 : 500);
    if(error) throw error;
    if(!data || data.length === 0){ holder.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:6px 2px;">Noch keine Einträge.</div>`; return; }
    // Körperwerte: Veränderung zum vorherigen Eintrag
    const body = data.filter(r => r.day_key === "koerperwerte");
    const delta = (row, field) => {
      const i = body.indexOf(row), prev = body[i+1];
      if(!prev) return "";
      const diff = parseFloat((row.data||{})[field]) - parseFloat((prev.data||{})[field]);
      if(isNaN(diff) || diff === 0) return "";
      return ` <span style="color:${diff > 0 ? "var(--danger)" : "var(--accent)"};font-size:10.5px;">(${diff > 0 ? "+" : "−"}${Math.abs(diff).toFixed(1)})</span>`;
    };
    const byDate = new Map();
    data.forEach(r => { if(!byDate.has(r.session_date)) byDate.set(r.session_date, []); byDate.get(r.session_date).push(r); });
    const allDates = [...byDate.entries()];
    holder.innerHTML = allDates.slice(0, maxDates).map(([date, rows0])=>{
      // Trainingseinheiten zuerst, dann Lauf/Schwimmen/…
      const rows = opts.withTraining ? rows0.slice().sort((a, b) => (DAYS[b.day_key] ? 1 : 0) - (DAYS[a.day_key] ? 1 : 0)) : rows0;
      const lines = rows.map(r=>{
        if(DAYS[r.day_key]) return `${ICON.training} <b>${escapeHtml(DAYS[r.day_key].title)}</b> · ${trainingSetCount(r.day_key, r.data)} Sätze`;
        const t = ENTRY_TYPES[typeOfKey(r.day_key)];
        if(r.day_key === "koerperwerte"){
          const d = r.data || {}, parts = [];
          if(d.gewicht_kg) parts.push(`${escapeHtml(d.gewicht_kg)} kg${delta(r,"gewicht_kg")}`);
          if(d.oberarm_links_cm) parts.push(`Arm ${escapeHtml(d.oberarm_links_cm)}${delta(r,"oberarm_links_cm")}`);
          if(d.bauchumfang_nabel_cm) parts.push(`Bauch ${escapeHtml(d.bauchumfang_nabel_cm)}${delta(r,"bauchumfang_nabel_cm")}`);
          return `${t.icon} ${parts.join(" · ") || "keine Werte"}`;
        }
        return `${t.icon} ${summarizeEntry(r.day_key, r.data)}`;
      });
      const wd = new Date(date + "T12:00:00").toLocaleDateString("de-DE", { weekday:"short" });
      if(opts.withTraining){
        return `<div class="recent-row"><span class="rd">${wd} ${fmtShort(date)}${date.slice(0,4) === String(new Date().getFullYear()) ? "" : date.slice(2,4)}</span><span class="rs">${rows.map((r, i) => `<button class="rline" data-day="${r.day_key}" data-date="${date}">${lines[i]}</button>`).join("")}</span></div>`;
      }
      return `<button class="recent-row${date === sheetDate ? " cur" : ""}" data-date="${date}"><span class="rd">${wd} ${fmtShort(date)}${date.slice(0,4) === String(new Date().getFullYear()) ? "" : date.slice(2,4)}</span><span class="rs">${lines.join("<br>")}</span></button>`;
    }).join("") + (opts.onMore ? (allDates.length > maxDates
      ? `<button class="morebtn" id="entriesMoreBtn">Verlauf · ${Math.min(ENTRIES_STEP, allDates.length - maxDates)} weitere laden</button>`
      : (allDates.length > ENTRIES_STEP ? `<div class="moreend">Das waren alle Einträge.</div>` : "")) : "");
    holder.querySelectorAll("button.recent-row").forEach(btn => btn.onclick = ()=> onPick(btn.dataset.date));
    holder.querySelectorAll(".rline").forEach(btn => btn.onclick = ()=> DAYS[btn.dataset.day] ? openSessionView(btn.dataset.day, btn.dataset.date) : onPick(btn.dataset.date));
    const moreBtn = holder.querySelector(".morebtn");

  }catch(e){
    console.error("renderRecentInto", e);
    holder.innerHTML = `<div style="font-size:11.5px;color:var(--danger);">Fehler beim Laden: ${e.message}</div>`;

// ---------- Wochen-Übersicht (diese Woche + aufklappbar 11 weitere, Montag-Start) ----------
function mondayOf(dateObj){
  const d = new Date(dateObj);
  const day = d.getDay(); // 0=So, 1=Mo, ...
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
// ISO-Kalenderwoche (Montag-Start), z. B. 41
function isoWeek(dateObj){
  const d = new Date(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
}
function fmtDate(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

// Wochen-Übersicht: Zustand bleibt über Neuzeichnen (z. B. nach dem Speichern) erhalten
let weeklyCount = 12;      // wie viele Wochen geladen sind (inkl. dieser)
let weeklyOpen = false;    // Verlauf aufgeklappt?
const WEEKLY_STEP = 12;

async function renderWeeklyGoals(){
  const holder = document.getElementById("weeklyGoalsHolder");
  const thisMonday = mondayOf(new Date());
  const weekStarts = Array.from({length: weeklyCount}, (_,i) => { const d = new Date(thisMonday); d.setDate(d.getDate() - i*7); return d; });
  const earliestMonday = weekStarts[weekStarts.length-1];

  try{
    const { data, error } = await sb
      .from("training_sessions")
      .select("day_key, session_date")
      .eq("person", PERSON)
      .neq("day_key", META_KEY)
      .gte("session_date", fmtDate(earliestMonday))
      .order("session_date", { ascending: false });
    if(error) throw error;
    // Gibt es noch ältere Einträge als die geladenen Wochen? Dann "Mehr laden" anbieten.
    const { data: oldest, error: oldErr } = await sb
      .from("training_sessions")
      .select("session_date")
      .eq("person", PERSON)
      .neq("day_key", META_KEY)
      .order("session_date", { ascending: true })
      .limit(1);
    if(oldErr) throw oldErr;
    const hasMore = !!(oldest && oldest[0] && oldest[0].session_date < fmtDate(earliestMonday));

    const weeks = weekStarts.map(start=>{
      const end = new Date(start); end.setDate(end.getDate() + 7);
      const rows = (data || []).filter(r => r.session_date >= fmtDate(start) && r.session_date < fmtDate(end));
      const lauf = rows.filter(r => r.day_key === "cardio_lauf").length;
      const schwimmen = rows.filter(r => r.day_key === "cardio_schwimmen").length;
      const koerper = rows.filter(r => r.day_key === "koerperwerte").length;
      const training = rows.filter(r => Object.keys(DAYS).includes(r.day_key)).length;
      return { start, lauf, schwimmen, koerper, training };
    });

    // Feste Spalten, damit Symbole und Zahlen in jeder Zeile genau untereinander stehen
    const anyBody = weeks.some(w => w.koerper > 0);
    const cell = (icon, n) => `<span class="wc"><span class="wi">${icon}</span><b>${n}</b></span>`;
    const counts = w => `<span class="wcs">${anyBody ? (w.koerper ? cell(ICON.koerper, w.koerper) : `<span class="wc"></span>`) : ""}${cell(ICON.training, w.training)}${cell(ICON.lauf, w.lauf)}${cell(ICON.schwimmen, w.schwimmen)}</span>`;
    const weekLabel = (w, i) => i === 1 ? "Letzte Woche" : `KW ${isoWeek(w.start)}`;
    const yearNow = new Date().getFullYear();
    const startLabel = w => fmtShort(fmtDate(w.start)) + (w.start.getFullYear() === yearNow ? "" : String(w.start.getFullYear()).slice(2));
    const rowHtml = (w, i) => `<div class="wkrow"><span class="wkl">${weekLabel(w, i)}${i === 1 ? "" : ` <span class="wkd">· ${startLabel(w)}</span>`}</span><span class="wkc">${counts(w)}</span></div>`;
    const recent = weeks.slice(1,3).map((w,i)=> rowHtml(w, i+1)).join("");
    const older = weeks.slice(3).map((w,i)=> rowHtml(w, i+3)).join("");

    const curRow = `<div class="wkrow cur"><span class="wkl"><button id="weeklyHistBtn" aria-expanded="${weeklyOpen}" aria-label="Verlauf der Wochen">Diese Woche <i>${weeklyOpen ? "▴" : "▾"}</i></button></span><span class="wkc">${counts(weeks[0])}</span></div>`;
    holder.innerHTML = `<div class="wkcard">
      ${curRow}
      ${recent}
      <div id="weeklyHistoryHolder" style="display:${weeklyOpen ? "block" : "none"};">
        ${older}
        ${hasMore ? `<button id="weeklyMoreBtn" style="width:100%;margin-top:6px;background:none;border:1px dashed var(--line);color:var(--text-muted);border-radius:10px;min-height:44px;padding:10px;font-size:12.5px;font-weight:600;font-family:'Inter',sans-serif;">Mehr laden (${WEEKLY_STEP} weitere Wochen)</button>`
                   : `<div style="font-size:11px;color:var(--text-muted);padding:8px 0 2px;text-align:center;">Das war der Anfang – ältere Einträge gibt es nicht.</div>`}
      </div>
    </div>`;

    document.getElementById("weeklyHistBtn").addEventListener("click", ()=>{
      weeklyOpen = !weeklyOpen;
      document.getElementById("weeklyHistoryHolder").style.display = weeklyOpen ? "block" : "none";
      const btn = document.getElementById("weeklyHistBtn");
      btn.setAttribute("aria-expanded", String(weeklyOpen));
      btn.innerHTML = "Diese Woche <i>" + (weeklyOpen ? "▴" : "▾") + "</i>";
    });
    const more = document.getElementById("weeklyMoreBtn");
    if(more) more.addEventListener("click", async ()=>{
      more.disabled = true; more.textContent = "Lade …";
      weeklyCount += WEEKLY_STEP;
      await renderWeeklyGoals();
    });
  }catch(e){
    console.error("renderWeeklyGoals", e);
    holder.innerHTML = "";
  }
}

function renderSessionView(dayKey, date, sd){
  const host = document.getElementById("sessionView");
  if(!sd){ host.innerHTML = `<p class="plhint">Für dieses Datum gibt es keine Einträge.</p>`; return; }
  const day = DAYS[dayKey];
  const wd = new Date(date + "T12:00:00").toLocaleDateString("de-DE", { weekday: "long" });
  const longDate = date.slice(8) + "." + date.slice(5, 7) + "." + date.slice(0, 4);
  const exn = sd["_exnotes"] || {}, sg = sd["_steigern"] || {};
  const used = new Set();
  let sets = 0;
  const vals = arr => {
    const a = (Array.isArray(arr) ? arr : []).map(v => String(v == null ? "" : v).trim());
    return a.some(Boolean) ? a : null;
  };
  const line = (name, key, stretch) => {
    const a = vals(sd[key]); if(!a) return "";
    used.add(key);
    if(!stretch) sets += a.filter(Boolean).length;
    const { base, tempo } = splitExName(name);
    const note = exn[key] || exn[name];
    const flag = sg[key] || sg[name];
    return `<div class="sv-row"><div class="sv-name"><b>${escapeHtml(base)}</b>${tempo ? `<span>${escapeHtml(tempo)}</span>` : ""}</div>
      <div class="sv-val${(stretch ? (a[0] || "").length : a.join(" · ").length) > 22 ? " long" : ""}">${stretch ? escapeHtml(a[0] || "–") : a.map(v => escapeHtml(v || "–")).join(" · ")}</div>
      ${flag && flag.on ? `<div class="sv-sub"><b>↑ Steigern</b>${flag.note ? " · " + escapeHtml(flag.note) : ""}</div>` : ""}
      ${note ? `<div class="sv-sub">${escapeHtml(note)}</div>` : ""}</div>`;
  };
  const blocks = [];
  (day ? day.blocks : []).forEach(b => {
    const rows = b.items.map(it => {
      const key = namesFor(it.uebung).find(n => sd[n] !== undefined);
      return key ? line(it.uebung, key, it.stretch) : "";
    }).join("");
    if(rows) blocks.push({ name: b.name, rows });
  });
  const rest = Object.keys(sd).filter(k => k[0] !== "_" && Array.isArray(sd[k]) && !used.has(k))
    .map(k => line(k, k, false)).join("");
  if(rest) blocks.push({ name: "Weitere Übungen", rows: rest });
  host.innerHTML = `
    <div class="sv-head"><h1>${escapeHtml(day ? day.title : dayKey)}</h1>
      <div class="sv-meta">${escapeHtml(wd)}, ${longDate}${sets ? " · " + sets + " Sätze" : ""}</div></div>
    ${blocks.map(b => `<div class="sv-block"><div class="block-title">${escapeHtml(b.name || "")}</div>${b.rows}</div>`).join("")}
    ${sd["_notes"] ? `<div class="sv-block"><div class="block-title">Notizen zur Session</div><div class="sv-note">${escapeHtml(sd["_notes"])}</div></div>` : ""}
    <div class="sv-foot"><button id="sessEdit" data-day="${escapeAttr(dayKey)}" data-date="${escapeAttr(date)}">Bearbeiten</button></div>`;
  document.getElementById("sessEdit").onclick = ev => {
    const b = ev.currentTarget;
    if(confirm("Die Session vom " + longDate + " bearbeiten? Speichern überschreibt dann diesen Termin.")) editSession(b.dataset.day, b.dataset.date);
  };
}

// Startseite: wird so weit verdichtet (f1–f4), bis alles auf den Bildschirm passt; dann ist das Scrollen gesperrt.
// Passt es selbst verdichtet nicht (oder ist "Tag ändern" offen), scrollt die Seite normal.
function viewH(){
  const c = [window.innerHeight, document.documentElement.clientHeight];
  if(window.visualViewport) c.push(Math.round(window.visualViewport.height));
  return Math.min(...c.filter(v => v > 0));
}
let fitBusy = false;
function fitStart(){
  if(fitBusy) return;
  fitBusy = true;
  try{
    const page = document.getElementById("pageStart"), root = document.documentElement;
    const on = currentPage === "start" && page && page.classList.contains("on");
    root.classList.remove("nofit");
    ["f1", "f2", "f3", "f4"].forEach(c => page && page.classList.remove(c));
    if(!on){ if(page) page.style.minHeight = ""; return; }
    // Sichtbare Höhe selbst messen: 100vh/100dvh ist in installierten Android-Apps nach dem Neuladen oft größer als das Fenster
    const H = viewH();
    page.style.minHeight = H + "px";
    let fits = false;
    if(document.getElementById("dayPanel").hidden){
      for(let lvl = 0; lvl <= 4; lvl++){
        if(lvl > 0) page.classList.add("f" + lvl);
        fits = root.scrollHeight <= H + 1;
        if(fits) break;
      }
    }
    root.classList.toggle("nofit", fits);
    if(fits && window.scrollY) window.scrollTo(0, 0);
  } finally { fitBusy = false; }
}
// Nach App-Wechsel / Drehen / Fenstergröße neu prüfen (der Browser meldet die Höhe nach dem Zurückkehren oft erst verzögert)
function fitStartSoon(){ fitStart(); [120, 400, 1000].forEach(t => setTimeout(fitStart, t)); }
["resize", "orientationchange", "pageshow", "focus"].forEach(ev => window.addEventListener(ev, fitStartSoon));
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") fitStartSoon(); });
if(window.visualViewport) window.visualViewport.addEventListener("resize", fitStartSoon);
(function(){
  const page = document.getElementById("pageStart");
  if(page && "ResizeObserver" in window) new ResizeObserver(fitStart).observe(page);
  new MutationObserver(fitStart).observe(document.getElementById("weeklyGoalsHolder"), { childList: true, subtree: true });
  document.getElementById("dayPanelBtn").addEventListener("click", () => setTimeout(fitStart, 50));
  // Diagnose (Logo lange gedrückt): zeigt die gemessenen Höhen, falls die Startseite einmal nicht passt
  const hd = document.querySelector("#pageStart .header");
  if(hd){
    let t = null;
    hd.addEventListener("pointerdown", () => { t = setTimeout(() => {
      const root = document.documentElement, vv = window.visualViewport;
      showToast("innen " + window.innerHeight + " · client " + root.clientHeight + " · vv " + (vv ? Math.round(vv.height) : "–") + " · inhalt " + root.scrollHeight + " · Stufe " + (document.getElementById("pageStart").className.match(/f\d/g) || ["0"]).length + " · gesperrt " + root.classList.contains("nofit") + " · dpr " + window.devicePixelRatio);
    }, 700); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => hd.addEventListener(ev, () => clearTimeout(t)));
  }
})();

// Kopfleiste und Blocküberschriften bleiben oben sichtbar, auch wenn die Tastatur den sichtbaren Bereich nach unten verschiebt
// (Chrome auf Android verschiebt dann den sichtbaren Ausschnitt gegenüber dem Seitenlayout; "sticky" bliebe sonst oben außerhalb).
(function(){
  const vv = window.visualViewport;
  if(!vv) return;
  let raf = 0;
  const pin = () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const t = Math.max(0, Math.round(vv.offsetTop));
      document.documentElement.style.setProperty("--vvt", t + "px");
    });
  };
  vv.addEventListener("resize", pin);
  vv.addEventListener("scroll", pin);
  window.addEventListener("scroll", pin, { passive: true });
  document.addEventListener("focusin", () => { pin(); setTimeout(pin, 250); });
  document.addEventListener("focusout", () => setTimeout(pin, 250));
})();

async function bootstrap(){
  // Zuerst liegengebliebene Eingaben senden (Zeiger stimmt danach); ohne Netz bleiben sie gesichert
  if(pendingCount()) await Promise.race([flushPending(), new Promise(r => setTimeout(r, 6000))]);
  const idx = await getPointer();
  const key = SEQUENCE[idx];
  currentDay = key || "l2a"; // Review-Slot -> Fallback L2A
  let todaySaved = false;

  // Max. eine normale Trainingseinheit pro Tag: falls für heute schon EIN Tag (egal welcher)
  // geloggt wurde, den direkt öffnen statt des Zeiger-Vorschlags.
  try{
    const dayKeys = Object.keys(DAYS);
    const { data, error } = await sb
      .from("training_sessions")
      .select("day_key")
      .eq("person", PERSON)
      .eq("session_date", todayStr())
      .in("day_key", dayKeys)
      .maybeSingle();
    if(!error && data){ currentDay = data.day_key; todaySaved = true; }
  }catch(e){ console.error("bootstrap today-check", e); }

  // Noch ungesendete Einheit von heute (kein Netz)? Dann genau diese öffnen und wiederherstellen.
  const leftover = Object.values(pendingAll()).find(j => j.date === todayStr() && DAYS[j.day]);
  if(leftover){ currentDay = leftover.day; todaySaved = true; }

  await init();
  if(leftover){
    document.getElementById("dateInput").value = leftover.date;
    applySessionData(leftover.data, leftover.date);
    sessionKnown = null;
    setSaveState("queued"); schedulePendingRetry();
    showToast("Ungesendete Eingaben wiederhergestellt – werden gesendet, sobald Netz da ist");
  }
  // Ist heute schon ein Training gespeichert, öffnet die App direkt dort statt auf der Startseite.
  if(todaySaved) showPage("train", { noHistory: true, top: true });
}
// Offline öffnen: Service Worker (App-Hülle, Schriften, Bibliothek); Daten kommen aus dem Lese-Cache oben
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(e => console.error("sw", e)); });
}

// Ladebildschirm: bleibt mindestens kurz stehen (kein Aufblitzen), spätestens nach 12 s weg
const splashStart = Date.now();
function hideSplash(){
  const el = document.getElementById("splash");
  if(!el || el.classList.contains("done")) return;
  const wait = Math.max(0, 700 - (Date.now() - splashStart));
  setTimeout(()=>{ el.classList.add("done"); setTimeout(()=>{ el.style.display = "none"; }, 400); }, wait);
}
setTimeout(hideSplash, 12000);
Promise.all([bootstrap(), renderWeeklyGoals()]).then(hideSplash, hideSplash);

</script>
