<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Trainingslog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#12201B;
    --surface:#1B2B24;
    --surface-2:#22362D;
    --line:#2C4038;
    --accent:#49B8A6;
    --accent-dim:#2E6F65;
    --text:#EDEDE4;
    --text-muted:#8FA79B;
    --amber:#D9A441;
    --danger:#D9705A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  body{padding-bottom:60px;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  .header{padding:22px 16px 10px;}
  .header h1{font-size:22px;font-weight:700;letter-spacing:0.2px;}
  .header p{margin:4px 0 0;color:var(--text-muted);font-size:13px;}

  .daytabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 14px;-webkit-overflow-scrolling:touch;}
  .daytab{flex:0 0 auto;padding:8px 13px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--text-muted);font-size:12.5px;font-weight:600;font-family:'Space Grotesk',sans-serif;white-space:nowrap;}
  .daytab.active{background:var(--accent-dim);color:var(--text);border-color:var(--accent);}

  .streak{display:flex;align-items:center;gap:7px;padding:0 16px 14px;}
  .streak .dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
  .streak .dot.filled{background:var(--accent);}
  .streak .label{font-size:11px;color:var(--text-muted);margin-left:4px;}

  .datebar{display:flex;align-items:center;gap:10px;padding:0 16px 16px;}
  .datebar input[type=date]{background:var(--surface);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:8px 10px;border-radius:8px;flex:1;}
  .datebar select{background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:12.5px;padding:8px 10px;border-radius:8px;font-family:'Inter',sans-serif;}

  .warmup-toggle{margin:0 16px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--text-muted);}
  .warmup-toggle summary{cursor:pointer;font-weight:600;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;}
  .warmup-toggle table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px;}
  .warmup-toggle td{padding:3px 4px;border-bottom:1px solid var(--line);}
  .warmup-toggle td:last-child{text-align:right;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;}

  .block{margin:0 16px 16px;}
  .block-title{font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);font-weight:700;font-family:'Space Grotesk',sans-serif;margin:0 0 8px 2px;display:flex;align-items:center;gap:6px;}
  .block-title::before{content:"";width:10px;height:2px;background:var(--accent);display:inline-block;}

  .exrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;}
  .exrow.stretch{background:transparent;border-style:dashed;}
  .exrow .exname{font-size:14px;font-weight:600;}
  .exrow.stretch .exname{font-style:italic;font-weight:500;color:var(--text-muted);}
  .exrow .exziel{font-size:12px;color:var(--text-muted);margin-top:2px;font-family:'IBM Plex Mono',monospace;}
  .setboxes{display:flex;gap:6px;margin-top:9px;}
  .setboxes input{flex:1;width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;text-align:center;border-radius:7px;padding:9px 2px;}
  .setboxes input::placeholder{color:#7F978B;font-weight:500;}
  .setboxes input:not(:placeholder-shown){border-color:var(--accent-dim);}
  .setboxes input:focus{outline:none;border-color:var(--accent);}
  .exrow .extempo{font-size:12px;color:var(--amber);margin-top:2px;font-weight:500;}
  .setboxes .sb{position:relative;flex:1;min-width:0;}
  .setboxes .sb .dlt{position:absolute;top:2px;right:6px;font-size:9.5px;font-weight:700;font-family:'IBM Plex Mono',monospace;pointer-events:none;}
  .last-hint:empty,.prevnote:empty{display:none;}
  .last-hint .takeBtn{background:none;border:none;padding:0;color:var(--accent);font-size:11px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;}
  .prevnote{margin-top:7px;padding-left:8px;border-left:2px solid var(--amber);font-size:12px;line-height:1.4;color:var(--text-muted);font-style:italic;white-space:pre-wrap;}
  .noteBtn{background:none;border:none;font-size:12px;cursor:pointer;vertical-align:middle;opacity:.5;padding:0 3px;}
  .noteBtn.has{opacity:1;}
  .exnote{width:100%;margin-top:8px;min-height:46px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;border-radius:8px;padding:8px 10px;resize:vertical;}
  .exnote[hidden]{display:none;}
  .exnote:focus{outline:none;border-color:var(--accent);}
  .hnote{margin-top:2px;padding-left:8px;border-left:2px solid var(--amber);font-style:italic;white-space:pre-wrap;}
  .exrow .goalhint{display:none;margin-top:7px;font-size:11.5px;font-weight:600;color:var(--accent);background:rgba(73,184,166,0.10);border:1px solid var(--accent-dim);border-radius:7px;padding:5px 9px;}
  .exrow .goalhint.show{display:block;}
  .more-toggle{margin:0 16px 16px;}
  .more-toggle > summary{cursor:pointer;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;color:var(--text);}
  .more-toggle > summary::-webkit-details-marker{display:none;}
  .more-toggle > summary::before{content:"▸ ";color:var(--text-muted);}
  .more-toggle[open] > summary::before{content:"▾ ";}
  .more-toggle > summary span{color:var(--text-muted);font-family:'Inter',sans-serif;font-weight:400;font-size:11.5px;}
  .more-toggle > .more-body{margin-top:12px;}
  .more-toggle > .more-body > div{margin-left:0 !important;margin-right:0 !important;}
  .toast{z-index:100;}

  /* Tageskarte: aktueller Trainingstag, Datum, Schnell-Einträge */
  .daycard{margin:0 16px 14px;padding:13px 14px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;}
  .daycard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .daycard-meta{font-size:11.5px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .chip{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--accent-dim);color:var(--text);}
  .chip.warn{background:rgba(217,164,65,0.18);color:var(--amber);}
  .daycard-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;margin-top:3px;}
  .daycard-change{flex:0 0 auto;background:var(--surface-2);border:1px solid var(--line);color:var(--text-muted);border-radius:8px;padding:7px 10px;font-size:11.5px;font-weight:600;font-family:'Inter',sans-serif;}
  .nextchip{display:block;width:100%;text-align:left;margin-top:10px;background:rgba(73,184,166,0.10);border:1px solid var(--accent-dim);color:var(--text);border-radius:8px;padding:8px 10px;font-size:12px;font-family:'Inter',sans-serif;}
  .nextchip b{font-family:'Space Grotesk',sans-serif;}
  div.nextchip{border-style:dashed;color:var(--text-muted);}
  .quickrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px;}
  .quickrow button{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 2px 8px;color:var(--text);font-family:'Inter',sans-serif;}
  .quickrow .qi{display:block;font-size:19px;line-height:1.1;}
  .quickrow .ql{display:block;font-size:11px;margin-top:3px;font-weight:600;}
  .quickrow .qdot{display:none;position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .quickrow button.has{border-color:var(--accent-dim);}
  .quickrow button.has .qdot{display:block;}
  .daypanel{margin:0 0 14px;}
  .daypanel[hidden]{display:none;}

  /* Bottom-Sheet: alle Einträge eines Tages */
  .sheet{position:fixed;inset:0;z-index:50;display:none;}
  .sheet.open{display:block;}
  .sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.6);}
  .sheet-panel{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;}
  .sheet-head h2{font-size:16px;}
  .sheet-x{background:var(--surface);border:1px solid var(--line);color:var(--text-muted);border-radius:8px;width:34px;height:34px;font-size:15px;}
  .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 8px;}
  .sheet-foot{padding:10px 16px 16px;border-top:1px solid var(--line);}
  .sheet-date{display:flex;gap:6px;align-items:center;margin-bottom:12px;}
  .sheet-date input[type=date]{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:8px 10px;border-radius:8px;}
  .sheet-date button{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 11px;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;}
  .sheet-date .today{font-size:12px;color:var(--accent);}
  .sheet-training{margin-bottom:12px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .sheet-training button{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:7px;padding:6px 10px;font-size:11.5px;font-weight:600;}
  .sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px 12px;margin-bottom:10px;}
  .sec.focus{border-color:var(--accent);}
  .sec h3{font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .sec .st{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;color:var(--text-muted);}
  .sec .st.ok{color:var(--accent);}
  .sec textarea{width:100%;min-height:58px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:'Inter',sans-serif;font-size:13.5px;border-radius:8px;padding:9px 11px;resize:vertical;}
  .sec .bodygrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .sec .bodygrid label{font-size:10.5px;color:var(--text-muted);display:block;margin-bottom:3px;}
  .sec input.num,.sec input.tm{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;text-align:center;padding:9px 2px;border-radius:7px;}
  .sec .bodytime{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;color:var(--text-muted);}
  .sec .bodytime input{width:110px;}
  .sec .bodyhint{font-size:10px;color:var(--text-muted);margin-top:8px;}
  .sec .secdel{margin-top:8px;background:none;border:none;color:var(--danger);font-size:11.5px;padding:2px 0;font-family:'Inter',sans-serif;}
  .sheet input:focus,.sheet textarea:focus{outline:none;border-color:var(--accent);}
  .recent{margin:4px 0 6px;}
  .recent > summary{cursor:pointer;font-size:12.5px;font-weight:600;font-family:'Space Grotesk',sans-serif;color:var(--text-muted);padding:8px 2px;}
  .recent-row{display:flex;gap:10px;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line);padding:8px 2px;color:var(--text);font-family:'Inter',sans-serif;}
  .recent-row .rd{flex:0 0 74px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-muted);padding-top:1px;}
  .recent-row .rs{flex:1;font-size:12px;line-height:1.45;}
  .recent-row.cur{background:rgba(73,184,166,0.08);}

  .savebar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg, transparent, var(--bg) 30%);padding:16px 16px 18px;}
  .savebtn{width:100%;background:var(--accent);color:#0D1813;border:none;border-radius:12px;padding:14px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.2px;}
  .savebtn:active{background:var(--accent-dim);color:var(--text);}
  .savebtn.saved{background:#3B5147;color:var(--accent);}

  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--accent);color:var(--text);padding:9px 16px;border-radius:20px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;}
  .toast.show{opacity:1;}

  .last-hint{font-size:11px;color:var(--text-muted);margin-top:5px;}
</style>
</head>
<body>

<div class="header">
  <h1>Trainingslog</h1>
</div>

<div id="weeklyGoalsHolder"></div>

<div class="daycard" id="dayCard">
  <div class="daycard-top">
    <div>
      <div class="daycard-meta" id="dayCardMeta"></div>
      <div class="daycard-title" id="dayCardTitle"></div>
    </div>
    <button class="daycard-change" id="dayPanelBtn" aria-expanded="false">Tag ändern ▾</button>
  </div>
  <div id="dayCardNext"></div>
  <div class="quickrow" id="quickRow">
    <button data-type="lauf"><span class="qi">🏃</span><span class="ql">Lauf</span><i class="qdot"></i></button>
    <button data-type="schwimmen"><span class="qi">🏊</span><span class="ql">Schwimmen</span><i class="qdot"></i></button>
    <button data-type="koerper"><span class="qi">⚖️</span><span class="ql">Körper</span><i class="qdot"></i></button>
    <button data-type="sonstiges"><span class="qi">📝</span><span class="ql">Sonstiges</span><i class="qdot"></i></button>
  </div>
</div>
<div id="editModeHolder"></div>

<!-- Selten gebraucht: anderen Tag öffnen, Datum/ältere Session, Zeiger, Kalender -->
<div class="daypanel" id="dayPanel" hidden>
  <div id="nextSessionHolder"></div>
  <div class="daytabs" id="daytabs"></div>
  <div class="streak" id="streak"></div>
  <div class="datebar">
    <input type="date" id="dateInput">
    <select id="historySelect"><option value="">Letzte Sessions…</option></select>
  </div>
  <div id="calendarHolder"></div>
</div>

<div id="orphanedHolder"></div>
<div id="warmupHolder"></div>
<div id="blocksHolder"></div>

<div style="margin:0 16px 16px;">
  <div class="block-title" style="margin-bottom:6px;">Notizen zur Session</div>
  <textarea id="sessionNotes" placeholder="Allgemeines zur Session (optional) – z. B. wie es sich angefühlt hat, Auffälligkeiten, Ideen für Anpassungen…" style="width:100%;min-height:70px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;border-radius:10px;padding:11px 13px;resize:vertical;"></textarea>
</div>

<details class="more-toggle" id="moreEntries" style="margin-bottom:90px;">
  <summary>Export &amp; Sessions verwalten</summary>
  <div class="more-body">
<div style="margin:0 16px 16px;">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
    <label for="exportWeeks" style="font-size:12px;color:var(--text-muted);">Letzte</label>
    <input type="number" id="exportWeeks" value="6" min="1" max="52" style="width:52px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:6px;border-radius:6px;text-align:center;">
    <label for="exportWeeks" style="font-size:12px;color:var(--text-muted);">Wochen exportieren</label>
  </div>
  <button id="exportBtn" style="width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text-muted);border-radius:10px;padding:11px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;">Log als Markdown exportieren</button>
  <textarea id="exportArea" readonly style="display:none;width:100%;height:220px;margin-top:10px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:11.5px;border-radius:8px;padding:10px;"></textarea>

  <button id="manageSessionsBtn" style="width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text-muted);border-radius:10px;padding:11px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;margin-top:10px;">Alle Sessions anzeigen / löschen</button>
  <div id="sessionsListHolder" style="display:none;margin-top:10px;"></div>
</div>
  </div>
</details>

<div class="sheet" id="daySheet" aria-hidden="true">
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet-panel" role="dialog" aria-label="Einträge für den Tag">
    <div class="sheet-head">
      <h2>Einträge für den Tag</h2>
      <button class="sheet-x" id="sheetClose" aria-label="Schließen">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody">
      <div class="sheet-date">
        <button id="sheetPrev" aria-label="Vortag">‹</button>
        <input type="date" id="sheetDate">
        <button id="sheetNext" aria-label="Folgetag">›</button>
        <button id="sheetToday" class="today">Heute</button>
      </div>
      <div id="sheetTraining"></div>
      <div id="sheetSections"></div>
      <details class="recent" id="sheetRecentBox">
        <summary>Letzte Einträge – zum Ändern antippen</summary>
        <div id="sheetRecent"></div>
      </details>
    </div>
    <div class="sheet-foot"><button class="savebtn" id="sheetSave">Speichern</button></div>
  </div>
</div>

<div class="toast" id="toast">Gespeichert</div>
<div class="savebar"><button class="savebtn" id="saveBtn">Session speichern</button></div>

<script>
const ALLGEMEIN_WARMUP = [
  { title:"Allgemeines Aufwärmen (1x)", rows:[
    ["Arm Swing Forward","20 Wdh"],["Arm Swing Backward","20 Wdh"],["Air Squat","20 Wdh"],
    ["Scapula Push-up","10 Wdh"],["Deep Squat + Fold","8 Wdh"],["Wrist Circle","15 Wdh"],
    ["Supinated Wrist Stretch","30s"],["Flipped Wrist Stretch","30s"],["Flipped Wrist Squeeze","30s"],
    ["BWS-Mobilisation auf Rolle (Wirbel für Wirbel)","8-10 Wdh"],
  ]},
  { title:"Pre-Workout Mobility (2 Sätze)", rows:[
    ["Pronated Dislocation (Towel)","10 Wdh"],["Supinated Dislocation (Towel)","10 Wdh"],
    ["1st Knuckle Wrist Flexion","5 Wdh"],["Fingertip Wrist Flexion","5 Wdh"],
    ["Flipped Wrist Extension","5 Wdh"],["Active-passive Hang","30s"],
    ["Reverse Table Top (vereinfacht)","5 Wdh"],["Downward Facing Dog","60s"],
  ]},
];
const HS_WARMUP = [
  { title:"Allgemeines Warm-up (1x)", rows:[
    ["Arm Swing Forward","20 Wdh"],["Arm Swing Backward","20 Wdh"],["Deep Squat + Fold","8 Wdh"],
    ["Standing Back Bend Lvl3","10 Wdh"],["Standing Side Bend Lvl3","10 Wdh je Seite"],
    ["BWS-Mobilisation auf Rolle (Wirbel für Wirbel)","8-10 Wdh"],
  ]},
  { title:"Specific Warm-up (1x)", rows:[
    ["Wrist Circle","15 Wdh"],["Supinated Wrist Stretch","30s"],["Flipped Wrist Stretch","30s"],["Flipped Wrist Squeeze","30s"],
  ]},
  { title:"Mobility & Joint Strength (2 Sätze)", rows:[
    ["Pronated Dislocation (Towel)","15 Wdh"],["Supinated Dislocation (Towel)","15 Wdh"],
    ["1st Knuckle Wrist Flexion","10 Wdh"],["Fingertip Wrist Flexion","10 Wdh"],
    ["Flipped Wrist Extension","10 Wdh"],["Downward Facing Dog","60s"],
    ["Prone Y-Raise (Bauchlage)","10–15 Wdh"],
  ]},
];

const TRAVEL_WARMUP = [
  { title:"Pulserhoehung (1x)", rows:[
    ["Hampelmaenner / auf der Stelle huepfen","60s"],
  ]},
  { title:"Handgelenke (1x)", rows:[
    ["Handgelenkskreisen","15 Wdh je Richtung"],["Wrist Rocks (Vierfuesslerstand, Gewicht vor/zurueck)","10 Wdh"],
    ["Handruecken-Dehnung","20s"],["Handinnenflaechen-Dehnung","20s"],
  ]},
  { title:"Schultern (1x)", rows:[
    ["Armkreisen gross","10 Wdh je Richtung"],["Scapula Push-up","10 Wdh"],["Cat-Cow","8 Wdh"],
  ]},
  { title:"Huefte/Knie/Sprunggelenk (1x)", rows:[
    ["Beinschwingen vor/zurueck","10 Wdh je Seite"],["Beinschwingen seitlich","10 Wdh je Seite"],
    ["Ausfallschritt mit Rotation","2 Wdh je Seite"],["Air Squat","10 Wdh"],["Wadenheben","10 Wdh"],
  ]},
  { title:"Einschleichen (1x)", rows:[
    ["Liegestuetz locker","3 Wdh"],["Wandkontakt-Handstand-Aufbau","2x 5-10s"],
  ]},

function ex(uebung, saetze, ziel, stretch){ return {uebung, saetze, ziel, stretch: !!stretch}; }

// Typ eines Ziels grob klassifizieren, um Platzhalter aus anderen Tagestypen nur
// zu übernehmen, wenn der Übungstyp (sammeln vs. bis Muskelversagen) übereinstimmt.
function zielType(ziel){
  if(!ziel) return null;
  if(ziel.startsWith("sammeln")) return "sammeln";
  if(ziel.includes("bis Muskelversagen")) return "max";
  return null;
}
// Ziel-Text einer Übung (per aktuellem Namen/Alias) innerhalb eines bestimmten Tagestyps finden.
function findZielFor(name, dayKey){
  const day = DAYS[dayKey];
  if(!day) return null;
  for(const block of day.blocks){
    for(const item of block.items){
      if(namesFor(item.uebung).includes(name)) return item.ziel;
    }
  }
  return null;
}

async function getPointer(){
  try{
    const { data, error } = await sb
      .from("training_sessions")
      .select("data")
      .eq("person", PERSON)
      .eq("day_key", META_KEY)
      .eq("session_date", META_DATE)
      .maybeSingle();
    if(error) throw error;
    if(data && data.data && typeof data.data.idx === "number") return data.data.idx;
  }catch(e){ console.error("getPointer", e); }
  return 0;
}

async function setPointer(idx){
  idx = ((idx % SEQUENCE.length) + SEQUENCE.length) % SEQUENCE.length;
  try{
    await sb.from("training_sessions").upsert(
      { person: PERSON, day_key: META_KEY, session_date: META_DATE, data: { idx }, updated_at: new Date().toISOString() },
      { onConflict: "person,day_key,session_date" }
    );
  }catch(e){ console.error("setPointer", e); }
  return idx;
}

function renderExRow(it){
  const row = document.createElement("div");
  row.className = "exrow" + (it.stretch ? " stretch" : "");
  const currentType = zielType(it.ziel);
  const prevKey = namesFor(it.uebung).find(n => lastSessionValues[n] !== undefined);
  let prev = [];
  if(prevKey){
    const entry = lastSessionValues[prevKey];
    const sourceType = zielType(findZielFor(prevKey, entry.dayKey));
    // Nur übernehmen, wenn kein eindeutiger Typkonflikt vorliegt (sammeln vs. bis Muskelversagen).
    if(!(currentType && sourceType && currentType !== sourceType)){
      prev = entry.value;
    }
  }

  const n = it.stretch || it.saetze === "-" ? 1 : parseInt(it.saetze,10);
  let boxes = "";
  if(it.stretch){
    const ph = prev[0] !== undefined && prev[0] !== "" ? prev[0] : "leer = alles ok";
    boxes = `<input type="text" data-ex="${escapeAttr(it.uebung)}" data-idx="0" placeholder="${escapeAttr(ph)}" style="text-align:left;font-family:'Inter',sans-serif;font-weight:400;font-size:13px;">`;
  } else {
    for(let i=0;i<n;i++){
      const ph = prev[i] !== undefined ? prev[i] : "";
      boxes += `<div class="sb"><input type="text" data-ex="${escapeAttr(it.uebung)}" data-idx="${i}" placeholder="${ph}"><span class="dlt"></span></div>`;
    }
  }
  const { base, tempo } = it.stretch ? { base: it.uebung, tempo: null } : splitExName(it.uebung);
  const zielLine = it.stretch ? it.ziel : it.ziel + (it.saetze!=="-" ? " · "+it.saetze+" Sätze" : "");
  row.innerHTML = `
    <div class="exname">${base} <button class="histBtn" style="background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer;vertical-align:middle;">⏱ Verlauf</button><button class="noteBtn" type="button" title="Notiz zur Übung" aria-label="Notiz zur Übung">📝</button></div>
    ${tempo ? `<div class="extempo">${tempo}</div>` : ""}
    <div class="exziel">${zielLine}</div>
    <div class="prevnote"></div>
    <div class="setboxes">${boxes}</div>
    <div class="last-hint"></div>
    ${it.stretch ? "" : `<div class="goalhint">✓ Obergrenze in allen Sätzen erreicht – Zeit für die nächste Stufe?</div>`}
    <textarea class="exnote" data-ex="${escapeAttr(it.uebung)}" rows="2" placeholder="Notiz zu dieser Übung – wird beim nächsten Mal angezeigt" hidden></textarea>
  `;
  const inputs = [...row.querySelectorAll(".setboxes input")];
  const hintEl = row.querySelector(".last-hint");
  const prevNoteEl = row.querySelector(".prevnote");
  const goalEl = row.querySelector(".goalhint");
  let last = null; // letzte echte Session (nicht das gerade geöffnete Datum)

  // Live: ▲/▼ gegenüber dem letzten Mal pro Satz, Ziel-Hinweis
  const live = ()=>{
    inputs.forEach((inp, i)=>{
      const el = inp.parentElement.querySelector(".dlt");
      if(!el) return;
      const cur = numTotal(inp.value), old = last ? numTotal(last.value[i]) : null;
      if(cur !== null && old !== null && cur !== old){
        el.textContent = (cur > old ? "▲" : "▼") + fmtNum(Math.abs(cur - old));
        el.style.color = cur > old ? "var(--accent)" : "var(--amber)";
      } else {
        el.textContent = "";
      }
    });
    if(goalEl){
      const typed = inputs.map(inp => inp.value.trim());
      // Sobald etwas eingetragen ist, zählen die eingetragenen Werte; sonst die letzte Session.
      const values = typed.some(v => v !== "") ? typed : (last ? last.value : []);
      goalEl.classList.toggle("show", goalReached(it.ziel, values, n));
    }
  };

  // Statisch (bei Aufbau, Datumswechsel, Laden einer Session): "zuletzt am …" + Übernehmen, letzte Notiz
  const refresh = ()=>{
    last = (!it.stretch && prev.length) ? lastRealSession(it.uebung) : null;
    hintEl.innerHTML = last ? `zuletzt am ${fmtShort(last.date)} · <button type="button" class="takeBtn">↺ wie letztes Mal übernehmen</button>` : "";
    const take = hintEl.querySelector(".takeBtn");
    if(take) take.onclick = ()=>{
      let filled = 0;
      inputs.forEach((inp, i)=>{
        const v = last.value[i];
        if(inp.value.trim() === "" && v !== undefined && String(v).trim() !== ""){ inp.value = v; filled++; }
      });
      live();
      showToast(filled ? "Werte vom " + fmtShort(last.date) + " übernommen" : "Alle Felder sind schon ausgefüllt");
    };
    const pn = lastRealNote(it.uebung);
    prevNoteEl.textContent = pn ? `📝 ${fmtShort(pn.date)} · ${pn.text}` : "";
    live();
  };
  inputs.forEach(inp => inp.addEventListener("input", live));
  row._refresh = refresh;

  // Notiz zu dieser Übung (für diese Session). Ohne Text bleibt nur der kleine Knopf sichtbar.
  const noteBtn = row.querySelector(".noteBtn");
  const noteTa = row.querySelector(".exnote");
  const syncNote = ()=> noteBtn.classList.toggle("has", noteTa.value.trim() !== "");
  noteBtn.onclick = (e)=>{
    e.preventDefault();
    if(noteTa.hidden){ noteTa.hidden = false; noteTa.focus(); }
    else if(noteTa.value.trim() === ""){ noteTa.hidden = true; }
    else noteTa.focus();
  };
  noteTa.addEventListener("input", syncNote);
  row._setNote = (text)=>{ noteTa.value = text || ""; noteTa.hidden = noteTa.value.trim() === ""; syncNote(); };

  refresh();
  attachHistoryButton(row, it.uebung);
  return row;
}

// Zahl bzw. Summe aus einem Satzwert: "10" -> 10, "6+5" -> 11, "20s" -> 20. Alles andere (z. B. "5x6kg") -> null.
function numTotal(v){
  const t = String(v ?? "").trim();
  if(!/^\d+(?:[.,]\d+)?\s*(?:s|sek|wdh)?(?:\s*\+\s*\d+(?:[.,]\d+)?\s*(?:s|sek|wdh)?)*$/i.test(t)) return null;
  return [...t.matchAll(/\d+(?:[.,]\d+)?/g)].reduce((a, m) => a + parseFloat(m[0].replace(",", ".")), 0);
}
function fmtNum(x){ return String(Math.round(x * 10) / 10).replace(".", ","); }

// Letzte Übungsnotiz aus einer früheren Session (nicht das gerade geöffnete Datum)
function lastRealNote(exName){
  const openDate = document.getElementById("dateInput").value;
  for(const nm of namesFor(exName)){
    const hit = (lastNotesByEx[nm] || []).find(x => x.date !== openDate);
    if(hit) return hit;
  }
  return null;
}

// Klammer-Zusatz mit Tempo/Pause (z. B. "(3s runter, 1s halten, 3s hoch)") nur für die
// Anzeige in eine eigene Zeile ziehen. Der gespeicherte Übungsname bleibt unverändert.
function splitExName(name){
  const m = name.match(/^(.*?)\s*\(([^()]*)\)$/);
  if(m && /\d\s*s\b|pause|halten/i.test(m[2])) return { base: m[1], tempo: m[2] };
  return { base: name, tempo: null };
}

// Obere Grenze aus dem Ziel-Text: "5–15, bis Muskelversagen" -> 15, "sammeln, Ziel 20s" -> 20,
// "sammeln, Ziel 5–10 Versuche" -> 10, "8, bis Muskelversagen" -> 8, "10 Wdh" -> 10.
function zielObergrenze(ziel){
  if(!ziel) return null;
  const m = ziel.match(/Ziel\s+(\d+)(?:\s*[–-]\s*(\d+))?/) || ziel.match(/^(\d+)(?:\s*[–-]\s*(\d+))?/);
  if(!m) return null;
  return parseInt(m[2] || m[1], 10);
}

// Ziel erreicht = alle Sätze ausgefüllt, jeder als saubere Zahl (ohne "+"-Blöcke) >= Obergrenze.
function goalReached(ziel, values, n){
  const top = zielObergrenze(ziel);
  if(top === null || !values || values.length < n) return false;
  for(let i=0;i<n;i++){
    const m = String(values[i] ?? "").trim().match(/^(\d+(?:[.,]\d+)?)\s*s?$/);
    if(!m || parseFloat(m[1].replace(",", ".")) < top) return false;
  }
  return true;
}

function lastRealSession(exName){
  const openDate = document.getElementById("dateInput").value;
  for(const n of namesFor(exName)){
    const hit = (lastSessionsByEx[n] || []).find(s => s.date !== openDate);
    if(hit) return hit;
  }
  return null;
}

function fmtShort(iso){
  const [y,m,d] = iso.split("-");
  return `${d}.${m}.`;
}

const HISTORY_PAGE_SIZE = 40;
const HISTORY_INITIAL_TARGET = 8;

function attachHistoryButton(row, exName){
  const btn = row.querySelector(".histBtn");
  const panel = document.createElement("div");
  panel.style.display = "none";
  panel.style.marginTop = "8px";
  panel.style.paddingTop = "8px";
  panel.style.borderTop = "1px dashed var(--line)";
  row.appendChild(panel);

  const state = { offset: 0, matches: [], exhausted: false, loading: false };

  function renderPanel(){
    const list = state.matches.map(r=>
      `<div style="font-size:11.5px;color:var(--text-muted);padding:2px 0;"><strong style="color:var(--text);font-family:'IBM Plex Mono',monospace;">${r.date}</strong> · ${r.dayTitle}: ${r.values}${r.renamedNote}${r.note ? `<div class="hnote">📝 ${escapeHtml(r.note)}</div>` : ""}</div>`
    ).join("");
    const empty = state.matches.length === 0
      ? '<div style="font-size:11px;color:var(--text-muted);">Noch keine weiteren Einträge für diese Übung.</div>'
      : "";
    const footer = state.exhausted
      ? (state.matches.length > 0 ? '<div style="font-size:10.5px;color:var(--text-muted);margin-top:6px;">Ende der Historie</div>' : "")
      : `<button class="loadMoreBtn" style="background:none;border:1px solid var(--line);color:var(--text-muted);font-size:11px;cursor:pointer;padding:5px 10px;border-radius:6px;margin-top:6px;">${state.loading ? "Lade…" : "Mehr laden"}</button>`;
    panel.innerHTML = list + empty + footer;
    const loadMoreBtn = panel.querySelector(".loadMoreBtn");
    if(loadMoreBtn) loadMoreBtn.onclick = (e)=>{ e.preventDefault(); loadNextPage(); };
  }

  async function loadNextPage(){
    if(state.loading || state.exhausted) return;
    state.loading = true;
    renderPanel();
    const startCount = state.matches.length;
    // Solange Rohdaten-Seiten nachladen, bis mind. 1 neuer Treffer dazukommt oder die Historie zu Ende ist
    // (Treffer sind je nach Übung dünn gesät, eine einzelne Seite kann leer ausgehen).
    while(state.matches.length === startCount && !state.exhausted){
      const { matches, fetchedCount } = await fetchExerciseHistoryPage(exName, state.offset, HISTORY_PAGE_SIZE);
      state.matches.push(...matches);
      state.offset += fetchedCount;
      if(fetchedCount < HISTORY_PAGE_SIZE){ state.exhausted = true; }
    }
    state.loading = false;
    renderPanel();
  }

  btn.onclick = async (e)=>{
    e.preventDefault();
    if(panel.style.display === "none"){
      panel.style.display = "block";
      if(state.matches.length === 0 && !state.exhausted){
        panel.innerHTML = '<div style="font-size:11px;color:var(--text-muted);">Lade…</div>';
        // Erstes Laden: so lange in Seiten nachladen, bis genug Treffer da sind oder Ende erreicht.
        while(state.matches.length < HISTORY_INITIAL_TARGET && !state.exhausted){
          const { matches, fetchedCount } = await fetchExerciseHistoryPage(exName, state.offset, HISTORY_PAGE_SIZE);
          state.matches.push(...matches);
          state.offset += fetchedCount;
          if(fetchedCount < HISTORY_PAGE_SIZE){ state.exhausted = true; }
        }
      }
      renderPanel();
    } else {
      panel.style.display = "none";
    }
  };
}

// Lädt einen Rohdaten-Block (nach Datum absteigend) und filtert ihn auf Treffer für diese Übung.
// Über offset/HISTORY_PAGE_SIZE seitenweise aufrufbar, damit "Mehr laden" die komplette
// Historie erreichen kann, nicht nur ein festes Fenster der letzten N Sessions.
async function fetchExerciseHistoryPage(exName, offset, pageSize){
  const names = namesFor(exName);
  try{
    const { data, error } = await sb
      .from("training_sessions")
      .select("day_key, session_date, data")
      .eq("person", PERSON)
      .neq("day_key", META_KEY)
      .order("session_date", { ascending: false })
      .range(offset, offset + pageSize - 1);
    if(error) throw error;
    const fetchedCount = (data || []).length;
    const matches = (data || [])
      .map(r => ({ r, matchName: names.find(n => r.data && r.data[n] !== undefined) }))
      .filter(x => x.matchName)
      .map(({r, matchName}) => ({
        date: r.session_date,
        dayTitle: DAYS[r.day_key] ? DAYS[r.day_key].label : r.day_key,
        values: Array.isArray(r.data[matchName]) ? r.data[matchName].map(v => v || "–").join(" / ") : r.data[matchName],
        renamedNote: matchName !== exName ? ` (damals: "${matchName}")` : "",
        note: (r.data._exnotes && r.data._exnotes[matchName]) || "",
      }));
    return { matches, fetchedCount };
  }catch(e){ console.error("fetchExerciseHistoryPage", e); return { matches: [], fetchedCount: 0 }; }
}

function escapeAttr(s){ return s.replace(/"/g,"&quot;"); }

function isEmptyTrackedValue(v){
  if(Array.isArray(v)) return v.every(x => !x || String(x).trim() === "");
  return !v || String(v).trim() === "";
}

async function loadLastSession(){
  lastSessionValues = {};
  lastSessionsByEx = {};
  lastNotesByEx = {};
  try{
    // Über alle Tagestypen suchen (nicht nur currentDay), damit Übungen, die in
    // mehreren Mustern vorkommen (z. B. Superman Push-up in L2A/L2B/L2C), immer
    // den zeitlich neuesten Wert als Platzhalter zeigen, egal aus welchem Tag.
    const { data, error } = await sb
      .from("training_sessions")
      .select("day_key, session_date, data")
      .eq("person", PERSON)
      .neq("day_key", META_KEY)
      .order("session_date", { ascending: false })
      .order("updated_at", { ascending: false })
      .limit(60);
    if(error) throw error;
    (data || []).forEach(row=>{
      if(!row.data) return;
      const exn = row.data["_exnotes"];
      if(exn && typeof exn === "object"){
        Object.keys(exn).forEach(name=>{
          const t = String(exn[name] || "").trim();
          if(!t) return;
          const list = lastNotesByEx[name] || (lastNotesByEx[name] = []);
          if(list.length < 2) list.push({ date: row.session_date, text: t });
        });
      }
      Object.keys(row.data).forEach(exName=>{
        if(exName === "_notes" || exName === "_exnotes") return;
        const rawVal = row.data[exName];
        // Die zwei neuesten Sessions mit echten Werten je Übung (für "zuletzt am" und den Ziel-Check).
        if(Array.isArray(rawVal) && !isEmptyTrackedValue(rawVal)){
          const list = lastSessionsByEx[exName] || (lastSessionsByEx[exName] = []);
          if(list.length < 2) list.push({ date: row.session_date, value: rawVal });
        }
        if(!Array.isArray(rawVal)){
          if(lastSessionValues[exName] !== undefined) return;
          if(isEmptyTrackedValue(rawVal)) return;
          lastSessionValues[exName] = { value: rawVal, dayKey: row.day_key };
          return;
        }
        if(!lastSessionValues[exName]){
          lastSessionValues[exName] = { value: [], dayKey: row.day_key };
        }
        const entry = lastSessionValues[exName];
        rawVal.forEach((v, idx)=>{
          const already = entry.value[idx];
          const alreadyFilled = already !== undefined && String(already).trim() !== "";
          if(!alreadyFilled && v !== undefined && v !== null && String(v).trim() !== ""){
            entry.value[idx] = v;
          }
        });
      });
    });
  }catch(e){ console.error("loadLastSession", e); }
}

async function loadSessionInto(date){
  try{
    const { data, error } = await sb
      .from("training_sessions")
      .select("data")
      .eq("person", PERSON)
      .eq("day_key", currentDay)
      .eq("session_date", date)
      .maybeSingle();
    if(error) throw error;
    if(!data || !data.data) return;
    const sessionData = data.data;
    document.getElementById("sessionNotes").value = sessionData["_notes"] || "";
    const matchedNames = new Set(["_notes", "_exnotes"]);
    const exn = sessionData["_exnotes"] || {};
    document.querySelectorAll("#blocksHolder textarea.exnote").forEach(ta=>{
      const k = namesFor(ta.getAttribute("data-ex")).find(nm => exn[nm] !== undefined);
      if(k) ta.closest(".exrow")._setNote(exn[k]);
    });
    document.querySelectorAll("#blocksHolder input").forEach(inp=>{
      const exName = inp.getAttribute("data-ex");
      const idx = parseInt(inp.getAttribute("data-idx"),10);
      const srcKey = namesFor(exName).find(n => sessionData[n] !== undefined);
      if(srcKey && sessionData[srcKey][idx] !== undefined){ inp.value = sessionData[srcKey][idx]; }
      if(srcKey) matchedNames.add(srcKey);
    });
    document.querySelectorAll("#blocksHolder .exrow").forEach(r => r._refresh && r._refresh());
    const orphaned = Object.keys(sessionData).filter(name => !matchedNames.has(name));
    const box = document.getElementById("orphanedHolder");
    if(orphaned.length > 0){
      const rows = orphaned.map(name => `<div style="margin-bottom:4px;"><strong>${name}:</strong> ${sessionData[name].map(v=>v||"–").join(" / ")}</div>`).join("");
      box.innerHTML = `<div style="margin:0 16px 14px;padding:10px 14px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;font-size:12px;color:var(--text-muted);">
        <div style="font-weight:600;color:var(--text);margin-bottom:6px;">Diese Session vom ${date} enthielt auch Übungen, die nicht mehr im aktuellen Plan stehen:</div>
        ${rows}
      </div>`;
    } else {
      box.innerHTML = "";
    }
    showToast("Session vom " + date + " geladen");
    const editBanner = document.getElementById("editModeHolder");
    if(date !== todayStr()){
      editBanner.innerHTML = `<div style="margin:0 16px 12px;padding:9px 14px;background:rgba(217,164,65,0.12);border:1px solid var(--amber);border-radius:9px;font-size:12px;color:var(--amber);font-weight:600;">
        ✎ Du bearbeitest die Session vom ${date} – nicht heute. Speichern überschreibt diesen Termin.
      </div>`;
    } else {
      editBanner.innerHTML = "";
    }
  }catch(e){ console.error("loadSessionInto", e); showToast("Fehler beim Laden: " + e.message); }
}

async function saveSession(){
  const date = document.getElementById("dateInput").value || todayStr();
  const data = {};
  document.querySelectorAll("#blocksHolder input").forEach(inp=>{
    const exName = inp.getAttribute("data-ex");
    const idx = parseInt(inp.getAttribute("data-idx"),10);
    if(!data[exName]) data[exName] = [];
    data[exName][idx] = inp.value || "";
  });
  const notesVal = document.getElementById("sessionNotes").value.trim();
  if(notesVal) data["_notes"] = notesVal;
  const exnotes = {};
  document.querySelectorAll("#blocksHolder textarea.exnote").forEach(ta=>{
    const v = ta.value.trim();
    if(v) exnotes[ta.getAttribute("data-ex")] = v;
  });
  if(Object.keys(exnotes).length) data["_exnotes"] = exnotes;
  try{
    // Vorher prüfen, ob für diesen Tag+Datum schon eine Session existiert -> nur bei neuer Session zählt es für den Zeiger
    const { data: existing, error: checkError } = await sb
      .from("training_sessions")
      .select("day_key")
      .eq("person", PERSON)
      .eq("day_key", currentDay)
      .eq("session_date", date)
      .maybeSingle();
    if(checkError) throw checkError;
    const isNewSession = !existing;

    // Prüfen, ob an diesem Datum bereits ein ANDERER Tagestyp gespeichert wurde -> nicht zwei Sessions an einem Tag
    if(isNewSession){
      const { data: otherDayRows, error: otherError } = await sb
        .from("training_sessions")
        .select("day_key")
        .eq("person", PERSON)
        .eq("session_date", date)
        .neq("day_key", META_KEY)
        .neq("day_key", currentDay)
        .in("day_key", Object.keys(DAYS)); // nur andere Trainingstag-Typen zählen, nicht Cardio/Sonstiges/Körperwerte
      if(otherError) throw otherError;
      const otherDay = (otherDayRows && otherDayRows.length > 0) ? otherDayRows[0] : null;
      if(otherDay){
        const otherTitle = DAYS[otherDay.day_key] ? DAYS[otherDay.day_key].title : otherDay.day_key;
        const proceed = confirm(`Für den ${date} ist bereits "${otherTitle}" gespeichert. Trotzdem zusätzlich "${DAYS[currentDay].title}" für denselben Tag anlegen?`);
        if(!proceed){ showToast("Abgebrochen"); return; }
      }
    }

    const { error } = await sb
      .from("training_sessions")
      .upsert(
        { person: PERSON, day_key: currentDay, session_date: date, data: data, updated_at: new Date().toISOString() },
        { onConflict: "person,day_key,session_date" }
      );
    if(error) throw error;
    const btn = document.getElementById("saveBtn");
    btn.classList.add("saved");
    btn.textContent = "Gespeichert ✓";
    setTimeout(()=>{ btn.classList.remove("saved"); btn.textContent = "Session speichern"; }, 1800);
    showToast(isNewSession ? "Gespeichert für " + date : "Session vom " + date + " aktualisiert (Zeiger unverändert)");
    await populateHistory();
    await renderStreak();
    if(isNewSession && SEQUENCE.includes(currentDay)){
      const curIdx = await getPointer();
      await setPointer(curIdx + 1);
    }
    await renderNextSession();
    await renderWeeklyGoals();
  }catch(e){
    console.error(e);
    showToast("Fehler: " + (e && e.message ? e.message : "unbekannt"));
  }
}

async function exportMarkdown(){
  const weeks = parseInt(document.getElementById("exportWeeks").value, 10) || 6;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - weeks * 7);
  const cutoffStr = cutoff.getFullYear() + "-" + String(cutoff.getMonth()+1).padStart(2,"0") + "-" + String(cutoff.getDate()).padStart(2,"0");

  let entries = [];
  try{
    const { data, error } = await sb
      .from("training_sessions")
      .select("day_key, session_date, data")
      .eq("person", PERSON)
      .gte("session_date", cutoffStr)
      .order("session_date", { ascending: true });
    if(error) throw error;
    entries = (data || []).map(row => ({ date: row.session_date, dayKey: row.day_key, data: row.data }));
  }catch(e){
    console.error("exportMarkdown", e);
    showToast("Fehler beim Export: " + e.message);
    return;
  }

  let md = `# Trainingslog Export – letzte ${weeks} Wochen (ab ${cutoffStr})\n\n`;
  if(entries.length === 0){
    md += "_Keine Sessions in diesem Zeitraum gespeichert._\n";
  } else {
    for(const entry of entries){
      md += `## ${entry.date} – ${DAYS[entry.dayKey] ? DAYS[entry.dayKey].title : entry.dayKey}\n\n`;
      const exNames = Object.keys(entry.data).filter(k => k !== "_notes" && k !== "_exnotes");
      if(exNames.length > 0){
        md += "| Übung | Werte |\n|---|---|\n";
        exNames.forEach(exName=>{
          const vals = entry.data[exName].map(v => v==="" || v===undefined ? "–" : v).join(" / ");
          md += `| ${exName} | ${vals} |\n`;
        });
        md += "\n";
      }
      if(entry.data["_exnotes"]){
        md += "**Übungsnotizen:**\n" + Object.keys(entry.data["_exnotes"]).map(k => `- ${k}: ${entry.data["_exnotes"][k]}`).join("\n") + "\n\n";
      }
      if(entry.data["_notes"]){
        md += `**Notizen:** ${entry.data["_notes"]}\n\n`;
      }
    }
  }

  const area = document.getElementById("exportArea");
  area.style.display = "block";
  area.value = md;
  area.focus();
  area.select();

  try{
    const blob = new Blob([md], {type:"text/markdown"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "trainingslog-export.md";
    a.click();
    URL.revokeObjectURL(url);
    showToast(entries.length + " Sessions exportiert");
  }catch(e){
    showToast("Text unten markiert – kopieren mit Strg/Cmd+C");
  }
}
document.getElementById("exportBtn").addEventListener("click", exportMarkdown);

async function renderSessionsList(){
  const holder = document.getElementById("sessionsListHolder");
  holder.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:8px 0;">Lade…</div>`;
  try{
    const { data, error } = await sb
      .from("training_sessions")
      .select("day_key, session_date, data")
      .eq("person", PERSON)
      .neq("day_key", META_KEY)
      .order("session_date", { ascending: false });
    if(error) throw error;
    if(!data || data.length === 0){
      holder.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:8px 0;">Noch keine Sessions gespeichert.</div>`;
      return;
    }
    holder.innerHTML = data.map(row=>{
      const et = typeOfKey(row.day_key) ? ENTRY_TYPES[typeOfKey(row.day_key)] : null;
      const title = DAYS[row.day_key] ? DAYS[row.day_key].title : (et ? et.icon + " " + et.label : row.day_key);
      const exCount = Object.keys(row.data || {}).filter(k => k !== "_notes" && k !== "_exnotes").length;
      const sub = et ? summarizeEntry(row.day_key, row.data) : `${title} · ${exCount} Übungen`;
      return `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:6px;">
          <div>
            <div style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;">${row.session_date}</div>
            <div style="font-size:11.5px;color:var(--text-muted);">${et ? title + " · " : ""}${sub}</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="editSessBtn" data-day="${row.day_key}" data-date="${row.session_date}" style="background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:7px;padding:7px 10px;font-size:11.5px;font-weight:600;">Bearbeiten</button>
            <button class="delSessBtn" data-day="${row.day_key}" data-date="${row.session_date}" style="background:transparent;border:1px solid var(--danger);color:var(--danger);border-radius:7px;padding:7px 10px;font-size:11.5px;font-weight:600;">Löschen</button>
          </div>
        </div>`;
    }).join("");
    holder.querySelectorAll(".delSessBtn").forEach(btn=>{
      btn.onclick = ()=> deleteSession(btn.getAttribute("data-day"), btn.getAttribute("data-date"));
    });
    holder.querySelectorAll(".editSessBtn").forEach(btn=>{
      btn.onclick = ()=> editSession(btn.getAttribute("data-day"), btn.getAttribute("data-date"));
    });
  }catch(e){
    console.error("renderSessionsList", e);
    holder.innerHTML = `<div style="font-size:12px;color:var(--danger);">Fehler beim Laden: ${e.message}</div>`;
  }
}

async function editSession(dayKey, date){
  if(!DAYS[dayKey]){
    // Lauf / Schwimmen / Körperwerte / Sonstiges: im Tages-Sheet bearbeiten
    document.getElementById("sessionsListHolder").style.display = "none";
    sessionsListOpen = false;
    await openDaySheet(typeOfKey(dayKey), date);
    return;
  }
  currentDay = dayKey;
  document.getElementById("sessionsListHolder").style.display = "none";
  sessionsListOpen = false;
  await init();
  document.getElementById("dateInput").value = date;
  await loadSessionInto(date);
  updateDayCard();
  window.scrollTo({top:0, behavior:"smooth"});
  showToast("Session vom " + date + " zum Bearbeiten geladen");
}

async function deleteSession(dayKey, date){
  const title = DAYS[dayKey] ? DAYS[dayKey].title : dayKey;
  if(!confirm(`Session ${date} (${title}) wirklich löschen? Das kann nicht rückgängig gemacht werden.`)) return;
  try{
    const { error } = await sb
      .from("training_sessions")
      .delete()
      .eq("person", PERSON)
      .eq("day_key", dayKey)
      .eq("session_date", date);
    if(error) throw error;
    showToast("Gelöscht");
    await renderSessionsList();
    if(dayKey === currentDay){
      await populateHistory();
      await renderStreak();
      await loadLastSession();
    }
  }catch(e){
    console.error("deleteSession", e);
    showToast("Fehler beim Löschen: " + e.message);
  }
}

document.getElementById("manageSessionsBtn").addEventListener("click", async ()=>{

// ---------- Tageseinträge: Lauf, Schwimmen, Körperwerte, Sonstiges (alle Einträge eines Tages) ----------
const ENTRY_TYPES = {
  lauf:      { key:"cardio_lauf",      label:"Lauf",        icon:"🏃" },
  schwimmen: { key:"cardio_schwimmen", label:"Schwimmen",   icon:"🏊" },
  koerper:   { key:"koerperwerte",     label:"Körperwerte", icon:"⚖️" },
  sonstiges: { key:"sonstiges",        label:"Sonstiges",   icon:"📝" },
};
const ENTRY_KEYS = Object.values(ENTRY_TYPES).map(t => t.key);
const typeOfKey = key => Object.keys(ENTRY_TYPES).find(t => ENTRY_TYPES[t].key === key) || null;

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function summarizeEntry(dayKey, d){
  d = d || {};
  if(dayKey === "koerperwerte"){
    const parts = [];
    if(d.gewicht_kg) parts.push(`⚖️ ${escapeHtml(d.gewicht_kg)} kg`);
    if(d.oberarm_links_cm) parts.push(`💪 ${escapeHtml(d.oberarm_links_cm)} cm`);
    if(d.bauchumfang_nabel_cm) parts.push(`📏 ${escapeHtml(d.bauchumfang_nabel_cm)} cm`);
    return parts.join(" · ") || "keine Werte";
  }
  return d.comment ? escapeHtml(d.comment) : "kein Kommentar";
}

async function fetchDayEntries(date){
  const { data, error } = await sb
    .from("training_sessions")
    .select("day_key, data")
    .eq("person", PERSON)
    .eq("session_date", date)
    .neq("day_key", META_KEY);
  if(error) throw error;
  return data || [];
}

let dayCardToken = 0;
async function updateDayCard(){
  const date = document.getElementById("dateInput").value || todayStr();
  document.getElementById("dayCardTitle").textContent = DAYS[currentDay].title;
  const wd = new Date(date + "T12:00:00").toLocaleDateString("de-DE", { weekday:"short" });
  const chip = date === todayStr() ? `<span class="chip">Heute</span>` : `<span class="chip warn">anderes Datum</span>`;
  document.getElementById("dayCardMeta").innerHTML = `${wd} ${fmtShort(date)}${date.slice(0,4)} ${chip}`;
  const token = ++dayCardToken;
  try{
    const have = new Set((await fetchDayEntries(date)).map(r => r.day_key));
    if(token !== dayCardToken) return;
    document.querySelectorAll("#quickRow button").forEach(b => b.classList.toggle("has", have.has(ENTRY_TYPES[b.dataset.type].key)));
  }catch(e){ console.error("updateDayCard", e); }
}

// ----- Sheet -----
let sheetDate = null;
let sheetLoaded = null;           // Zustand beim Laden (für "geändert?")
let sheetExisting = {};           // type -> true, wenn für den Tag schon ein Eintrag existiert
let sheetArmed = new Set();       // Lauf/Schwimmen ohne Kommentar speichern: wer den Button angetippt oder getippt hat
let sheetBodyTime = "";

function buildSheetSections(){
  const box = document.getElementById("sheetSections");
  const textSec = (type, ph) => `
    <section class="sec" data-type="${type}">
      <h3><span>${ENTRY_TYPES[type].icon} ${ENTRY_TYPES[type].label}</span><span class="st" id="sheetSt-${type}"></span></h3>
      <textarea id="sheetComment-${type}" placeholder="${ph}"></textarea>
      <button class="secdel" id="sheetDel-${type}" hidden>Eintrag löschen</button>
    </section>`;
  box.innerHTML =
    textSec("lauf", "Distanz, Zeit, wie es sich angefühlt hat …") +
    textSec("schwimmen", "z. B. 300 m kraulen und 200 m Brust …") +
    `<section class="sec" data-type="koerper">
      <h3><span>${ENTRY_TYPES.koerper.icon} ${ENTRY_TYPES.koerper.label}</span><span class="st" id="sheetSt-koerper"></span></h3>
      <div class="bodytime">Uhrzeit <input class="tm" type="time" id="sheetBodyTime"></div>
      <div class="bodygrid">
        <div><label>Gewicht (kg)</label><input class="num" type="number" step="0.1" inputmode="decimal" id="sheetBodyWeight" placeholder="71.5"></div>
        <div><label>Oberarm li. (cm)</label><input class="num" type="number" step="0.1" inputmode="decimal" id="sheetBodyArm" placeholder="31.5"></div>
        <div><label>Bauch (cm)</label><input class="num" type="number" step="0.1" inputmode="decimal" id="sheetBodyWaist" placeholder="85"></div>
      </div>
      <div class="bodyhint">Bauchumfang auf Nabelhöhe · am besten immer zur gleichen Zeit relativ zum Training messen</div>
      <button class="secdel" id="sheetDel-koerper" hidden>Eintrag löschen</button>
    </section>` +
    textSec("sonstiges", "Was hast du gemacht? (z. B. Bouldern, Rad, Wandern …)");
  ["lauf","schwimmen"].forEach(t=>{
    document.getElementById("sheetComment-"+t).addEventListener("input", ()=>{ sheetArmed.add(t); refreshSheetStatus(); });
  });
  document.getElementById("sheetComment-sonstiges").addEventListener("input", refreshSheetStatus);
  ["sheetBodyWeight","sheetBodyArm","sheetBodyWaist"].forEach(id=>document.getElementById(id).addEventListener("input", refreshSheetStatus));
  Object.keys(ENTRY_TYPES).forEach(t=>{
    document.getElementById("sheetDel-"+t).addEventListener("click", ()=> deleteSheetEntry(t));
  });
}
buildSheetSections();

function sheetState(){
  const g = id => document.getElementById(id).value.trim();
  return {
    lauf: g("sheetComment-lauf"), schwimmen: g("sheetComment-schwimmen"), sonstiges: g("sheetComment-sonstiges"),
    gewicht_kg: g("sheetBodyWeight"), oberarm_links_cm: g("sheetBodyArm"), bauchumfang_nabel_cm: g("sheetBodyWaist"),
  };
}
function sheetDirty(){
  if(!sheetLoaded) return false;
  const now = sheetState();
  return Object.keys(now).some(k => now[k] !== sheetLoaded[k]) || [...sheetArmed].some(t => !sheetExisting[t]);
}

function refreshSheetStatus(){
  const now = sheetState();
  const setSt = (type, text, ok) => { const el = document.getElementById("sheetSt-"+type); el.textContent = text; el.classList.toggle("ok", !!ok); };
  const bodyChanged = ["gewicht_kg","oberarm_links_cm","bauchumfang_nabel_cm"].some(k => now[k] !== sheetLoaded[k]);
  const changed = {
    lauf: now.lauf !== sheetLoaded.lauf, schwimmen: now.schwimmen !== sheetLoaded.schwimmen,
    sonstiges: now.sonstiges !== sheetLoaded.sonstiges, koerper: bodyChanged,
  };
  Object.keys(ENTRY_TYPES).forEach(t=>{
    const isNew = !sheetExisting[t] && (t === "lauf" || t === "schwimmen" ? sheetArmed.has(t) : changed[t]);
    if(changed[t] && sheetExisting[t]) setSt(t, "geändert – noch nicht gespeichert", false);
    else if(isNew) setSt(t, "neu – wird gespeichert", false);
    else if(sheetExisting[t]) setSt(t, "gespeichert ✓", true);
    else setSt(t, "", false);
    document.getElementById("sheetDel-"+t).hidden = !sheetExisting[t];
  });
}

async function loadSheetDate(date){
  sheetDate = date;
  document.getElementById("sheetDate").value = date;
  const trainingBox = document.getElementById("sheetTraining");
  trainingBox.innerHTML = "";
  let rows = [];
  try{ rows = await fetchDayEntries(date); }
  catch(e){ console.error("loadSheetDate", e); showToast("Fehler beim Laden: " + e.message); }
  if(sheetDate !== date) return; // währenddessen anderes Datum gewählt
  const byKey = Object.fromEntries(rows.map(r => [r.day_key, r.data || {}]));
  sheetExisting = {};
  Object.keys(ENTRY_TYPES).forEach(t => { sheetExisting[t] = byKey[ENTRY_TYPES[t].key] !== undefined; });
  const g = (key, f) => (byKey[key] && byKey[key][f] != null) ? String(byKey[key][f]) : "";
  const body = byKey.koerperwerte || {};
  sheetBodyTime = body.uhrzeit || "";
  if(!sheetExisting.koerper){
    const t = new Date();
    sheetBodyTime = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
  }
  document.getElementById("sheetComment-lauf").value = g("cardio_lauf","comment");
  document.getElementById("sheetComment-schwimmen").value = g("cardio_schwimmen","comment");
  document.getElementById("sheetComment-sonstiges").value = g("sonstiges","comment");
  document.getElementById("sheetBodyWeight").value = g("koerperwerte","gewicht_kg");
  document.getElementById("sheetBodyArm").value = g("koerperwerte","oberarm_links_cm");
  document.getElementById("sheetBodyWaist").value = g("koerperwerte","bauchumfang_nabel_cm");
  document.getElementById("sheetBodyTime").value = sheetBodyTime;
  sheetLoaded = sheetState();
  refreshSheetStatus();

  const trainings = rows.filter(r => DAYS[r.day_key]);
  trainingBox.innerHTML = trainings.map(r => `
    <div class="sheet-training">
      <span>🏋️ ${escapeHtml(DAYS[r.day_key].title)} · gespeichert</span>
      <button data-day="${r.day_key}">Öffnen</button>
    </div>`).join("");
  trainingBox.querySelectorAll("button").forEach(btn => btn.onclick = async ()=>{
    if(!confirmDiscard()) return;
    closeDaySheet(true);
    await editSession(btn.getAttribute("data-day"), date);
  });
  document.querySelectorAll("#sheetRecent .recent-row").forEach(r => r.classList.toggle("cur", r.dataset.date === date));
}

function confirmDiscard(){
  return !sheetDirty() || confirm("Ungespeicherte Änderungen verwerfen?");
}
async function gotoSheetDate(date){
  if(!date || date === sheetDate) return;
  if(!confirmDiscard()){ document.getElementById("sheetDate").value = sheetDate; return; }
  sheetArmed = new Set();
  await loadSheetDate(date);
}
function shiftDate(iso, days){
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + days);
  return fmtDate(d);
}

async function openDaySheet(type, date){
  const sheet = document.getElementById("daySheet");
  sheetArmed = new Set();
  if(type === "lauf" || type === "schwimmen") sheetArmed.add(type);
  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  await loadSheetDate(date || document.getElementById("dateInput").value || todayStr());
  // Schon vorhandener Eintrag -> nicht als "neu" markieren
  [...sheetArmed].forEach(t => { if(sheetExisting[t]) sheetArmed.delete(t); });
  refreshSheetStatus();
  document.querySelectorAll("#sheetSections .sec").forEach(sec => sec.classList.toggle("focus", sec.dataset.type === type));
  const sec = document.querySelector(`#sheetSections .sec[data-type="${type}"]`);
  if(sec){
    // Nur scrollen, wenn der Abschnitt nicht ohnehin sichtbar ist (Körper/Sonstiges weiter unten)
    const body = document.getElementById("sheetBody");
    const secTop = sec.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop;
    if(secTop + sec.offsetHeight > body.clientHeight) body.scrollTop = Math.max(0, secTop - 8);
    const first = sec.querySelector("textarea, input.num");
    if(first && !sheetExisting[type]) first.focus({ preventScroll:true });
  }
  renderSheetRecent();
}

function closeDaySheet(force){
  if(!force && !confirmDiscard()) return;
  const sheet = document.getElementById("daySheet");
  sheet.classList.remove("open");
  sheet.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  sheetLoaded = null;
}

async function afterEntriesChanged(){
  await updateDayCard();
  await renderWeeklyGoals();
  if(typeof sessionsListOpen !== "undefined" && sessionsListOpen) await renderSessionsList();
}

async function saveSheet(){
  const date = sheetDate;
  const st = sheetState();
  const now = new Date().toISOString();
  const rows = [];
  const names = [];
  const addRow = (type, data) => {
    rows.push({ person: PERSON, day_key: ENTRY_TYPES[type].key, session_date: date, data, updated_at: now });
    names.push(ENTRY_TYPES[type].label);
  };
  ["lauf","schwimmen"].forEach(t=>{
    const changed = st[t] !== sheetLoaded[t];
    if(changed || (sheetArmed.has(t) && !sheetExisting[t])) addRow(t, { comment: st[t] });
  });
  if(st.sonstiges !== sheetLoaded.sonstiges){
    if(st.sonstiges) addRow("sonstiges", { comment: st.sonstiges });
    else showToast("Sonstiges ist leer – zum Entfernen „Eintrag löschen“ nutzen");
  }
  const bodyKeys = ["gewicht_kg","oberarm_links_cm","bauchumfang_nabel_cm"];
  if(bodyKeys.some(k => st[k] !== sheetLoaded[k])){
    if(bodyKeys.some(k => st[k])){
      addRow("koerper", { uhrzeit: document.getElementById("sheetBodyTime").value, gewicht_kg: st.gewicht_kg, oberarm_links_cm: st.oberarm_links_cm, bauchumfang_nabel_cm: st.bauchumfang_nabel_cm });
    } else {
      showToast("Körperwerte sind leer – zum Entfernen „Eintrag löschen“ nutzen");
    }
  }
  if(rows.length === 0){ if(!document.getElementById("toast").classList.contains("show")) showToast("Nichts zu speichern"); return; }
  try{
    const { error } = await sb.from("training_sessions").upsert(rows, { onConflict: "person,day_key,session_date" });
    if(error) throw error;
    closeDaySheet(true);
    showToast("Gespeichert (" + date.slice(8) + "." + date.slice(5,7) + ".): " + names.join(", "));
    await afterEntriesChanged();
  }catch(e){
    console.error("saveSheet", e);
    showToast("Fehler: " + e.message);
  }
}

async function deleteSheetEntry(type){
  const t = ENTRY_TYPES[type];
  if(!confirm(`${t.icon} ${t.label} vom ${sheetDate} wirklich löschen?`)) return;
  try{
    const { error } = await sb.from("training_sessions").delete()
      .eq("person", PERSON).eq("day_key", t.key).eq("session_date", sheetDate);
    if(error) throw error;
    showToast("Gelöscht");
    sheetArmed.delete(type);
    await loadSheetDate(sheetDate);
    await renderSheetRecent();
    await afterEntriesChanged();
  }catch(e){
    console.error("deleteSheetEntry", e);
    showToast("Fehler beim Löschen: " + e.message);
  }
}

async function renderSheetRecent(){
  const holder = document.getElementById("sheetRecent");
  try{
    const { data, error } = await sb
      .from("training_sessions")
      .select("day_key, session_date, data")
      .eq("person", PERSON)
      .in("day_key", ENTRY_KEYS)
      .order("session_date", { ascending: false })
      .limit(80);
    if(error) throw error;
    if(!data || data.length === 0){ holder.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:6px 2px;">Noch keine Einträge.</div>`; return; }
    // Körperwerte: Veränderung zum vorherigen Eintrag
    const body = data.filter(r => r.day_key === "koerperwerte");
    const delta = (row, field) => {
      const i = body.indexOf(row), prev = body[i+1];
      if(!prev) return "";
      const diff = parseFloat((row.data||{})[field]) - parseFloat((prev.data||{})[field]);
      if(isNaN(diff) || diff === 0) return "";
      return ` <span style="color:${diff > 0 ? "var(--danger)" : "var(--accent)"};font-size:10.5px;">(${diff > 0 ? "+" : "−"}${Math.abs(diff).toFixed(1)})</span>`;
    };
    const byDate = new Map();
    data.forEach(r => { if(!byDate.has(r.session_date)) byDate.set(r.session_date, []); byDate.get(r.session_date).push(r); });
    holder.innerHTML = [...byDate.entries()].slice(0, 30).map(([date, rows])=>{
      const lines = rows.map(r=>{
        const t = ENTRY_TYPES[typeOfKey(r.day_key)];
        if(r.day_key === "koerperwerte"){
          const d = r.data || {}, parts = [];
          if(d.gewicht_kg) parts.push(`${escapeHtml(d.gewicht_kg)} kg${delta(r,"gewicht_kg")}`);
          if(d.oberarm_links_cm) parts.push(`💪 ${escapeHtml(d.oberarm_links_cm)}${delta(r,"oberarm_links_cm")}`);
          if(d.bauchumfang_nabel_cm) parts.push(`📏 ${escapeHtml(d.bauchumfang_nabel_cm)}${delta(r,"bauchumfang_nabel_cm")}`);
          return `${t.icon} ${parts.join(" · ") || "keine Werte"}`;
        }
        return `${t.icon} ${summarizeEntry(r.day_key, r.data)}`;
      });
      const wd = new Date(date + "T12:00:00").toLocaleDateString("de-DE", { weekday:"short" });
      return `<button class="recent-row${date === sheetDate ? " cur" : ""}" data-date="${date}"><span class="rd">${wd} ${fmtShort(date)}${date.slice(0,4) === String(new Date().getFullYear()) ? "" : date.slice(2,4)}</span><span class="rs">${lines.join("<br>")}</span></button>`;
    }).join("");
    holder.querySelectorAll(".recent-row").forEach(btn => btn.onclick = async ()=>{
      await gotoSheetDate(btn.dataset.date);
      document.getElementById("sheetBody").scrollTop = 0;
    });
  }catch(e){
    console.error("renderSheetRecent", e);
    holder.innerHTML = `<div style="font-size:11.5px;color:var(--danger);">Fehler beim Laden: ${e.message}</div>`;
  }
}

// ---------- Wochen-Übersicht (diese Woche + aufklappbar 11 weitere, Montag-Start) ----------
function mondayOf(dateObj){
  const d = new Date(dateObj);
  const day = d.getDay(); // 0=So, 1=Mo, ...
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
// ISO-Kalenderwoche (Montag-Start), z. B. 41
function isoWeek(dateObj){
  const d = new Date(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
}
function fmtDate(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

// Wochen-Übersicht: Zustand bleibt über Neuzeichnen (z. B. nach dem Speichern) erhalten
let weeklyCount = 12;      // wie viele Wochen geladen sind (inkl. dieser)
let weeklyOpen = false;    // Verlauf aufgeklappt?
const WEEKLY_STEP = 12;

async function renderWeeklyGoals(){
  const holder = document.getElementById("weeklyGoalsHolder");
  const thisMonday = mondayOf(new Date());
  const weekStarts = Array.from({length: weeklyCount}, (_,i) => { const d = new Date(thisMonday); d.setDate(d.getDate() - i*7); return d; });
  const earliestMonday = weekStarts[weekStarts.length-1];

  try{
    const { data, error } = await sb
      .from("training_sessions")
      .select("day_key, session_date")
      .eq("person", PERSON)
      .neq("day_key", META_KEY)
      .gte("session_date", fmtDate(earliestMonday))
      .order("session_date", { ascending: false });
    if(error) throw error;
    // Gibt es noch ältere Einträge als die geladenen Wochen? Dann "Mehr laden" anbieten.
    const { data: oldest, error: oldErr } = await sb
      .from("training_sessions")
      .select("session_date")
      .eq("person", PERSON)
      .neq("day_key", META_KEY)
      .order("session_date", { ascending: true })
      .limit(1);
    if(oldErr) throw oldErr;
    const hasMore = !!(oldest && oldest[0] && oldest[0].session_date < fmtDate(earliestMonday));

    const weeks = weekStarts.map(start=>{
      const end = new Date(start); end.setDate(end.getDate() + 7);
      const rows = (data || []).filter(r => r.session_date >= fmtDate(start) && r.session_date < fmtDate(end));
      const lauf = rows.filter(r => r.day_key === "cardio_lauf").length;
      const schwimmen = rows.filter(r => r.day_key === "cardio_schwimmen").length;
      const koerper = rows.filter(r => r.day_key === "koerperwerte").length;
      const training = rows.filter(r => Object.keys(DAYS).includes(r.day_key)).length;
      return { start, lauf, schwimmen, koerper, training };
    });

    const counts = w => `${w.koerper ? "⚖️ " + w.koerper + " · " : ""}🏋️ ${w.training} · 🏃 ${w.lauf} · 🏊 ${w.schwimmen}`;
    const weekLabel = (w, i) => i === 1 ? "Letzte Woche" : `KW ${isoWeek(w.start)}`;
    const yearNow = new Date().getFullYear();
    const startLabel = w => fmtShort(fmtDate(w.start)) + (w.start.getFullYear() === yearNow ? "" : String(w.start.getFullYear()).slice(2));
    const rowHtml = (w, i) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--line);">
        <span style="font-size:11.5px;color:var(--text-muted);">${weekLabel(w, i)} <span style="font-family:'IBM Plex Mono',monospace;">· ab ${startLabel(w)}</span></span>
        <span style="font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--text);">${counts(w)}</span>
      </div>`;
    const recent = weeks.slice(1,3).map((w,i)=> rowHtml(w, i+1)).join("");
    const older = weeks.slice(3).map((w,i)=> rowHtml(w, i+3)).join("");

    holder.innerHTML = `<div style="margin:0 16px 14px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 0 5px;">
        <span style="display:flex;align-items:center;gap:9px;">
          <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;">Diese Woche</span>
          <button id="weeklyHistBtn" aria-expanded="${weeklyOpen}" style="background:var(--surface-2);border:1px solid var(--line);color:var(--text-muted);border-radius:7px;padding:3px 8px;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;">⏱ Verlauf ${weeklyOpen ? "▴" : "▾"}</button>
        </span>
        <span style="font-size:12.5px;font-family:'IBM Plex Mono',monospace;font-weight:600;">${counts(weeks[0])}</span>
      </div>
      ${recent}
      <div id="weeklyHistoryHolder" style="display:${weeklyOpen ? "block" : "none"};">
        ${older}
        ${hasMore ? `<button id="weeklyMoreBtn" style="width:100%;margin-top:6px;background:none;border:1px dashed var(--line);color:var(--text-muted);border-radius:8px;padding:8px;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;">Mehr laden (${WEEKLY_STEP} weitere Wochen)</button>`
                   : `<div style="font-size:11px;color:var(--text-muted);padding:8px 0 2px;text-align:center;">Das war der Anfang – ältere Einträge gibt es nicht.</div>`}
      </div>
    </div>`;

    document.getElementById("weeklyHistBtn").addEventListener("click", ()=>{
      weeklyOpen = !weeklyOpen;
      document.getElementById("weeklyHistoryHolder").style.display = weeklyOpen ? "block" : "none";
      const btn = document.getElementById("weeklyHistBtn");
      btn.setAttribute("aria-expanded", String(weeklyOpen));
      btn.textContent = "⏱ Verlauf " + (weeklyOpen ? "▴" : "▾");
    });
    const more = document.getElementById("weeklyMoreBtn");
    if(more) more.addEventListener("click", async ()=>{
      more.disabled = true; more.textContent = "Lade …";
      weeklyCount += WEEKLY_STEP;
      await renderWeeklyGoals();
    });
  }catch(e){
    console.error("renderWeeklyGoals", e);
    holder.innerHTML = "";
  }
}

async function bootstrap(){
  const idx = await getPointer();
  const key = SEQUENCE[idx];
  currentDay = key || "l2a"; // Review-Slot -> Fallback L2A

  // Max. eine normale Trainingseinheit pro Tag: falls für heute schon EIN Tag (egal welcher)
  // geloggt wurde, den direkt öffnen statt des Zeiger-Vorschlags.
  try{
    const dayKeys = Object.keys(DAYS);
    const { data, error } = await sb
      .from("training_sessions")
      .select("day_key")
      .eq("person", PERSON)
      .eq("session_date", todayStr())
      .in("day_key", dayKeys)
      .maybeSingle();
    if(!error && data){ currentDay = data.day_key; }
  }catch(e){ console.error("bootstrap today-check", e); }

  await init();
}
bootstrap();
renderWeeklyGoals();

// "Laufen, Körperwerte & mehr": Auf/Zu-Zustand pro Gerät merken (reine Bequemlichkeit).
(function(){
  const more = document.getElementById("moreEntries");
  try{ if(localStorage.getItem("moreEntriesOpen") === "1") more.open = true; }catch(e){}
  more.addEventListener("toggle", ()=>{ try{ localStorage.setItem("moreEntriesOpen", more.open ? "1" : "0"); }catch(e){} });
})();
</script>
